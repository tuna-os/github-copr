# Build Order Manifest for GNOME 50 on CentOS Stream 10
#
# Packages within a tier build in parallel; tiers are sequential.
# Each package entry is a path relative to the repo root.

target: centos-stream-10-x86_64

tiers:
  # Tier 0: Pure build tools with zero internal dependencies.
  - name: base-tools
    packages:
      - path: src/deps/meson
        build_tool: true
      - path: src/deps/autoconf
        build_tool: true
      - path: src/deps/libldac
      - path: src/deps/python-smartypants
        build_tool: true
      - path: src/deps/python-typogrify
        build_tool: true
      - path: src/deps/gnome50-el10-compat
      - path: src/deps/selinux-policy
      - copr_name: graphviz
      # sqlcipher was copr_name-only, so the GitHub chain skipped it and the
      # buildroot silently took it from the COPR repo -- until #113 removed
      # that fallback and libgda died with 'No matching package to install:
      # sqlcipher-devel' (run 30676231208). Built by both pipelines now.
      - path: src/deps/sqlcipher
        copr_name: sqlcipher

  # Tier 1: Needs tools from Tier 0.
  - name: build-tools
    packages:
      - path: src/deps/wayland-protocols
        build_tool: true
      - path: src/deps/harfbuzz
        build_tool: true
      - path: src/deps/libxcvt
        build_tool: true
      - path: src/deps/shaderc
        build_tool: true
      - path: src/deps/gi-docgen
        build_tool: true
      - copr_name: vala

  # Tier 3: Bootstrap GLib.
  - name: glib2-bootstrap
    packages:
      - path: src/gnome-50/glib2
        spec_override: glib2-bootstrap.spec

  # Tier 4: Base libraries needing GLib bootstrap.
  - name: bootstrap-libs
    packages:
      - path: src/deps/libei
      - path: src/deps/mozjs140
        copr_name: mozjs140
      - path: src/deps/libzip
      - path: src/deps/fontconfig

  # Tier 5: Cairo (Needs GLib bootstrap).
  - name: cairo-layer
    packages:
      - path: src/deps/cairo

  # Tier 6: GI Bootstrap (Needs Cairo).
  - name: gi-bootstrap
    packages:
      - path: src/gnome-50/gobject-introspection
        spec_override: gobject-introspection-bootstrap.spec

  # Tier 7: Full GLib (Needs GI Bootstrap).
  - name: glib2-full
    packages:
      - path: src/gnome-50/glib2

  # Tier 8: Full GI (Needs Full GLib).
  - name: gi-full
    packages:
      - path: src/gnome-50/gobject-introspection

  # Tier 9: High-level libraries/tools needing GI/GLib full.
  - name: core-libraries
    packages:
      - path: src/deps/pango
      - path: src/deps/tinysparql
      - path: src/deps/pipewire
      - path: src/deps/libglib-testing
      # simdutf was copr_name-only: vte291 died on pkgconfig(simdutf) once the
      # COPR fallback was gone (run 30712269949) -- the sqlcipher story again.
      - path: src/deps/simdutf
        copr_name: simdutf
      # localsearch needs pkgconfig(gexiv2-0.16); nothing in el10/EPEL provides
      # it. src/deps/libgexiv2 (0.16.0) was already imported but never wired
      # into the manifest, so no tier ever built it (run 30712269949).
      - path: src/deps/libgexiv2
      - copr_name: libgee
      - path: src/deps/libsoup

  # Tier 10: System Tools & GJS.
  - name: system-tools
    packages:
      - path: src/deps/umockdev
        build_tool: true
      - path: src/deps/python-dbusmock
        copr_name: python-dbusmock
        build_tool: true
      - path: src/deps/avahi
      - path: src/gnome-50/gjs

  # Tier 11: GTK Core.
  - name: gtk-core
    packages:
      - path: src/gnome-50/gsettings-desktop-schemas
      - path: src/gnome-50/gnome-desktop3
      # gdk-pixbuf2 2.44.x merges the modules subpackage (Obsoletes +
      # Provides). Must build here before gtk4/glycin so the local-build
      # gdk-pixbuf2 provides gdk-pixbuf2-modules — otherwise EL10's gtk3
      # (pulled into gtk4's builddep via gstreamer1-plugins-bad-free) can't
      # install and gtk4 dies.
      - path: src/deps/gdk-pixbuf2
      - path: src/deps/gtk4
      - copr_name: highway         # runtime dep of glycin-loaders (bundled libjxl); in EPEL10 but explicit here for self-contained COPR
      - path: src/deps/glycin
      - path: src/deps/libgda

  # Tier 12: Desktop Foundations.
  - name: desktop-foundations
    packages:
      - path: src/gnome-50/libadwaita
      - path: src/gnome-50/xdg-desktop-portal
      - path: src/deps/localsearch
      - path: src/deps/vte291
        spec_override: vte291.spec

  # Tier 12b: Parental controls stack (needs gtk4, libadwaita, flatpak).
  - name: parental-controls
    packages:
      - path: src/deps/malcontent

  # Tier 13: Compositor & Shell.
  - name: shell-foundations
    packages:
      - path: src/gnome-50/gnome-settings-daemon
      - path: src/gnome-50/mutter

  # Tier 14: The Shell and Portal integration.
  - name: gnome-shell
    packages:
      - path: src/gnome-50/gnome-shell
      - path: src/gnome-50/xdg-desktop-portal-gnome
      - path: src/gnome-50/nautilus

  # Tier 15: Session & Control Center.
  - name: session-layer
    packages:
      - path: src/gnome-50/gnome-session
      - path: src/gnome-50/gnome-control-center
      - path: src/gnome-50/gdm
      - copr_name: ptyxis

  # Tier 16: Post-session packages that depend on GDM/gnome-shell.
  - name: post-session
    packages:
      - path: src/gnome-50/gnome-initial-setup
