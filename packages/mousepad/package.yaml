# mousepad recipe for EL10 (#121).
schema: 1
name: mousepad
version: "0.6.3"
release: 1
summary: Simple text editor for the Xfce desktop environment
description: >-
  Mousepad is a simple text editor for the Xfce desktop environment based on
  Leafpad. Its main advantage is fast loading and ease of use.
license: GPL-2.0-or-later
source:
  url: https://archive.xfce.org/src/apps/mousepad/0.6/mousepad-0.6.3.tar.bz2
  sha256: feed5bbf6c63b4007b8eb5a693c0bc5c378aa46d5c317ff6ff732c25bc20c57d
  directory: mousepad-0.6.3
build_system: meson
dependencies:
  build:
    common: [meson, ninja-build, pkg-config, gettext]
    capabilities: [c-compiler]
    targets:
      el10: [gtk3-devel, gtksourceview4-devel, libxfce4ui-devel, xfconf-devel, glib2-devel, gspell-devel]
files:
  common:
    - usr/bin/mousepad
    - usr/share/applications/org.xfce.mousepad.desktop
    - usr/share/icons/hicolor/*/apps/org.xfce.mousepad*
    - usr/share/locale/*/LC_MESSAGES/mousepad.mo
    - usr/share/man/man1/mousepad.1*
    - usr/share/metainfo/org.xfce.mousepad.appdata.xml
    - usr/share/glib-2.0/schemas/org.xfce.mousepad.gschema.xml
    - usr/share/polkit-1/actions/org.xfce.mousepad.policy
verify:
  smoke: mousepad --help
targets: [el10]
