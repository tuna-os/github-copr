schema: 1
name: bazaar
version: "0.9.1"
release: 1
summary: Curated Flatpak application store
description: >-
  Native GTK application store used by the Bluefin and Aurora desktop
  experiences to discover and install Flatpak applications.
license: GPL-3.0-or-later
source:
  url: https://github.com/bazaar-org/bazaar/archive/refs/tags/v0.9.1.tar.gz
  sha256: 1b2783845b183a9cea87048e582dcbdd71d7771a7f65f89d7ec8a563af2d550f
  directory: bazaar-0.9.1
build_system: meson
dependencies:
  build:
    common: [meson, pkg-config]
    targets:
      # Bazaar 0.9 requires GTK 4.22 and libadwaita 1.8.  Those versions are
      # supplied by the current GNOME targets below, not stock EL10.  EL10 is
      # enabled only after the Tideforge GNOME 50 repository is staged.
      ubuntu: [build-essential, gettext, python3-babel, libgtk-4-dev, libadwaita-1-dev, libdex-dev, libflatpak-dev, libappstream-dev, libxmlb-dev, libyaml-dev, libsoup-3.0-dev, libjson-glib-dev, libglycin-2-dev, libglycin-gtk4-2-dev, libwebkitgtk-6.0-dev, libsecret-1-dev, libproxy-dev, libmalcontent-0-dev, libgtksourceview-5-dev, blueprint-compiler, libmd4c-dev, libxml2-utils, desktop-file-utils]
      debian: [build-essential, gettext, python3-babel, libgtk-4-dev, libadwaita-1-dev, libdex-dev, libflatpak-dev, libappstream-dev, libxmlb-dev, libyaml-dev, libsoup-3.0-dev, libjson-glib-dev, libglycin-2-dev, libglycin-gtk4-2-dev, libwebkitgtk-6.0-dev, libsecret-1-dev, libproxy-dev, libmalcontent-0-dev, libgtksourceview-5-dev, blueprint-compiler, libmd4c-dev, libxml2-utils, desktop-file-utils]
      arch: [base-devel, meson, gettext, python-babel, glib2-devel, gtk4, libadwaita, libdex, flatpak, appstream, libxmlb, libyaml, libsoup3, json-glib, glycin, glycin-gtk4, webkitgtk-6.0, libsecret, libproxy, malcontent, gtksourceview5, blueprint-compiler, md4c, libxml2]
  runtime:
    capabilities: [flatpak]
    targets:
      arch:
        - accountsservice
        - acl
        - aom
        - appstream
        - avahi
        - brotli
        - bzip2
        - cairo
        - composefs
        - curl
        - dav1d
        - dbus
        - dconf
        - duktape
        - e2fsprogs
        - enchant
        - expat
        - flatpak
        - fontconfig
        - freetype2
        - fribidi
        - gdk-pixbuf2
        - glib2
        - glibc
        - glycin
        - glycin-gtk4
        - gmp
        - gnutls
        - gpgme
        - graphene
        - graphite
        - gst-plugins-bad-libs
        - gst-plugins-base-libs
        - gstreamer
        - gtk4
        - gtksourceview5
        - harfbuzz
        - harfbuzz-icu
        - hidapi
        - highway
        - hyphen
        - icu
        - jbigkit
        - json-glib
        - keyutils
        - krb5
        - lcms2
        - leancrypto
        - libadwaita
        - libarchive
        - libassuan
        - libatomic
        - libavif
        - libcloudproviders
        - libcolord
        - libcups
        - libdatrie
        - libdeflate
        - libdex
        - libdrm
        - libelf
        - libepoxy
        - libevdev
        - libffi
        - libfyaml
        - libgcc
        - libgcrypt
        - libglvnd
        - libgpg-error
        - libgudev
        - libidn2
        - libjpeg-turbo
        - libjxl
        - libmalcontent
        - libmanette
        - libnghttp2
        - libnghttp3
        - libngtcp2
        - libp11-kit
        - libpng
        - libproxy
        - libpsl
        - libseccomp
        - libsecret
        - libsodium
        - libsoup3
        - libssh2
        - libstdc++
        - libstemmer
        - libtasn1
        - libthai
        - libtiff
        - libunistring
        - libunwind
        - liburing
        - libwebp
        - libx11
        - libxau
        - libxcb
        - libxcrypt
        - libxcursor
        - libxdamage
        - libxdmcp
        - libxext
        - libxfixes
        - libxi
        - libxinerama
        - libxkbcommon
        - libxml2
        - libxmlb
        - libxrandr
        - libxrender
        - libxslt
        - libyaml
        - libyuv
        - lz4
        - lzo
        - md4c
        - mesa
        - nettle
        - openssl
        - orc
        - ostree
        - pango
        - pcre2
        - pixman
        - polkit
        - rav1e
        - sqlite
        - svt-av1
        - systemd-libs
        - tinysparql
        - tpm2-tss
        - util-linux-libs
        - vulkan-icd-loader
        - wayland
        - webkitgtk-6.0
        - xz
        - zlib
        - zstd
files:
  common:
    - usr/bin/bazaar
    - usr/bin/bazaar-dl-worker
    - usr/bin/bazaar-refresh-worker
    - usr/share/applications/io.github.kolunmi.Bazaar.desktop
    - usr/share/metainfo/io.github.kolunmi.Bazaar.metainfo.xml
    - usr/lib*/systemd/user/io.github.kolunmi.Bazaar.service
    - usr/share/dbus-1/services/io.github.kolunmi.Bazaar.service
    - usr/share/gnome-shell/search-providers/io.github.kolunmi.Bazaar.search-provider.ini
verify:
  smoke: "test -x /usr/bin/bazaar && test -x /usr/bin/bazaar-dl-worker && test -x /usr/bin/bazaar-refresh-worker"
targets: [ubuntu, debian, arch]
