schema: 1
name: libunwind-devel
version: "1.8.1"
# release 2, not 1. The BROKEN build is published as libunwind-devel-1.8.1-1
# at rpm/el10/aarch64 — the one whose libunwind.so.8 carries four undefined
# __aarch64_* symbols and no libgcc_s in NEEDED (#469). The LIBS: -lgcc_s fix
# below changes the bytes but not the version, so republishing at release 1
# would ship a different artifact under an identical NVR: dnf would see no
# upgrade, consumers holding the broken one would keep it, and two distinct
# builds would claim the same name-version-release.
release: 2
summary: Portable stack-unwinding library development files
description: Headers and shared libraries required to build cpptrace with signal-safe stack unwinding.
license: MIT
source:
  url: https://github.com/libunwind/libunwind/archive/refs/tags/v1.8.1.tar.gz
  sha256: 38833b7b1582db7d76485a62a213706c9252b3dab7380069fea5824e823d8e41
  directory: libunwind-1.8.1
build_system: autotools
build:
  autoreconf: true
  configure_options: [--disable-tests]
  environment:
    # aarch64 GCC emits outline-atomics calls (__aarch64_cas8_acq_rel and
    # friends) that live in libgcc. libunwind's link line does not pull it in,
    # so the shipped libunwind.so.8 carried four UNDEFINED symbols and every
    # consumer died at load: "symbol lookup error: /lib64/libunwind.so.8"
    # (#469, seen on tideforge-quickshell-el10-aarch64).
    #
    # LIBS rather than LDFLAGS: LDFLAGS is already set by the distro's
    # hardened build macros, and replacing it would silently drop relro,
    # -z now and the annobin specs. LIBS appends to the link line instead.
    LIBS: -lgcc_s
dependencies:
  build:
    # No common list: it held RPM names (gcc-c++) that leaked into the deb
    # Build-Depends, where no such package exists. Each target already names
    # its own complete toolchain.
    targets:
      el10: [gcc-c++, autoconf, automake, libtool]
      ubuntu: [build-essential, autoconf, automake, libtool]
      debian: [build-essential, autoconf, automake, libtool]
      opensuse-tumbleweed: [gcc-c++, autoconf, automake, libtool]
      arch: [base-devel, autoconf, automake, libtool]
  runtime:
    targets:
      arch: [xz]
files:
  common: [usr/include/libunwind.h, usr/include/unwind.h]
outputs:
  rpm:
    files: [usr/include/libunwind*.h, usr/include/unwind.h, usr/lib64/libunwind*.so*, usr/lib64/libunwind*.a, usr/lib64/pkgconfig/libunwind*.pc]
  deb:
    packages:
      - name: libunwind-dev
        summary: Portable stack-unwinding library development files
        description: Headers and shared libraries for libunwind.
        files: [usr/include/libunwind*.h, usr/include/unwind.h, usr/lib/*/libunwind*.so*, usr/lib/*/libunwind*.a, usr/lib/*/pkgconfig/libunwind*.pc]
verify:
  smoke: "test -f /usr/include/libunwind.h && test -f /usr/include/unwind.h"
  # The deb output renders a package named libunwind-dev, not the recipe name.
  targets:
    ubuntu: {install_name: libunwind-dev}
    debian: {install_name: libunwind-dev}
targets: [el10, ubuntu, debian, opensuse-tumbleweed, arch]
