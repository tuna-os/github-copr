# ristretto recipe for EL10 (#121).
schema: 1
name: ristretto
version: "0.13.3"
release: 1
summary: Fast and lightweight image viewer for the Xfce desktop environment
description: >-
  Ristretto is a fast and lightweight image viewer for the Xfce desktop environment.
license: GPL-2.0-or-later
source:
  url: https://archive.xfce.org/src/apps/ristretto/0.13/ristretto-0.13.3.tar.bz2
  sha256: ae9ee7ff6bbcd3df5a610444319c52fe1ef78f0d8bdcdedabeb069c9b1bc1fd4
  directory: ristretto-0.13.3
build_system: meson
dependencies:
  build:
    common: [meson, ninja-build, pkg-config, gettext]
    capabilities: [c-compiler]
    targets:
      el10: [gtk3-devel, libxfce4ui-devel, xfconf-devel, glib2-devel, libexif-devel, libX11-devel, cairo-devel]
files:
  common:
    - usr/bin/ristretto
    - usr/share/applications/org.xfce.ristretto.desktop
    - usr/share/icons/hicolor/*/apps/org.xfce.ristretto*
    - usr/share/locale/*/LC_MESSAGES/ristretto.mo
    - usr/share/man/man1/ristretto.1*
    - usr/share/metainfo/org.xfce.ristretto.appdata.xml
verify:
  smoke: ristretto --help
targets: [el10]
