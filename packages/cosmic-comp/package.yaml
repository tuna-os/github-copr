schema: 1
name: cosmic-comp
version: "1.4.0"
release: 1
summary: Compositor for the COSMIC desktop environment
description: COSMIC Wayland compositor for the TunaOS Hummingbird desktop.
license: Apache-2.0 AND GPL-3.0-only AND MIT
source:
  url: https://github.com/pop-os/cosmic-comp/archive/epoch-1.4.0.tar.gz
  sha256: 713f2dfdfa0e1b6899a45fd7dec172fb0f299a60daff4a624b8432de43fa229b
  directory: cosmic-comp-epoch-1.4.0
sources:
  - url: https://src.fedoraproject.org/repo/pkgs/rpms/cosmic-comp/vendor-1.4.0.tar.gz/sha512/c49695f78fd82bfaf836a5c6a7259fce51d9ba8914232f8ef6402b6858f1c8420c54e90bbead4c9d807d96faf1dbb3f9281ec3fff4077f3de29d418da6916003/vendor-1.4.0.tar.gz
    sha256: 7979842db0a553b9c1f1e95521f320ce191c6e9ed212d4660c81e920e748d7b6
    filename: cosmic-comp-vendor.tar.gz
    destination: .
    strip_components: 0
  - url: https://src.fedoraproject.org/rpms/cosmic-comp/raw/1b11c8603055cd5f2a7a3edcfcd0631a6b4962d8/f/vendor-config-1.4.0.toml
    sha256: b0999a83483c6e0b0d8d3884b09bd7d968220a725996524d9d514f8f56bdb5c3
    filename: cosmic-comp-vendor-config.toml
    destination: .cargo/config.toml
    extract: false
build_system: custom
build:
  environment:
    VERGEN_GIT_SHA: 4d370cdf92b5d96d78032593947f4ad9eae793bf
    VERGEN_GIT_COMMIT_DATE: "2026-07-21 22:22:07 +0200"
    GIT_HASH: 4d370cdf92b5d96d78032593947f4ad9eae793bf
  commands: [cargo build --release --offline --frozen]
dependencies:
  build:
    # The #197 capabilities resolve the -dev names per target; rust carries
    # cargo, pkg-config is what the smithay build scripts probe through
    # (same lesson as cosmic-panel, run 30701973171). libglvnd has no
    # catalog entry: EGL/GL dev headers are libglvnd-devel on el10 and
    # libegl1-mesa-dev on deb, kept in the per-target lists.
    capabilities: [rust, pkg-config, wayland-dev, libxkbcommon-dev, libinput-dev, gbm-dev, pixman-dev, libdisplay-info-dev]
    targets:
      el10: [lld, make, libglvnd-devel, libseat-devel]
      ubuntu: [lld, make, libegl1-mesa-dev, libseat-dev]
      debian: [lld, make, libegl1-mesa-dev, libseat-dev]
  runtime:
    targets:
      el10: [libseat, libwayland-server, xorg-x11-server-Xwayland, cosmic-icon-theme >= 1.4.0]
      # Deb dependency syntax needs parentheses for versions; the unversioned
      # name suffices here because the gate stages the matching artifact.
      ubuntu: [libseat1, libwayland-server0, xwayland, cosmic-icon-theme]
      debian: [libseat1, libwayland-server0, xwayland, cosmic-icon-theme]
files:
  common:
    - usr/bin/cosmic-comp
    - usr/share/cosmic/com.system76.CosmicSettings.Shortcuts/v1/defaults
    - usr/share/cosmic/com.system76.CosmicSettings.WindowRules/v1/tiling_exception_defaults
install:
  commands: ["make install DESTDIR={destdir} prefix=/usr"]
verify:
  smoke: test -x /usr/bin/cosmic-comp && test -f /usr/share/cosmic/com.system76.CosmicSettings.Shortcuts/v1/defaults
targets: [el10, ubuntu, debian]
