schema: 1
name: krunner-bazaar
version: "1.3.0"
release: 1
summary: KRunner plugin for finding Flatpak applications with Bazaar
description: KDE KRunner plugin that searches Flatpak applications and hands installation to Bazaar.
license: Apache-2.0
source:
  url: https://github.com/bazaar-org/krunner-bazaar/archive/refs/tags/v1.3.0.tar.gz
  sha256: 793f59b414973b85160573b0d8d5f8fc38bd216d106f976a3c416c86b37a0d09
  directory: krunner-bazaar-1.3.0
build_system: cmake
dependencies:
  build:
    common: [cmake, gettext]
    targets:
      el10: [gcc-c++, extra-cmake-modules, kf6-kconfig-devel, kf6-krunner-devel, kf6-ki18n-devel, kf6-kcoreaddons-devel, qt6-qtbase-devel, kf6-rpm-macros]
      ubuntu: [g++, extra-cmake-modules, libkf6config-dev, libkf6runner-dev, libkf6i18n-dev, libkf6coreaddons-dev, qt6-base-dev]
      debian: [g++, extra-cmake-modules, libkf6config-dev, libkf6runner-dev, libkf6i18n-dev, libkf6coreaddons-dev, qt6-base-dev]
      opensuse-tumbleweed: [gcc-c++, extra-cmake-modules, kf6-kconfig-devel, kf6-krunner-devel, kf6-ki18n-devel, kf6-kcoreaddons-devel, qt6-base-devel, gettext-tools]
      arch: [extra-cmake-modules, kconfig, krunner, ki18n, kcoreaddons, qt6-base]
  runtime:
    common: [flatpak]
files:
  common:
    - usr/bin/bazaar-dbus-tool
    - usr/lib*/qt6/plugins/kf6/krunner/bazaarrunner.so
    - usr/share/locale/*/LC_MESSAGES/plasma_runner_bazaarrunner.mo
targets: [el10, ubuntu, debian, opensuse-tumbleweed, arch]
