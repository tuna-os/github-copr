schema: 1
name: quickshell
version: "0.3.0"
release: 1
summary: Flexible QtQuick-based desktop shell toolkit
description: A QtQuick desktop shell toolkit required by DankMaterialShell and TunaOS's Niri experience.
license: LGPL-3.0-or-later
source:
  url: https://github.com/quickshell-mirror/quickshell/archive/refs/tags/v0.3.0.tar.gz
  sha256: 5229069b0f1d375f34b0a04a4e6a69156e2f010995d9ec5a943793424e589b5d
  directory: quickshell-0.3.0
build_system: cmake
build:
  # EL10 carries no native jemalloc development package. Quickshell makes it
  # optional upstream; use its standard allocator path until a native package
  # becomes available.
  cmake_generator: Ninja
  # CMAKE_SKIP_INSTALL_RPATH: quickshell's CMake stamps
  # `RUNPATH: $ORIGIN:$ORIGIN/../lib64` onto /usr/bin/quickshell. For an
  # FHS install that is redundant -- from /usr/bin those resolve to /usr/bin
  # (no libraries) and /usr/lib64 (already on the default loader path) --
  # and rpmlint's `binary-or-shlib-defines-rpath` is in this factory's
  # curated fatal set, so the cell dies AFTER a clean 12-minute compile:
  #
  #   quickshell.aarch64: E: binary-or-shlib-defines-rpath /usr/bin/quickshell
  #   lint-generated-rpm: FATAL finding 'binary-or-shlib-defines-rpath'
  #
  # (tideforge-quickshell-el10-aarch64, run 32534325163.) An $ORIGIN RUNPATH
  # in a distro package is a genuine packaging defect rather than a lint
  # false positive, so this drops it at the source instead of exempting the
  # check. The cell's own `quickshell --help` smoke test is the backstop if
  # anything did depend on it.
  cmake_options: [-DUSE_JEMALLOC=OFF, -DCMAKE_SKIP_INSTALL_RPATH=ON]
dependencies:
  build:
    # Toolchain and Qt build-time deps are listed per-target: a common list
    # with gcc-c++ would leak into Arch where that package name does not
    # exist (Arch ships C and C++ compilers together as gcc).
    targets:
      # Per-target names are NOT cosmetic variants of each other; each list
      # below was wrong in a different way and each was measured, not guessed
      # (run 32541649752):
      #
      #   arch  - `pacman` reported `target not found` for cli11-devel,
      #           cpptrace-devel and ninja-build. Those are EL spellings.
      #           Arch ships all three in `extra` as cli11, cpptrace, ninja.
      #   suse  - the deps resolved fine and CMake then failed with
      #           `Failed to find required Qt component "QuickPrivate"`.
      #           QuickPrivate is in the DECLARATIVE private package, not the
      #           base one the list already carried.
      #   deb   - Debian sid installs libcli11-dev and libcpptrace-dev from
      #           its own archive; its only gap was ninja-build, since
      #           build.cmake_generator is Ninja.
      #
      # Round 2 (run 32548094304). Fixing the above uncovered the NEXT layer
      # on each, which is why these lists keep growing rather than being
      # wrong once:
      #
      #   arch  - reaches CMake now, then: find_package(VulkanHeaders) fails.
      #           el10 lists no vulkan package and still passes, so it comes
      #           in transitively there and not on Arch. vulkan-headers is in
      #           Arch `extra` (verified).
      #   suse  - QuickPrivate is gone; now `wayland-protocols>=1.41` is not
      #           found. el10 carries wayland-protocols and mesa-libgbm-devel;
      #           the openSUSE list carried neither.
      #
      # The openSUSE additions are pkgconfig() CAPABILITIES, not package
      # names, and that is deliberate: this environment cannot reach the
      # openSUSE package search (401/403), so a literal name would be a
      # guess. Every RPM distro exposes pkgconfig(foo) as a virtual provide,
      # so the capability resolves without knowing what openSUSE calls the
      # package — and it keeps resolving if the package is ever renamed.
      #
      # Quickshell uses Qt's private API.  EL10 supplies the corresponding
      # metadata in CRB as qt6-qtbase-private-devel.
      el10: [cmake, gcc-c++, qt6-qtbase-devel, qt6-qtbase-private-devel, qt6-qtdeclarative-devel, qt6-qtwayland-devel, qt6-qtshadertools-devel, pipewire-devel, pam-devel, polkit-devel, libdrm-devel, mesa-libgbm-devel, ninja-build, cli11-devel, cpptrace-devel, wayland-protocols]
      ubuntu: [cmake, g++, ninja-build, qt6-base-dev, qt6-declarative-dev, qt6-wayland-dev, qt6-shadertools-dev, libpipewire-0.3-dev, libpam0g-dev, libpolkit-gobject-1-dev, libdrm-dev, libjemalloc-dev, libcli11-dev, libcpptrace-dev]
      debian: [cmake, g++, ninja-build, qt6-base-dev, qt6-declarative-dev, qt6-wayland-dev, qt6-shadertools-dev, libpipewire-0.3-dev, libpam0g-dev, libpolkit-gobject-1-dev, libdrm-dev, libjemalloc-dev, libcli11-dev, libcpptrace-dev]
      opensuse-tumbleweed: [cmake, gcc-c++, qt6-base-private-devel, qt6-declarative-devel, qt6-declarative-private-devel, qt6-wayland-devel, qt6-shadertools-devel, pipewire-devel, pam-devel, polkit-devel, libdrm-devel, jemalloc-devel, cli11-devel, cpptrace-devel, 'pkgconfig(wayland-protocols)', 'pkgconfig(gbm)']
      arch: [cmake, gcc, qt6-base, qt6-declarative, qt6-wayland, qt6-shadertools, pipewire, pam, polkit, libdrm, jemalloc, cli11, cpptrace, ninja, wayland-protocols, vulkan-headers, libunwind]
files:
  common:
    - usr/bin/quickshell
    - usr/bin/qs
    - usr/share/applications/org.quickshell.desktop
    - usr/share/icons/hicolor/scalable/apps/org.quickshell.svg
verify:
  smoke: "quickshell --help"
targets: [el10, ubuntu, debian, opensuse-tumbleweed, arch]
