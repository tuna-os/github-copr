# Hummingbird buildroot.
#
# The base config used to be fedora-43-x86_64 on the claim that Hummingbird is
# "ABI-compatible with Fedora 43".  That was measured on 2026-08-06 against the
# target's own primary.xml (revision 1786016019) and is wrong by two releases:
#
#     package    hummingbird       fedora 43      fedora rawhide (45)
#     glib2      2.89.3-1.hum1     2.86.5-1       2.89.3-1.fc45
#     systemd    261.2-1.hum1      258.10-1       261.2-1.fc45
#     gcc        16.1.1-2.hum1     15.3.1-1       16.1.1-4.fc45.1
#     harfbuzz   14.3.0-1.hum1     —              14.3.0-1.fc45
#     rust       1.97.1-2.hum1     —              1.97.1-2.fc45
#     qt6-qtbase 6.11.1-5.hum1     —              6.11.1-5.fc45
#
# 30 of the 38 core packages present in both indexes are at the byte-identical
# upstream version-release as Rawhide and differ only in dist tag (.hum1 vs
# .fc45).  Rawhide is the correct base; F43 was silently pulling two-year-old
# build tools into the chroot for anything Hummingbird does not itself ship —
# which, per docs/hummingbird-desktop-gap.md, is the entire desktop stack.
#
# Rawhide is the right base for everything EXCEPT Python.  Hummingbird has not
# followed Rawhide through the Python 3.15 rebuild:
#
#     python3   3.14.6-2.2.hum1        3.15.0~rc1-1.fc45
#
# Every noarch Python module carries `Requires: python(abi) = <x.y>`, so a
# module built in Rawhide is not installable next to Hummingbird's interpreter.
# Measured 2026-08-08 against Rawhide's own index: 8919 of its 66644 binary
# packages transitively need python(abi) = 3.15 and therefore cannot enter this
# chroot at all.  That is what fails the eight python-* packages of tier
# niri-00 (runs 31231968581, 31242725235, 31248093019): %pyproject_buildrequires
# emits e.g. python3dist(flit-core), the only provider is Rawhide's 3.15 build,
# and dnf5 reports
#
#     python3-flit-core ... requires python(abi) = 3.15, but none of the
#     providers can be installed
#     installed package python3-pip-26.2-0.1.hum1.noarch requires
#     python(abi) = 3.14
#
# Fedora 44 is the release whose interpreter is python3-3.14.6 — the same
# upstream version Hummingbird ships — with a complete Python 3.14 module set
# behind it.  It is pinned here for the Python namespace ONLY.  `includepkgs`
# is what confines it: no F44 C library can enter the chroot, so the glibc /
# libxml2 / openssl soname split that docs/hummingbird-desktop-gap.md Finding 3
# records is untouched, and an F44 module with a compiled extension against an
# old soname fails to resolve loudly instead of installing quietly.
#
# `flit` is listed by name because F44 renamed the binary; it still
# Provides: python3-flit, which python-wheel BuildRequires.
#
# Remove this pin when Hummingbird's own python3 reaches 3.15 — leaving it in
# past that point would build 3.14 modules for a 3.15 target.
# tests/test_hummingbird_python_abi_pin.py guards the invariants below.
#
# TWO interpreters need this pin, not one, and both were measured from a
# failing job's log rather than inferred.
#
# PERL.  hummingbird 5.42.2, rawhide 5.44.0.  From run 31294475023 layer-04,
# which failed fifteen perl packages at once:
#
#     Failed to resolve the transaction:
#     Problem 1: cannot install both perl-libs-4:5.44.0-527.fc45.x86_64 from
#       fedora and perl-libs-4:5.42.2-525.hum1.x86_64 from hummingbird
#      - perl-Unicode-LineBreak-...fc45 requires libperl.so.5.44(), none
#      - perl-version-9:0.99.33-522.fc44 from fedora-44-python is filtered
#        out by exclude filtering
#
# That last line is the fix: F44 already had the module, the python-only
# includepkgs was excluding it.  It resolves because hummingbird's perl-libs
# provides libperl.so.5.42 AND perl(:MODULE_COMPAT_5.42.0/.1/.2) -- a RANGE,
# not a point -- so F44's 5.42.1 modules satisfy it while rawhide's 5.44 ones
# cannot.  No Fedora ships 5.42.2 exactly (F44 is 5.42.1, F43 is 5.42.3), so
# that range is what makes any pin possible at all.  166 of the 1248 packages
# in the build order are perl-*, and the reach is wider than the name: libpq
# and swig BuildRequire perl and failed on this too.
#
# PYTHON.  The existing pin did not cover its own build macros.  From layer-02,
# python-expandvars:
#
#     cannot install both python3-3.15.0~rc1-1.fc45 from fedora
#                    and python3-3.14.6-2.2.hum1 from hummingbird
#      - tomcli-0.10.1-6.fc45.noarch requires python3.15dist(click), none
#
# tomcli is what pyproject-rpm-macros shells out to for pyproject.toml, so
# every %pyproject_buildrequires package drags it in -- and tomcli,
# pyproject-rpm-macros, pyproject-srpm-macros, python-rpm-macros and
# python-srpm-macros are none of them `python3-*`.  93 of 1248 are python-*.
#
# `perl`, `perl-libs` and `python3` are deliberately NOT in either glob:
# hummingbird ships them at priority 10 and must stay the interpreter.
#
# Remove this pin when Hummingbird's own perl reaches Rawhide's, and the
# python half when its own python3 does.  They move independently.
#
# GOLANG.  Not a version split like the two above -- a NAME split, and it
# hangs the job rather than failing it cleanly.  From run 31697678706 (the
# first run #377's cache-key fix let reach `Build tiers` at all), every one
# of the five desktop jobs died the same way inside swig's own dnf5 builddep
# transaction:
#
#     Transaction failed: Rpm transaction failed.
#      - file /usr/lib/golang/src/... conflicts between attempted installs
#        of golang-src-1.27~rc2-2.fc45.noarch and
#        golang1.26-src-1.26.5-0.1.1.hum1.noarch
#
# swig's spec (imported live from Rawhide) BuildRequires plain `golang` for
# its optional Go bindings. Hummingbird does not publish a package literally
# named `golang` -- only `golang1.26`/-bin/-src -- so the priority filter
# that protects perl/python (it drops a NAME entirely from the losing repo)
# never engages: `golang` and `golang1.26` are two different names, and both
# install candidates satisfy the transaction until dnf commits the file
# layout conflict above. Nothing in this repo's own build closure asks for
# `golang1.26` by name (grepped every package.yaml and .spec here; the five
# Go-targeting recipes -- dankcalendar, dgop, danksearch, dms-cli, uupd --
# don't even build for hummingbird/kde), so its presence in this transaction
# looks incidental, not a real dependency.
#
# Unlike perl/python, this is safe to resolve by exclusion rather than by
# adding another pinned Fedora release: Go produces static binaries with no
# runtime library to version-match, so a BuildRequires: golang built against
# Rawhide's 1.27~rc2 carries no soname coupling to Hummingbird's own 1.26
# runtime the way libperl.so/python(abi) do. Excluding golang1.26* from the
# hummingbird repo leaves every `golang` BuildRequires resolving from
# Rawhide only -- which is what swig was already getting for the winning
# half of the conflict anyway.
#
# tests/test_hummingbird_golang_name_split.py guards this.
#
# MPICH.  A third shape: a package hummingbird DEPENDS ON but does not
# ship at all.  From run 31732589290, netcdf's builddep:
#
#     Problem: package doxygen-2:1.17.0-3.hum1 from hummingbird requires
#       graphviz, but none of the providers can be installed
#      - package graphviz-...hum1 requires /usr/bin/python3, ...
#      - package mpich-4.2.2-10.fc45 from fedora requires
#        (python(abi) = 3.15 if python3), but none of the providers can
#        be installed
#
# Measured against the hummingbird index itself: it ships hdf5-mpich
# (requiring libmpi.so.12(mpich-x86_64)) but NO mpich.  The only provider
# is Rawhide's, whose rich dep demands python(abi) = 3.15 the moment
# python3 enters the transaction -- and graphviz/doxygen need
# hummingbird's python3 = 3.14 in the SAME transaction.  Unsolvable, so
# every package whose builddep touches both doxygen and hdf5-mpich-devel
# (netcdf first among them) fails before building anything.
#
# F44's mpich is 4.2.2-7.fc44: the SAME upstream version as Rawhide's
# 4.2.2-10.fc45, provides the exact libmpi.so.12()(64bit)(mpich-x86_64)
# hummingbird's hdf5-mpich requires, and its rich dep is
# (python(abi) = 3.14 if python3) -- hummingbird's own interpreter.  All
# three facts measured from the repos' primary.xml, not inferred.  The
# name pin drops Rawhide's mpich from resolution entirely, same
# mechanism as the perl/python pins above.
#
# Remove when hummingbird ships its own mpich, or its python3 reaches
# Rawhide's -- either dissolves the conflict.
# tests/test_hummingbird_mpich_pin.py guards this.
#
# Repository priority (lower wins in dnf):
#   1  local-build      RPMs produced by earlier tiers of this same run
#   10 hummingbird      the target's own signed RPMs — the ABI we must match
#   50 fedora-44-python Python 3.14 modules, buildroot only, includepkgs-confined
#   99 rawhide          (inherited) last-resort BuildRequires: fallback
#
# General Fedora 44 BuildRequires fallback was removed in #317 as Hummingbird now
# hosts its self-hosted closure. Fedora 44 is retained ONLY for the Python 3.14
# module pin via `includepkgs`.
#
# Hummingbird stays at 10 so its own python3, setuptools, pip, packaging and
# pytest keep winning: dnf's priority filter drops a package name entirely from
# the lower-priority repo, so F44 can never shadow the interpreter or downgrade
# setuptools (F44 has 80.10.2, Hummingbird 83.0.0, and python-propcache
# BuildRequires >= 82.0.1).
#
# Fedora Rawhide and Fedora 44 are BUILDROOT inputs, never repositories on a
# produced image.  They supply -devel headers and build backends for packages
# Hummingbird has no build of yet; the runtime RPM that ships is always the one
# built here.
include('/etc/mock/fedora-rawhide-x86_64.cfg')
config_opts['root'] = 'hummingbird-ci'
config_opts['rpmbuild_networking'] = False
config_opts['use_host_resolv'] = False
# metadata_expire: this repo does not change while a chain runs, so dnf must
# not re-fetch its metadata for every package. The Rawhide template these
# configs include sets metadata_expire=0, and nothing here overrode it, so
# EVERY package build in EVERY shard re-downloaded repomd.xml and primary.xml
# from every enabled repo. For repo.tunaos.org that is our own Cloudflare
# Workers bill: 673 packages x 2 arches x 5 bands, per fan-out run. The
# account reached 76% of its 100,000/day request limit on 2026-08-28 with
# four runs.
#
# `0` is correct for exactly ONE repo -- [local-build], which grows as the
# chain builds and whose freshness the root-cache unpack depends on (see
# build-chain.sh's MOCK_CACHE_ARGS comment). It stays 0 below.
#
# Rawhide is deliberately NOT given an expiry here: it is a rolling repo that
# genuinely does change mid-run.
config_opts['dnf.conf'] += """
[local-build]
name=Local Hummingbird build results
baseurl=file:///local-repo/
enabled=1
gpgcheck=0
priority=1

[hummingbird]
name=Hummingbird RPMs
baseurl=https://packages.redhat.com/api/pulp-content/public-hummingbird/$basearch/
gpgcheck=0
enabled=1
priority=10
# static: the base OS prefix is a fixed dated path
metadata_expire=6h
excludepkgs=golang1.26* jsoncpp*
# jsoncpp* TEMPORARY. The base compose bumped jsoncpp to libjsoncpp.so.27
# while every cmake it ships (all six releases, 4.3.0-2.1.hum1 through
# -5.1.hum1) still requires libjsoncpp.so.26 -- a rebuild-in-flight skew
# that appeared between ~17:00Z and ~23:25Z on 2026-08-26 and makes cmake
# uninstallable, which takes down 211 of the 673 build-order packages
# (measured by scripts/simulate-buildroot-resolution.py, root-cause
# aggregation). Rawhide has NOT bumped: its jsoncpp still provides .so.26
# and its cmake wants .so.26, a coherent pair. Excluding the base's
# jsoncpp* (and ours, below) lets that pair through. In the base, only
# jsoncpp-devel requires .so.27 -- excluded alongside its provider.
# Remove when the base compose ships a cmake linked against .so.27.

[tunaos-hummingbird]
name=TunaOS factory output for hummingbird - our own build-chain packages
# The factory's own published prefix, and the reason dconf could not build.
#
# dconf BuildRequires vala, vala BuildRequires gobject-introspection-devel,
# and Rawhide's is built against python 3.15 with a rich
# `(python(abi) = 3.15 if python3)`. python3 IS in the chroot -- Hummingbird's
# 3.14 -- so the condition fires and dnf5 reports
#
#   cannot install both python3-3.15.0~rc1-1.fc45 from fedora
#   and python3-3.14.3-2.1.hum1 from hummingbird
#
# The factory has ALREADY built and published what it needs, against the
# right interpreter: gobject-introspection 1.86.0-1.fc43 (the same upstream
# version Rawhide ships) and vala 0.56.19-1.fc43. The buildroot simply had no
# repo pointing at them, so every resolution fell through to Rawhide.
#
# priority 11 is deliberate, one below [hummingbird]:
#   1  local-build  this run's own output always wins
#   10 hummingbird  the base OS still wins for anything it ships
#   11 HERE         fills what the base lacks -- the desktop stack we build
#   50 fedora-44-*  the narrow python/perl/mpich pins
#   99 fedora       Rawhide, the last resort it was previously the first
#
# Safe against the Obsoletes hijack that published_index.py records for the
# gnome50/51 prefixes (a bootstrap glib2 with `Obsoletes: glib2 < 2.87.3`
# replaces the base package regardless of repo priority; publish run
# 32405815822 died on it). Measured, not assumed: of the 8100 packages in
# this prefix, ZERO obsolete any package the Hummingbird base ships.
# tests/test_hummingbird_buildroot_reads_its_own_output.py pins both halves.
baseurl=https://repo.tunaos.org/hummingbird/20251124-$basearch/
gpgcheck=0
enabled=1
priority=11
# static: our published index changes only when a publish runs, never mid-chain
metadata_expire=6h
# TEMPORARY. Remove once a publish has re-synced this prefix.
#
# 79 RPMs in this prefix are stored under a filename containing a literal
# '+'. librepo percent-encodes it and the R2 worker looks up raw paths, so
# every one of them 404s -- the incident scripts/publish-rpm-wave.sh:31
# already records, and the reason that script renames '+' to '.' on publish.
# These predate the rename and no publish has re-synced them since.
#
# Adding this repo (#548) is what made the buildroot depend on them, so the
# next publisher run failed on three packages it had never failed on before:
#
#   abseil-cpp     Cannot download mingw64-gcc-c%2b%2b-16.1.1-3.1.fc43.x86_64.rpm
#   inih           Cannot download mingw64-gcc-c%2b%2b-16.1.1-3.1.fc43.x86_64.rpm
#   dejavu-fonts   Cannot download libsigc%2b%2b20-2.12.2-1.fc43.x86_64.rpm
#
# Excluding them sends those resolutions back to Rawhide (priority 99),
# which is exactly where they came from before #548 -- strictly better than
# a hard download failure, and scoped to the 78 names that cannot be fetched
# rather than weakening the repo as a whole.
#
# The two patterns are not redundant: 74 of the 78 carry '+' in the NAME
# (libsigc++20, mingw64-gcc-c++, python3-dns+doh), but libcdio-paranoia's
# '+' is in its VERSION (10.2+2.0.2), so a '*+*' name glob alone misses its
# four subpackages.
#
# publish-rpm-wave.sh:101 renames across the WHOLE synced-down repo, not
# just the staged wave, so the first publish that completes fixes all 79 and
# this exclude can go.
exclude=*+* libcdio-paranoia* jsoncpp* mingw* ucrt64-* wayland-protocols* python3-docutils* accounts-qml-module* aribb24* libmpcdec* libultrahdr* musepack-tools* poly2tri* quickshell* rapidjson* signon* stb* transfig* usbmuxd* vpnc*
# jsoncpp*: see [hummingbird] -- with the base's excluded, OUR jsoncpp
# (also .so.27, priority 11) would mask Rawhide's .so.26 provider and
# reinstate the very block being dodged. Only our own jsoncpp-devel
# requires .so.27 in this repo, and it leaves alongside its provider.
#
# mingw* / ucrt64-*: the '+'-glob above excluded mingw{32,64}-gcc-c++ but
# left the REST of our mingw toolchain visible, and dnf priorities split
# the toolchain across repos: our mingw32-gcc (11) masks Rawhide's, while
# Rawhide's mingw32-gcc-c++ -- the only c++ left -- requires
# mingw32-gcc = 16.1.1-3.fc45 EXACTLY and gets our fc43 build instead.
# That is the next failure the running leg will hit at abseil-cpp/inih.
# Excluding the whole family keeps Rawhide's toolchain internally
# coherent, exactly as it was before #548 added this repo.
#
# wayland-protocols*: TEMPORARY. Our served wayland-protocols-devel is
# 1.47-2.fc43 (stale, not in any build order) and at priority 11 it masks
# Rawhide's 1.49. gtk4 and mutter BuildRequire
# pkgconfig(wayland-protocols) >= 1.48, so the stale copy blocks the two
# packages the GNOME 51 goal hangs on. Nothing rebuilds it in the chain;
# once a wave publishes a current build (or the stale one is pruned) this
# exclude can go.
#
# python3-docutils*: TEMPORARY. Our served python3-docutils is 0.23-1.fc43;
# at priority 11 it masks F44's 0.22.4 while python3-sphinx (fc44) requires
# python3.14dist(docutils) >= 0.20 with < 0.23~~ -- 0.23 fails the upper
# bound, so every sphinx consumer (~17 sources incl. at-spi2-core and
# xdg-desktop-portal) is blocked by our own stale copy. Excluding it lets
# F44's in-range 0.22.4 serve the buildroot. Not in any build order; remove
# when the served copy is current or pruned.
#
# accounts-qml-module* .. vpnc*: TEMPORARY, the '^' twin of the '*+*' glob
# above. 50 served RPMs carry '^' in their VERSION (libultrahdr, signon,
# stb, quickshell ...), librepo percent-encodes it (%5E), the R2 worker
# looks up raw paths, 404. Being version-side, a name glob cannot catch
# them, so the 14 affected NAME families are listed -- exactly how
# libcdio-paranoia* is handled above. Leg 33022688689 failed dejavu-fonts
# on precisely libultrahdr-1.4.0^...rpm. publish-rpm-wave.sh renames '^'
# like '+' (#555), so the first completed publish repairs all 50 and this
# list can go.

[fedora-44-python]
name=Fedora 44 - Python 3.14 build inputs only
metalink=https://mirrors.fedoraproject.org/metalink?repo=fedora-44&arch=$basearch
gpgcheck=0
enabled=1
priority=50
# static: F44 is a frozen release
metadata_expire=6h
includepkgs=python3-*,flit,pyproject-rpm-macros,pyproject-srpm-macros,python-rpm-macros,python-srpm-macros,tomcli,asciidoc,go-vendor-tools,xwayland-run,blueprint-compiler,marshalparser,xcb-proto,lirc*,glad2,python3-glad2

[fedora-44-python-updates]
name=Fedora 44 updates - Python 3.14 build inputs only
metalink=https://mirrors.fedoraproject.org/metalink?repo=updates-released-f44&arch=$basearch
gpgcheck=0
enabled=1
priority=50
# static: F44 is a frozen release
metadata_expire=6h
includepkgs=python3-*,flit,pyproject-rpm-macros,pyproject-srpm-macros,python-rpm-macros,python-srpm-macros,tomcli,asciidoc,go-vendor-tools,xwayland-run,blueprint-compiler,marshalparser,xcb-proto,lirc*,glad2,python3-glad2

[fedora-44-perl]
name=Fedora 44 - perl 5.42 build inputs only
metalink=https://mirrors.fedoraproject.org/metalink?repo=fedora-44&arch=$basearch
gpgcheck=0
enabled=1
priority=50
# static: F44 is a frozen release
metadata_expire=6h
includepkgs=perl-*

[fedora-44-perl-updates]
name=Fedora 44 updates - perl 5.42 build inputs only
metalink=https://mirrors.fedoraproject.org/metalink?repo=updates-released-f44&arch=$basearch
gpgcheck=0
enabled=1
priority=50
# static: F44 is a frozen release
metadata_expire=6h
includepkgs=perl-*

[fedora-44-mpich]
name=Fedora 44 - mpich only (hummingbird ships hdf5-mpich but no mpich)
metalink=https://mirrors.fedoraproject.org/metalink?repo=fedora-44&arch=$basearch
gpgcheck=0
enabled=1
priority=50
# static: F44 is a frozen release
metadata_expire=6h
includepkgs=mpich*

[fedora-44-mpich-updates]
name=Fedora 44 updates - mpich only (hummingbird ships hdf5-mpich but no mpich)
metalink=https://mirrors.fedoraproject.org/metalink?repo=updates-released-f44&arch=$basearch
gpgcheck=0
enabled=1
priority=50
# static: F44 is a frozen release
metadata_expire=6h
includepkgs=mpich*
"""
config_opts['plugin_conf']['bind_mount_enable'] = True
config_opts['plugin_conf']['bind_mount_opts']['dirs'].append(('/local-repo', '/local-repo'))
