# Hummingbird buildroot: Fedora 43 package ABI plus Hummingbird's signed RPMs.
# The local repository has priority 1 so dependency tiers can consume the RPMs
# produced earlier in the same workflow. Hummingbird's repository has priority
# 10 and Fedora's inherited repositories remain fallback-only.
include('/etc/mock/fedora-43-x86_64.cfg')
config_opts['root'] = 'hummingbird-ci'
config_opts['rpmbuild_networking'] = False
config_opts['use_host_resolv'] = False
config_opts['dnf.conf'] += """
[local-build]
name=Local Hummingbird build results
baseurl=file:///local-repo/
enabled=1
gpgcheck=0
priority=1

[hummingbird]
name=Hummingbird RPMs
baseurl=https://packages.redhat.com/api/pulp-content/public-hummingbird/$basearch/
gpgcheck=0
enabled=1
priority=10
"""
config_opts['plugin_conf']['bind_mount_enable'] = True
config_opts['plugin_conf']['bind_mount_opts']['dirs'].append(('/local-repo', '/local-repo'))
