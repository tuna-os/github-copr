# Mock config for GNOME 50 builds on CentOS Stream 10
#
# No COPR fallback. The R2-backed local-build repo is the sole source of
# our own packages (#113, #179): a fallback that silently satisfies a
# missing BuildRequires makes the build look self-sufficient when it is
# not, and a missing R2 RPM must fail loudly here, not resolve quietly
# from COPR.

include('/etc/mock/epel-10-x86_64.cfg')

config_opts['root'] = 'centos-stream-10-ci-gnome50'

config_opts['rpmbuild_networking'] = False
config_opts['use_host_resolv'] = False
config_opts.setdefault('plugin_conf', {})
config_opts['plugin_conf'].setdefault('tmpfs_opts', {})
config_opts['plugin_conf']['tmpfs_opts']['keep_mounted'] = True

config_opts['yum.conf'] += """
[local-build]
name=Local Build Repository
baseurl=file:///local-repo/
enabled=1
gpgcheck=0
cost=1
skip_if_unavailable=1
module_hotfixes=1

[c10s-build]
name=CentOS Stream 10 Koji buildroot
baseurl=https://kojihub.stream.centos.org/kojifiles/repos/c10s-build/latest/x86_64/
enabled=1
gpgcheck=0
cost=1
skip_if_unavailable=1

[c10s-proposed-updates]
name=CentOS Stream 10 SIG Proposed Updates
baseurl=https://mirror.stream.centos.org/SIGs/10-stream/proposed_updates/x86_64/packages-main/
enabled=1
gpgcheck=0
cost=1
skip_if_unavailable=1
# This family's OWN published index.
#
# build-chain.sh skips a package when the published index already serves its
# NVR ("Skipping: <nvr> already served by the published index"), on the
# stated ground that "consumers resolve it from the repo at priority 11".
# That is only true if the index is a repo in THIS buildroot. It was not:
# gnome49 declares [tunaos-gnome49] below its local-build, and the generic
# centos-stream-10-ci config declares [tunaos-xfce], but the gnome50/51
# configs declared no index at all -- so a skipped package was in neither
# local-build nor any repo, and the tier that needed it could not resolve it.
#
# Run 33835533548 is the measurement: glib2-2.88.0-4.el10 was skipped as
# already served, and gtk4 then failed with "No matching package to install:
# 'pkgconfig(glib-2.0) >= 2.84.0'", pango with the same for
# 'pkgconfig(pango) >= 1.56.0'. 64 minutes to fail on two packages whose
# dependencies the factory had already built.
#
# cost is higher than [local-build]'s 1 on purpose: a package just built in
# this run must beat the published copy of itself, or a rebuild silently
# links against the previous release.
#
# No COPR fallback here, unlike gnome49: maintainer directive 2026-09-03 is
# that nothing below GNOME 50 ships and no COPR is a source. A missing RPM
# must fail loudly rather than resolve quietly from someone's personal
# project.
[tunaos-gnome50]
name=TunaOS GNOME 50 (published)
baseurl=https://repo.tunaos.org/gnome50/10-stream-x86_64/
enabled=1
gpgcheck=0
cost=10
skip_if_unavailable=1
module_hotfixes=1

"""

config_opts['plugin_conf']['bind_mount_enable'] = True
config_opts['plugin_conf']['bind_mount_opts']['dirs'].append(
    ('/local-repo', '/local-repo')
)
