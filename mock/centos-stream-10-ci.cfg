# Mock config that mirrors what Fedora COPR generates for epel-10-x86_64 chroots.
#
# COPR base: include('/etc/mock/epel-10-x86_64.cfg')
# which pulls in:
#   templates/centos-stream-10.tpl  (BaseOS/AppStream/CRB via metalink, bootstrap image)
#   templates/epel-10.tpl           (EPEL via metalink, epel-rpm-macros in chroot_setup_cmd)
#
# On top of that COPR adds:
#   - The project's own repo (cost=1) — replaced here by local-build (file:///local-repo)
#   - Additional repos configured in the project settings (kojihub c10s-build, SIG proposed_updates)
#   - rpmbuild_networking=False, use_host_resolv=False

include('/etc/mock/epel-10-x86_64.cfg')

config_opts['root'] = 'centos-stream-10-ci'

# Match COPR's network isolation
config_opts['rpmbuild_networking'] = False
config_opts['use_host_resolv'] = False

# Keep tmpfs mounted between steps (COPR default)
config_opts.setdefault('plugin_conf', {})
config_opts['plugin_conf'].setdefault('tmpfs_opts', {})
config_opts['plugin_conf']['tmpfs_opts']['keep_mounted'] = True

config_opts['yum.conf'] += """
# Our previously-built packages — equivalent to COPR's [copr_base] (cost=1)
[local-build]
name=Local Build Repository
baseurl=file:///local-repo/
enabled=1
gpgcheck=0
cost=1
skip_if_unavailable=1
module_hotfixes=1

# CentOS Stream 10 Koji buildroot — matches COPR "additional repo" 1
[c10s-build]
name=CentOS Stream 10 Koji buildroot
baseurl=https://kojihub.stream.centos.org/kojifiles/repos/c10s-build/latest/x86_64/
enabled=1
gpgcheck=0
cost=1
skip_if_unavailable=1

# CentOS Stream SIG proposed updates — matches COPR "additional repo" 2
[c10s-proposed-updates]
name=CentOS Stream 10 SIG Proposed Updates
baseurl=https://mirror.stream.centos.org/SIGs/10-stream/proposed_updates/x86_64/packages-main/
enabled=1
gpgcheck=0
cost=1
skip_if_unavailable=1

# Our own already-published XFCE packages.
#
# Without this, building a single package in isolation cannot resolve
# BuildRequires that other packages in THIS repo provide. build-chain.sh
# populates [local-build] as it walks the tiers, so a full run is fine — but
# the per-package workflow builds one package with an empty local repo, and
# every tier logs "Directory walk done - 0 packages". That is why
# build-xfce-package.yml has failed on main since 2026-07-04:
# xfce4-cpugraph-plugin wants exo-devel, libxfce4ui-devel,
# libxfce4windowing-devel, xfce4-panel-devel and xfce4-dev-tools, all built by
# earlier tiers and none of them present.
#
# They are all published here already, so pointing at it makes an isolated
# rebuild resolve exactly like a full chain run.
#
# cost is deliberately higher than [local-build]'s 1: a package just built in
# this run must always win over the published copy of itself, otherwise a
# rebuild would silently link against the previous release.
[tunaos-xfce]
name=TunaOS XFCE Wayland (published)
baseurl=https://repo.tunaos.org/xfce/10-stream-x86_64/
enabled=1
gpgcheck=0
cost=10
skip_if_unavailable=1

"""

# Bind-mount the local repo into the chroot
config_opts['plugin_conf']['bind_mount_enable'] = True
config_opts['plugin_conf']['bind_mount_opts']['dirs'].append(
    ('/local-repo', '/local-repo')
)
