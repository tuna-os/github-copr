name = "repo-proxy"
main = "repo-proxy.ts"
compatibility_date = "2024-09-23"

# Production: repo.tunaos.org → bluefin bucket
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "bluefin"

# Dev: dev.repo.tunaos.org → tunaosdev bucket
[env.dev]
[[env.dev.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "tunaosdev"
