# Workaround for EL10: no Xorg installed by default.
# Install as: /etc/gdm/custom.conf
#
# EL10 ships without xorg-x11-server, so GDM must use Wayland.
# The stock GDM custom.conf may have WaylandEnable=false or missing.
# This needs to be set (or the default relied upon if GDM's default is true).

[daemon]
WaylandEnable=true

[security]

[debug]
# Remove or set Enable=false for production
Enable=false
