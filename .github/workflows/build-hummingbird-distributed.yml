        run: "touch .build-marker\nARGS=(--backend podman --tier layer-16 --package ${{ matrix.package }} --manifest build-order-hummingbird-desktops.yml --mock-config hummingbird-ci)\nif [[ \"${{ github.event.inputs.force }}\" == \"true\" ]]; then\n  ARGS+=(--force)\nfi\n./scripts/build-chain.sh \"${ARGS[@]}\"\n"
      - name: Find new RPMs
        id: find-rpms
        run: 'mkdir -p new-rpms

          find local-repo -name "*.rpm" -newer .build-marker -exec cp {} new-rpms/ \;

          count=$(ls -1 new-rpms/*.rpm 2>/dev/null | wc -l)

          echo "count=$count" >> $GITHUB_OUTPUT

          '
      - name: Upload RPMs
        if: steps.find-rpms.outputs.count > '0'
        uses: actions/upload-artifact@v7
        with:
          name: rpms-layer-16-0-${{ strategy.job-index }}
          path: new-rpms/*.rpm
          retention-days: 1
  consolidate-layer-16:
    needs: build-layer-16
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Install createrepo_c
        run: 'sudo apt-get update -q || sudo apt-get update -q || true

          sudo apt-get install -y -q createrepo-c rclone'
      - name: Download new RPMs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: rpms-layer-16-*
          path: local-repo
          merge-multiple: true
      - name: Publish this tier to R2
        run: 'mkdir -p ~/.config/rclone

          cat > ~/.config/rclone/rclone.conf << EOF

          [r2]

          type = s3

          provider = Cloudflare

          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}

          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}

          endpoint = ${{ secrets.R2_ENDPOINT }}

          EOF

          rclone copy local-repo/ "r2:${R2_BUCKET}/hummingbird/20251124-x86_64/" --transfers 32 --checkers 64 --fast-list --stats 30s --stats-one-line

          '
  build-layer-17:
    needs: consolidate-layer-16
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - src/hummingbird/kde-cli-tools
          - src/hummingbird/plasma-desktop
          - src/hummingbird/plasma-systemsettings
          - src/hummingbird/powerdevil
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install host dependencies
        run: 'sudo apt-get update -q || sudo apt-get update -q || true

          sudo apt-get install -y -q podman createrepo-c rpm rclone'
      - name: Cache CentOS Stream 10 image
        uses: actions/cache@v6
        with:
          path: /tmp/cs10-image.tar
          key: cs10-image-${{ hashFiles('mock/hummingbird-ci.cfg') }}
      - name: Load or pull image
        run: "if [[ -f /tmp/cs10-image.tar ]]; then\n  podman load -i /tmp/cs10-image.tar\nelse\n  podman pull quay.io/centos/centos:stream10\n  podman save -o /tmp/cs10-image.tar quay.io/centos/centos:stream10\nfi\npodman pull ${{ env.MOCK_RUNNER_IMAGE }}\n"
      - name: Seed local repo from R2
        run: 'mkdir -p ~/.config/rclone

          cat > ~/.config/rclone/rclone.conf << EOF

          [r2]

          type = s3

          provider = Cloudflare

          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}

          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}

          endpoint = ${{ secrets.R2_ENDPOINT }}

          EOF

          mkdir -p local-repo

          rclone copy "r2:${R2_BUCKET}/hummingbird/20251124-x86_64/" local-repo/ --transfers 32 --checkers 64 --fast-list --stats 30s --stats-one-line || true

          createrepo_c local-repo

          '
      - name: Cache mock chroot (dnf downloads)
        uses: actions/cache@v6
        with:
          path: .mock-cache
          key: mock-cache-${{ hashFiles('mock/hummingbird-ci.cfg') }}-${{ github.run_id }}
          restore-keys: mock-cache-${{ hashFiles('mock/hummingbird-ci.cfg') }}-
      - name: Import this package's dist-git packaging
        run: "set -euo pipefail\npkg_path=\"${{ matrix.package }}\"\nif [ -d \"$pkg_path\" ]; then\n  echo \"$pkg_path is maintained in-tree; nothing to import\"\nelse\n  python3 scripts/import-fedora-distgit.py \\\n    --package \"$(basename \"$pkg_path\")\" \\\n    --dest \"$(dirname \"$pkg_path\")\" \\\n    --branch rawhide --release-bump\nfi\n"
      - name: Build package
        env:
          MOCK_CACHE_DIR: ${{ github.workspace }}/.mock-cache
        run: "touch .build-marker\nARGS=(--backend podman --tier layer-17 --package ${{ matrix.package }} --manifest build-order-hummingbird-desktops.yml --mock-config hummingbird-ci)\nif [[ \"${{ github.event.inputs.force }}\" == \"true\" ]]; then\n  ARGS+=(--force)\nfi\n./scripts/build-chain.sh \"${ARGS[@]}\"\n"
      - name: Find new RPMs
        id: find-rpms
        run: 'mkdir -p new-rpms

          find local-repo -name "*.rpm" -newer .build-marker -exec cp {} new-rpms/ \;

          count=$(ls -1 new-rpms/*.rpm 2>/dev/null | wc -l)

          echo "count=$count" >> $GITHUB_OUTPUT

          '
      - name: Upload RPMs
        if: steps.find-rpms.outputs.count > '0'
        uses: actions/upload-artifact@v7
        with:
          name: rpms-layer-17-0-${{ strategy.job-index }}
          path: new-rpms/*.rpm
          retention-days: 1
  consolidate-layer-17:
    needs: build-layer-17
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Install createrepo_c
        run: 'sudo apt-get update -q || sudo apt-get update -q || true

          sudo apt-get install -y -q createrepo-c rclone'
      - name: Download new RPMs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: rpms-layer-17-*
          path: local-repo
          merge-multiple: true
      - name: Publish this tier to R2
        run: 'mkdir -p ~/.config/rclone

          cat > ~/.config/rclone/rclone.conf << EOF

          [r2]

          type = s3

          provider = Cloudflare

          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}

          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}

          endpoint = ${{ secrets.R2_ENDPOINT }}

          EOF

          rclone copy local-repo/ "r2:${R2_BUCKET}/hummingbird/20251124-x86_64/" --transfers 32 --checkers 64 --fast-list --stats 30s --stats-one-line

          '
  publish:
    needs: consolidate-layer-17
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: 'sudo apt-get update -q || sudo apt-get update -q || true

          sudo apt-get install -y -q rpm createrepo-c gpg gpgconf rclone'
      - name: Seed final repo from R2
        run: 'mkdir -p ~/.config/rclone

          cat > ~/.config/rclone/rclone.conf << EOF

          [r2]

          type = s3

          provider = Cloudflare

          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}

          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}

          endpoint = ${{ secrets.R2_ENDPOINT }}

          EOF

          mkdir -p local-repo

          rclone copy "r2:${R2_BUCKET}/hummingbird/20251124-x86_64/" local-repo/ --transfers 32 --checkers 64 --fast-list --stats 30s --stats-one-line

          '
      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_committer_name: RPM Builder
          git_committer_email: rpm-signing@tunaos.org
      - name: Configure RPM macros
        run: 'echo "%_signature gpg" > ~/.rpmmacros

          echo "%_gpg_name ${{ steps.import-gpg.outputs.keyid }}" >> ~/.rpmmacros

          echo "%__gpg_sign_cmd %{__gpg} gpg --batch --no-verbose --no-armor --use-agent --no-secmem-warning -u \"%{_gpg_name}\" -sbo %{__signature_filename} %{__plaintext_filename}" >> ~/.rpmmacros

          '
      - name: Sign RPMs
        run: 'find local-repo -name "*.rpm" -exec rpmsign --addsign {} \;

          createrepo_c --update local-repo

          '
      - name: Configure rclone
        run: 'mkdir -p ~/.config/rclone

          cat > ~/.config/rclone/rclone.conf << EOF

          [r2]

          type = s3

          provider = Cloudflare

          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}

          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}

          endpoint = ${{ secrets.R2_ENDPOINT }}

          EOF

          '
      - name: Upload to R2
        run: 'echo "Uploading to 20251124-x86_64..."

          rclone sync local-repo/ "r2:${R2_BUCKET}/hummingbird/20251124-x86_64/" --transfers 32 --checkers 64 --fast-list --stats 30s --stats-one-line

          rclone copyto public.gpg "r2:${R2_BUCKET}/public.gpg"

          rclone copyto contrib/install.sh "r2:${R2_BUCKET}/install.sh"

          '
