# runtime-gate: greetd-login — RFC 011 Phase 3 skeleton.
#
# The most-declared unimplemented gate type (7 recipes declare it; it fronts
# COSMIC and niri both — see docs/rfc011-phase3-gates.md). The contract this
# gate must eventually evaluate:
#
#   Boot a VM of the TARGET's shape with the payload staged-installed,
#   reach greetd, and judge from the journal + the greeter's own state that
#   greetd accepted the session start — modelled on the worked example the
#   readiness doc names, build-gnome50-verify.yml (Lima VM → wait for the
#   display manager → assert no crash-loop → scan journal for crash
#   signatures).
#
# SKELETON, deliberately inert: callable, input contract fixed, and it
# refuses to pretend. `execute: false` (the default) validates inputs and
# exits with a ::notice naming this file; `execute: true` FAILS loudly so no
# caller can wire the gate in and read green from a stub. Implementing the
# Lima boot-and-judge steps flips this file from skeleton to gate — and
# flips the greetd-login row in docs/rfc011-phase3-gates.md in the same PR,
# with the first green run linked.
name: "runtime-gate: greetd-login"

on:
  workflow_call:
    inputs:
      target:
        description: "Factory target id (must exist in manifests/package-factory.yaml)"
        required: true
        type: string
      payload_repo_url:
        description: "Served rpm-md/apt index holding the staged payload to install before boot"
        required: true
        type: string
      execute:
        description: "Actually run the gate (true) or just validate the call contract (false)"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      target:
        description: "Factory target id"
        required: true
        type: string
      payload_repo_url:
        description: "Served index of the staged payload"
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate the call contract
        env:
          TARGET: ${{ inputs.target }}
          PAYLOAD: ${{ inputs.payload_repo_url }}
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 - <<'EOF'
          import os, sys, yaml
          factory = yaml.safe_load(open("manifests/package-factory.yaml"))
          target = os.environ["TARGET"]
          if target not in factory["targets"]:
              sys.exit(f"unknown factory target: {target}")
          payload = os.environ["PAYLOAD"]
          if not payload.startswith("https://"):
              sys.exit(f"payload_repo_url must be https, got: {payload}")
          print(f"contract ok: target={target}")
          EOF

      - name: Gate is not implemented yet
        if: ${{ inputs.execute }}
        run: |
          echo "::error::runtime-gate greetd-login is a Phase 3 skeleton —" \
            "it cannot evaluate the contract it was called to enforce." \
            "Implement the Lima boot-and-judge steps (model:" \
            "build-gnome50-verify.yml) before wiring execute: true."
          exit 1

      - name: Skeleton notice
        if: ${{ !inputs.execute }}
        run: |
          echo "::notice::greetd-login gate skeleton: call contract validated," \
            "gate NOT evaluated (execute=false). See docs/rfc011-phase3-gates.md."
