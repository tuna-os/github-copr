name: Build Hummingbird desktops

# Builds the desktop RPMs Hummingbird does not ship.
#
# The package list is not hand-written. scripts/measure-target-gap.py
# --target hummingbird
# resolves each desktop's install roots against Fedora Rawhide, subtracts
# everything the Hummingbird repository already provides, and emits
# build-order-hummingbird-desktops.yml.  As measured on 2026-08-06 that is 670
# source packages across five desktops (298 for GNOME alone) — see
# docs/hummingbird-desktop-gap.md.
#
# A full run therefore takes many hours and is expected to be driven one tier
# at a time.  `tiers:` selects a prefix or a comma-separated list so a run can
# be resumed; the local repo is seeded from R2 first, so a resumed run sees the
# packages earlier runs published.

on:
  # Scheduled, not push-triggered. The build converges: each run seeds the
  # local repo from R2 and rebuilds only what is still missing, so what this
  # needs is to run *often and undisturbed*, not to run the instant a file
  # changes.
  #
  # A push trigger actively prevented that. The concurrency group below keeps
  # at most one pending run, so a second push while a build is in flight
  # cancels the first one still queued. With ten hot paths on a repository
  # this active, runs evicted each other continuously: every run between
  # 2026-08-13 18:42 and 2026-08-14 14:47 was `cancelled` without executing a
  # single step — ten in a row, spanning the exact window in which the
  # cache-key fix below landed. The fix was therefore never exercised, and the
  # published repository stayed frozen at its 2026-08-09 contents.
  #
  # Daily is a floor, not a ceiling: raise the cadence or dispatch manually to
  # push through the tier stack faster. 12:00 UTC deliberately avoids
  # tuna-os/tunaOS's 04:00-09:00 proving window; note that five desktop jobs
  # at up to six hours each is a real draw on a 20-concurrent-job org ceiling,
  # so moving this is a scheduling decision rather than a free one.
  schedule:
    - cron: "0 12 * * *"

  workflow_dispatch:
    inputs:
      desktop:
        description: Desktop to build (resolved to tiers via the gap report)
        type: choice
        options: [gnome, kde, cosmic, niri, xfce, all]
        default: gnome
      tiers:
        description: >
          Comma-separated tier names to build, e.g. "gnome-00,gnome-01".
          Taken verbatim -- no bootstrap tiers are prepended, so a single
          tier can be re-run on its own. Empty means resolve `desktop`.
        type: string
        default: ""
      exclude_tiers:
        description: >
          Comma-separated tiers to drop from the selection. Lets a shared
          trunk be built once and the per-desktop remainders run in parallel
          against it.
        type: string
        default: ""
      arch:
        description: >
          Architecture(s) to build. x86_64 is the established leg
          (hummingbird/20251124-x86_64, ~7673 packages as of 2026-08-16);
          aarch64 is new for tunaOS#1755 §3 and starts from an empty seed.
          Defaults to x86_64 only on a manual dispatch so a human debugging
          one desktop/tier does not also kick off an unrelated six-hour
          aarch64 run; the scheduled run (no inputs) always builds both, see
          the `arch` job `if:` conditions below.
        type: choice
        options: [x86_64, aarch64, all]
        default: x86_64
      publish:
        description: Sign and publish the resulting RPM repository
        type: boolean
        default: false
      force:
        description: Rebuild packages already present in the local repo
        type: boolean
        default: false

concurrency:
  # Publishing is copy-not-sync, but two full matrices still waste runners and
  # can race while signing the same RPM set. Queue a later run instead.
  #
  # cancel-in-progress: false does NOT mean "never cancel" -- GitHub keeps at
  # most one *pending* run per group and cancels the previously-pending one
  # when a newer arrives. That is survivable with a daily schedule and a
  # human-paced dispatch; it was not survivable with a push trigger (see the
  # `on:` block).
  group: hummingbird-desktops-${{ github.ref }}
  cancel-in-progress: false

env:
  R2_BUCKET: bluefin
  # workflow_dispatch inputs are absent on push. These resolved values preserve
  # manual behavior while making a main-branch run mean a full published matrix.
  TRIGGER_DESKTOP: ${{ inputs.desktop || 'all' }}
  TRIGGER_TIERS: ${{ inputs.tiers || '' }}
  TRIGGER_EXCLUDE_TIERS: ${{ inputs.exclude_tiers || '' }}
  TRIGGER_FORCE: ${{ inputs.force || false }}
  MANIFEST: build-order-hummingbird-desktops.yml
  # Fedora + mock toolchain (mock/Containerfile). The tag names the chroot the
  # image was first built for, not the chroot it can build; mock pulls the
  # bootstrap image for whatever --mock-config asks for. build-xfce-fedora.yml
  # uses the same image for a fedora-44 chroot.
  MOCK_RUNNER_IMAGE: ghcr.io/tuna-os/mock-runner:centos-stream-10
  # A separate tag, not a multi-arch manifest -- build-mock-runner.yml pushes
  # this from its own build-and-push-aarch64 job (mock/Containerfile built on
  # ubuntu-24.04-arm). Confirmed live on GHCR before this workflow was written:
  # the tag exists and its image config reports architecture "arm64".
  MOCK_RUNNER_IMAGE_AARCH64: ghcr.io/tuna-os/mock-runner:centos-stream-10-aarch64

jobs:
  # `desktop: all` used to mean "one runner builds all 60 tiers", which cannot
  # finish: the first tier alone took 288 minutes of build step in run
  # 31137480986, against a 360-minute job cap.  Fan out instead, one job per
  # desktop.  The desktops come out of the gap report -- the same file the
  # per-job `Select tiers` step resolves a desktop against -- not a list kept
  # in step with the `options:` above by hand.
  plan:
    runs-on: ubuntu-latest
    outputs:
      desktops: ${{ steps.plan.outputs.desktops }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        run: |
          python3 scripts/plan_hummingbird_matrix.py \
            --gap-report docs/hummingbird-desktop-gap.json \
            --desktop "${TRIGGER_DESKTOP}" \
            --tiers "${TRIGGER_TIERS}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    # Skipped only when a manual dispatch explicitly asked for aarch64 alone.
    # `inputs.arch` is unset on the schedule trigger (workflow_dispatch inputs
    # do not exist for other events), so `|| 'all'` resolves to 'all' there --
    # same fallback idiom TRIGGER_DESKTOP etc. already use above -- and the
    # scheduled run always builds both architectures.
    if: ${{ (inputs.arch || 'all') != 'aarch64' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # ONE strategy block. Both sides of the #297 merge grew their own, and a
    # duplicate YAML key does not error -- the second silently wins, which
    # would have thrown away both the desktop fan-out and fail-fast.
    strategy:
      # One desktop failing must not cancel the other four: they share nothing
      # but R2, and a partial publish is the design (see the publish step).
      fail-fast: false
      matrix:
        desktop: ${{ fromJson(needs.plan.outputs.desktops) }}
        # The target this builds for, named rather than implied. It selects the
        # mock config below and the R2 path is read from the target's own entry
        # in manifests/package-factory.yaml, so this is the value the run turns
        # on and not a label. One value, so it multiplies the desktop axis by
        # one rather than fanning anything out.
        #
        # It is also what makes hummingbird a covered target:
        # validate-package-factory.py refuses a target no gate job exercises,
        # which is how openSUSE sat declared-but-unbuilt for months (#139).
        target: [hummingbird]
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the target's R2 path from the package factory manifest
        id: target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Single source of truth. This path was duplicated here and in
          # manifests/hummingbird-desktops.yaml, which is the sort of pair that
          # silently disagrees.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, yaml
          factory = yaml.safe_load(open("manifests/package-factory.yaml"))
          target = factory["targets"][os.environ["TARGET"]]
          print("r2_path=" + target["r2_path"])
          PY
          echo "resolved r2_path for ${TARGET}"

      - name: Install build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q podman createrepo-c rpm gpg gpgconf python3-yaml

      - name: Pull mock runner
        run: podman pull "${MOCK_RUNNER_IMAGE}"

      - name: Configure R2 access
        id: seed
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          EOF
          mkdir -p local-repo-hummingbird
          # Seed from R2 so a resumed run does not rebuild what an earlier tier
          # already published. Non-fatal: the first run has nothing to seed.
          rclone copy "r2:${R2_BUCKET}/${{ steps.target.outputs.r2_path }}/" local-repo-hummingbird/ || true

          # Count what the seed brought down. Everything after this point
          # compares against this number to answer one question the workflow
          # could not previously answer: did this run actually build anything,
          # or is it about to re-publish the seed unchanged?
          seeded=$(find local-repo-hummingbird -name '*.rpm' ! -name '*.src.rpm' | wc -l)
          echo "seeded ${seeded} RPM(s) from R2"
          echo "seeded_rpms=${seeded}" >> "$GITHUB_OUTPUT"

      - name: Select tiers
        id: tiers
        env:
          # Through the environment, not `${{ }}` inside the script: these are
          # dispatch inputs and they are not shell.
          # matrix.desktop, not inputs.desktop: `desktop: all` fans out to one
          # job per desktop (see the plan job), and each job resolves only its
          # own share. Reading the input here would make all five jobs select
          # the same tiers and build the identical work five times.
          IN_DESKTOP: ${{ matrix.desktop }}
          IN_TIERS: ${{ env.TRIGGER_TIERS }}
          IN_EXCLUDE: ${{ env.TRIGGER_EXCLUDE_TIERS }}
        run: |
          # Not a name-prefix match. The manifest deduplicates packages across
          # desktops, so a tier named gnome-* holds packages XFCE needs too and
          # `xfce-*` covers a fraction of XFCE. select-desktop-tiers.py resolves
          # the desktop through the gap report's own package list, and fails if
          # anything it needs is in no tier -- see the module docstring. It also
          # prepends the bootstrap-* tiers (#268's PEP-517 backends), which is
          # why the inline prefix match that used to live here is gone.
          list=$(python3 scripts/select-desktop-tiers.py \
            --manifest "${MANIFEST}" \
            --gap-report docs/hummingbird-desktop-gap.json \
            --desktop "${IN_DESKTOP}" \
            --tiers "${IN_TIERS}" \
            --exclude-tiers "${IN_EXCLUDE}")
          echo "selected $(tr ',' '\n' <<< "$list" | wc -l) tiers: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"
          # A digest of the same selection, for use in cache keys. `list` is
          # comma-separated and actions/cache rejects a key containing a comma
          # outright -- see the cache step below for what that cost. A digest
          # is also bounded, so a larger desktop can never push the key past
          # the 512-character limit.
          echo "slug=$(printf '%s' "$list" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Import Fedora Rawhide packaging for the selected tiers
        run: |
          # --jobs 4, not 8: every clone goes to the same host, and
          # src.fedoraproject.org answers 503 when pushed. Run 31268302766
          # needed retries on 8 of 11 clones and still lost 2. Concurrency
          # here buys seconds and costs whole dispatches.
          #
          # Most of the graph is unmodified Fedora Rawhide packaging and is
          # imported here rather than vendored, the same way Hummingbird's own
          # RPM project (gitlab.com/redhat/hummingbird, ci/dist_git.py) sources
          # >95% of its packages. Packages with a reviewed spec directory in
          # this repository carry no `distgit:` key and are left alone.
          TIER_ARGS=()
          IFS=',' read -ra TIERS <<< "${{ steps.tiers.outputs.list }}"
          for tier in "${TIERS[@]}"; do TIER_ARGS+=(--tier "${tier}"); done
          # --jobs 4, not 8: src.fedoraproject.org throttles the client, not
          # the clone, and eight at a time went over its limit for minutes at a
          # stretch (run 31270801603 lost 20 of 66 imports even with retries).
          python3 scripts/import-fedora-distgit.py \
            --build-order "${MANIFEST}" \
            "${TIER_ARGS[@]}" \
            --branch rawhide \
            --state hummingbird-imports.json \
            --release-bump \
            --jobs 4

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hummingbird-import-state-${{ matrix.desktop }}
          path: hummingbird-imports.json
          if-no-files-found: warn

      # Caching, matching what the rest of Tideforge does. None of this
      # existed for the desktop builds, which is why every dispatch paid for
      # the same downloads again: the buildroot each package resolves, and
      # every upstream tarball in the tier.
      #
      # build-chain.sh has honoured both variables for a while; the workflow
      # simply never set them.
      - name: Cache the mock chroot and its dnf downloads
        uses: actions/cache@v6
        # A cache is an optimisation. Its failure must cost time, not
        # correctness -- without this, ANY error here (a rejected key, a
        # service outage, a quota) fails the step, and every following step
        # that carries an implicit success() is skipped. `Build tiers` is one
        # of them. That is not theoretical: it is exactly what happened for
        # four days straight, and the comment on `key:` below is the autopsy.
        continue-on-error: true
        with:
          # Absolute, and outside the checkout: MOCK_CACHE_DIR is
          # ${{ runner.temp }}/mock-cache (see the Build tiers step for why),
          # and caching a workspace-relative .mock-cache would archive an
          # empty directory while the real chroot cache went unsaved.
          path: ${{ runner.temp }}/mock-cache
          # Keyed on the chroot definition and the tier set, not the run: a
          # re-dispatch of the same tiers should hit. github.run_id makes each
          # run's save unique so concurrent runs do not race, and the
          # restore-keys walk back to the most recent compatible entry.
          #
          # steps.tiers.outputs.slug, NOT .list: the list is comma-separated,
          # and actions/cache refuses any key containing a comma --
          #
          #   ##[error]Key Validation Error: hummingbird-mock-<hash>-\
          #   bootstrap-00,bootstrap-01,...,layer-23-<run_id> cannot contain
          #   commas.
          #
          # That fired on every desktop of every run, in the same second the
          # step started. It is not a soft cache miss: the step fails, `Build
          # tiers` is skipped as a result, and the job still went on to sign
          # and publish whatever the R2 seed had already put in the local
          # repo. So the run uploaded a 10 GB artifact and reported a package
          # repository while building precisely zero packages -- the failure
          # looked like a caching hiccup and was actually total.
          key: hummingbird-mock-${{ matrix.desktop }}-${{ hashFiles('mock/hummingbird-ci.cfg') }}-${{ steps.tiers.outputs.slug }}-${{ github.run_id }}
          restore-keys: |
            hummingbird-mock-${{ matrix.desktop }}-${{ hashFiles('mock/hummingbird-ci.cfg') }}-${{ steps.tiers.outputs.slug }}-
            hummingbird-mock-${{ matrix.desktop }}-${{ hashFiles('mock/hummingbird-ci.cfg') }}-

      - name: Cache upstream source tarballs
        uses: actions/cache@v6
        # Same reasoning as the chroot cache above.
        continue-on-error: true
        with:
          path: .sources-cache
          # Content of the sources is pinned by the specs, which come from the
          # import; key on the manifest so a regenerated build order gets a
          # fresh store rather than an ever-growing one.
          key: hummingbird-sources-${{ hashFiles('build-order-hummingbird-desktops.yml') }}-${{ github.run_id }}
          restore-keys: |
            hummingbird-sources-${{ hashFiles('build-order-hummingbird-desktops.yml') }}-
            hummingbird-sources-

      - name: Build tiers
        id: build
        env:
          # Give mock ONE buildroot for the whole job instead of one per
          # package.  /var/cache/mock lives inside the per-package container
          # and dies with it, so mock rebuilt the minimal buildroot from
          # scratch for every single package: across five runs, 194 packages,
          # `Start: creating root cache` fired 194 times and `unpacking root
          # cache` zero times.  The floor that costs is 43s -- the shortest
          # mock invocation observed anywhere in those runs -- which is 34% of
          # the 6.8 hours of mock time they spent (docs/hummingbird-
          # throughput.md).
          #
          # Persisting it across packages is what mock's root_cache plugin is
          # for, and --uniqueext does not defeat it: buildroot.py keeps
          # `shared_root_name` from before uniqueext is appended and derives
          # `cachedir` from that, precisely so per-package chroots share one
          # cache, with an fcntl lock (shared to unpack, exclusive to rebuild)
          # around it.  Package 1 pays the dnf install and tars the result;
          # packages 2..N untar it, chroot_was_initialized comes back True and
          # _init_pkg_management() is skipped entirely.
          #
          # Safe against the local repo moving underneath it, which it does
          # every time a tier publishes: the root cache holds only the MINIMAL
          # buildroot (BuildRequires are installed after the unpack, from the
          # live repos), and the package manager cache re-reads repomd.xml
          # every transaction because mock's fedora-rawhide template -- which
          # hummingbird-ci.cfg includes -- sets metadata_expire=0 in [main].
          #
          # runner.temp, not github.workspace: the package manager cache keeps
          # every RPM it downloads (keepcache=1, from the same template), so
          # this directory fills with unsigned third-party RPMs.  Keeping it
          # out of the checkout means no future glob over the workspace can
          # sweep one of them into the signed repository by accident.  The
          # actions/cache step above names the same absolute path, so #297's
          # cross-run reuse of the chroot still happens; the two are the same
          # directory, one sharing it within the job and one across runs.
          MOCK_CACHE_DIR: ${{ runner.temp }}/mock-cache
          # Tarballs are inputs, not outputs, and spectool verifies them
          # against the spec's checksums, so this one can stay in the
          # checkout where the rest of Tideforge keeps it.
          RPM_SOURCES_CACHE: ${{ github.workspace }}/.sources-cache
          # Stop starting new tiers with this many minutes left of the job's
          # 360-minute cap, so the run exits cleanly and its publish steps get
          # to execute.
          #
          # Hitting the cap instead is not a slower success, it is a total
          # loss: GitHub CANCELS a timed-out job, `!cancelled()` on the
          # publish steps goes false, and every RPM the run built is thrown
          # away. The next run then rebuilds all of it and hits the same cap
          # at the same place. A full desktop is 40 tiers and 1,248 packages
          # against a six-hour cap -- overrunning is the expected case, not
          # the exception, so the run has to be able to stop early and keep
          # what it made.
          #
          # 55 minutes: `Publish signed rpm-md repository` signs every RPM in
          # the local repo and rclones it, and the artifact upload after it
          # has taken ~6 minutes on a seeded repo.
          BUILD_RESERVE_MINUTES: "55"
        run: |
          IFS=',' read -ra TIERS <<< "${{ steps.tiers.outputs.list }}"
          # One worker per core. This was hardcoded to 2, which was the right
          # number while every mock run held an EXCLUSIVE lock on the local
          # repo -- extra workers could only queue behind it, so raising this
          # bought nothing and just burned memory. That lock is now shared, so
          # workers genuinely build at the same time and the core count is the
          # real ceiling.
          ARGS=(--manifest "${MANIFEST}" --mock-config "${{ matrix.target }}-ci"
                --local-repo "$PWD/local-repo-hummingbird" --jobs "$(nproc)")
          if [[ "${TRIGGER_FORCE}" == "true" ]]; then ARGS+=(--force); fi
          # Keep going after a tier that had failures, and fail the step at
          # the end instead.
          #
          # The step runs under `set -e`, so a tier exiting non-zero used to
          # abort the loop and every later tier was simply never attempted.
          # A dispatch therefore yielded exactly one tier no matter how many
          # were asked for: gnome-01 stopped at 30 of 33 with gnome-02..09
          # untouched (run 31277092125), then gnome-02 stopped at 11 of 14
          # with gnome-03..09 untouched (run 31279618402).
          #
          # A tier's failures rarely block the whole tail. gnome-02's three
          # were libglvnd, libheif and samba; most of what follows does not
          # BuildRequire any of them. Anything that genuinely does will fail
          # on its own and say so, which is information rather than harm --
          # and publishing is copy-not-sync, so nothing already built is lost.
          #
          # The step still fails if any tier did, so a red run stays red.
          rc=0
          failed_tiers=()
          skipped_tiers=()
          started=$(date +%s)
          deadline=$(( started + (360 - BUILD_RESERVE_MINUTES) * 60 ))
          for tier in "${TIERS[@]}"; do
            # Check BEFORE starting, never mid-tier: a half-built tier is
            # fine (publishing is copy-not-sync and the next run reseeds),
            # but a tier abandoned mid-package would leave the local repo in
            # a state the next run has to reason about.
            if (( $(date +%s) >= deadline )); then
              skipped_tiers+=("${tier}")
              continue
            fi
            echo "::group::tier ${tier}"
            ./scripts/build-chain.sh "${ARGS[@]}" --tier "${tier}" || {
              rc=1
              failed_tiers+=("${tier}")
            }
            echo "::endgroup::"
          done
          if (( rc )); then
            echo "::error::tiers with failures: ${failed_tiers[*]}"
          fi
          if (( ${#skipped_tiers[@]} )); then
            # A notice, not an error: stopping early is the design. The next
            # scheduled run seeds from what this one publishes and picks up
            # here, so the stack is walked over successive runs.
            echo "::notice::ran out of time with ${#skipped_tiers[@]} tier(s) unattempted: ${skipped_tiers[*]}"
            echo "TIERS_NOT_ATTEMPTED=${#skipped_tiers[@]}" >> "$GITHUB_ENV"
          fi
          exit "${rc}"

      # What did this run actually do? Nothing answered that before, which is
      # how a pipeline that had compiled zero packages since 2026-08-09 went
      # four days looking like a packaging shortfall rather than a stall. From
      # the outside the repository just had "7,170 packages and no gnome-shell"
      # -- indistinguishable from a rebuild that was 44% done.
      - name: Summarise progress
        id: progress
        if: ${{ !cancelled() }}
        env:
          SEEDED: ${{ steps.seed.outputs.seeded_rpms }}
          TIERS: ${{ steps.tiers.outputs.list }}
          BUILD_RESULT: ${{ steps.build.conclusion }}
          DESKTOP: ${{ matrix.desktop }}
        run: |
          set -euo pipefail
          now=$(find local-repo-hummingbird -name '*.rpm' ! -name '*.src.rpm' | wc -l)
          seeded="${SEEDED:-0}"
          built=$(( now - seeded ))
          (( built < 0 )) && built=0
          selected=$(tr ',' '\n' <<< "${TIERS}" | grep -c . || true)

          # Total the plan still has to get through, straight from the
          # generated manifest rather than a number typed into a comment.
          remaining=$(python3 -c "
          import yaml
          m = yaml.safe_load(open('${MANIFEST}'))
          print(sum(len(t['packages']) for t in m['tiers']))
          ")

          echo "built_rpms=${built}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${DESKTOP}: ${built} RPM(s) built this run"
            echo
            echo "| | |"
            echo "|---|---:|"
            echo "| Tiers selected | ${selected} |"
            echo "| RPMs seeded from R2 | ${seeded} |"
            echo "| RPMs after build | ${now} |"
            echo "| **Built this run** | **${built}** |"
            echo "| Packages in the full plan | ${remaining} |"
            echo "| Tiers left unattempted (out of time) | ${TIERS_NOT_ATTEMPTED:-0} |"
            echo "| \`Build tiers\` result | ${BUILD_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${BUILD_RESULT}" == "skipped" ]]; then
            echo "::error::Build tiers did not run (result: skipped) — an earlier step failed and took the build with it. Nothing will be published."
          elif (( built == 0 )); then
            echo "::warning::No new RPMs were produced. Either every selected tier was already satisfied, or the build failed before producing output. Nothing will be published."
          fi

      # !cancelled(): publish what BUILT even when some packages in the tier
      # failed. Tier gnome-00's first real run built 108 of 124 packages and
      # then exited 1 on the 16 failures — these ifs (which implicitly require
      # every prior step to succeed) skipped publishing, so 4h50m of built
      # RPMs went to a GitHub artifact instead of R2 and the re-run had to
      # build all 108 again (run 31137480986). Partial publishes are exactly
      # what the rclone step below is designed for: copy-not-sync, so nothing
      # already published can be deleted, and the R2 seed step makes the next
      # run rebuild only what is missing. The job still fails on failed
      # packages — publishing is not success, it is not losing the work.
      #
      # Two further clauses, both guarding the same hole from opposite sides.
      # `!cancelled()` alone is true for a step that was SKIPPED, so when a
      # failing cache step skipped `Build tiers`, these conditions still fired
      # and the job signed and re-uploaded the seed it had just pulled down —
      # a ~10 GB artifact and a "published repository" for a run that compiled
      # nothing. Publishing an unchanged repository is not harmless: it is
      # indistinguishable, from the outside, from a repository that is being
      # actively maintained.
      #
      #   steps.build.conclusion != 'skipped'  -- the build must have RUN.
      #                                          Not 'success': a tier with
      #                                          failures is exactly what the
      #                                          partial publish above exists
      #                                          for.
      #   built_rpms != '0'                    -- and must have produced
      #                                          something. This is the
      #                                          refuse-to-publish-empty guard
      #                                          INCIDENT-repo-wipe-gnome.md
      #                                          adopted for every other R2
      #                                          writer in this repository.
      - name: Sign RPMs and publish
        if: >-
          ${{ !cancelled()
             && (github.event_name == 'schedule' || inputs.publish)
             && steps.build.conclusion != 'skipped'
             && steps.progress.outputs.built_rpms != '0' }}
        uses: crazy-max/ghaction-import-gpg@v7
        id: import-gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish signed rpm-md repository
        if: >-
          ${{ !cancelled()
             && (github.event_name == 'schedule' || inputs.publish)
             && steps.build.conclusion != 'skipped'
             && steps.progress.outputs.built_rpms != '0' }}
        run: |
          echo "%_signature gpg" > ~/.rpmmacros
          echo "%_gpg_name ${{ steps.import-gpg.outputs.keyid }}" >> ~/.rpmmacros
          find local-repo-hummingbird -name '*.rpm' ! -name '*.src.rpm' -print0 | xargs -0 -r rpmsign --addsign
          createrepo_c --update local-repo-hummingbird
          # copy, not sync: a partial tier run must never delete packages an
          # earlier tier published. Removal is a deliberate, separate action.
          rclone copy local-repo-hummingbird/ "r2:${R2_BUCKET}/${{ steps.target.outputs.r2_path }}/"
          rclone copy public.gpg "r2:${R2_BUCKET}/${{ steps.target.outputs.r2_path }}/"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hummingbird-rpms-${{ matrix.desktop }}
          path: local-repo-hummingbird
          if-no-files-found: warn

  # The aarch64 leg (tunaOS#1755 §3). Deliberately a SEPARATE job, not an
  # `arch` axis on `build`'s matrix -- every other aarch64 leg in this repo
  # (build-fprintd-aarch64.yml; build-mock-runner.yml's build-and-push-aarch64)
  # is its own job/workflow on a statically-declared ubuntu-24.04-arm runner,
  # not a matrix-computed `runs-on:`, and mirroring that keeps this job
  # readable as "the aarch64 build" rather than a conditional buried in one
  # shared job. The cost is duplication: every step below is `build`'s step of
  # the same name with the arch-specific bits swapped (image, mock-config,
  # r2_path, cache keys, artifact names) -- see each step's comment for the
  # delta. Steps that had nothing arch-specific to say are unchanged from
  # `build` on purpose, so a diff between the two jobs is exactly the diff
  # that matters.
  #
  # What this starts from: hummingbird/20251124-x86_64 is ~7673 packages after
  # many months of daily 6-hour runs (docs/hummingbird-desktop-gap.md,
  # workflow header above). hummingbird/20251124-aarch64 starts at zero. The
  # same BUILD_RESERVE_MINUTES / partial-publish mechanism that let x86_64
  # converge incrementally applies unchanged here, but the first several
  # scheduled runs will publish a small increment each, the same way
  # x86_64's early runs did -- there is no shortcut through that, and nothing
  # about this job's design changes the wall-clock cost of rebuilding ~1248
  # packages from an empty local repo.
  build-aarch64:
    needs: plan
    # Skipped only when a manual dispatch explicitly asked for x86_64 alone
    # (the default -- see the `arch` input above). The schedule trigger has no
    # `inputs`, so `|| 'all'` resolves to 'all' and this job always runs
    # alongside `build`.
    if: ${{ (inputs.arch || 'all') != 'x86_64' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # Same desktops the x86_64 job fans out over, from the same plan job
        # -- the package list is arch-neutral (RPM spec sources imported from
        # Fedora Rawhide dist-git build for whatever architecture mock's
        # chroot targets), so there is no separate aarch64 gap measurement to
        # run or keep in sync.
        desktop: ${{ fromJson(needs.plan.outputs.desktops) }}
        target: [hummingbird]
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the target's R2 path from the package factory manifest
        id: target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Single source of truth, same as the x86_64 job's identically-named
          # step -- but reads r2_path_aarch64, not r2_path. r2_path is read
          # VERBATIM and unformatted by the x86_64 job, which already
          # publishes the live leg; putting a `{arch}` placeholder in that
          # same field and leaving the x86_64 step un-updated would have made
          # it publish to the literal, wrong path "hummingbird/20251124-{arch}".
          # A second field keeps that step untouched.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, yaml
          factory = yaml.safe_load(open("manifests/package-factory.yaml"))
          target = factory["targets"][os.environ["TARGET"]]
          print("r2_path=" + target["r2_path_aarch64"])
          PY
          echo "resolved r2_path for ${TARGET} (aarch64)"

      - name: Install build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q podman createrepo-c rpm gpg gpgconf python3-yaml

      - name: Pull mock runner
        run: podman pull "${MOCK_RUNNER_IMAGE_AARCH64}"

      - name: Configure R2 access
        id: seed
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          EOF
          mkdir -p local-repo-hummingbird
          # Seed from R2 so a resumed run does not rebuild what an earlier run
          # already published. First run of this leg has nothing to seed --
          # the || true is what makes that a no-op instead of a failure.
          rclone copy "r2:${R2_BUCKET}/${{ steps.target.outputs.r2_path }}/" local-repo-hummingbird/ || true

          seeded=$(find local-repo-hummingbird -name '*.rpm' ! -name '*.src.rpm' | wc -l)
          echo "seeded ${seeded} RPM(s) from R2"
          echo "seeded_rpms=${seeded}" >> "$GITHUB_OUTPUT"

      - name: Select tiers
        id: tiers
        env:
          IN_DESKTOP: ${{ matrix.desktop }}
          IN_TIERS: ${{ env.TRIGGER_TIERS }}
          IN_EXCLUDE: ${{ env.TRIGGER_EXCLUDE_TIERS }}
        run: |
          list=$(python3 scripts/select-desktop-tiers.py \
            --manifest "${MANIFEST}" \
            --gap-report docs/hummingbird-desktop-gap.json \
            --desktop "${IN_DESKTOP}" \
            --tiers "${IN_TIERS}" \
            --exclude-tiers "${IN_EXCLUDE}")
          echo "selected $(tr ',' '\n' <<< "$list" | wc -l) tiers: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "slug=$(printf '%s' "$list" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Import Fedora Rawhide packaging for the selected tiers
        run: |
          TIER_ARGS=()
          IFS=',' read -ra TIERS <<< "${{ steps.tiers.outputs.list }}"
          for tier in "${TIERS[@]}"; do TIER_ARGS+=(--tier "${tier}"); done
          python3 scripts/import-fedora-distgit.py \
            --build-order "${MANIFEST}" \
            "${TIER_ARGS[@]}" \
            --branch rawhide \
            --state hummingbird-imports.json \
            --release-bump \
            --jobs 4

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # -aarch64 suffix: `build`'s x86_64 job uploads
          # hummingbird-import-state-${{ matrix.desktop }} in the SAME
          # workflow run, and actions/upload-artifact v4+ hard-fails a second
          # upload of a name already used in the run.
          name: hummingbird-import-state-${{ matrix.desktop }}-aarch64
          path: hummingbird-imports.json
          if-no-files-found: warn

      - name: Cache the mock chroot and its dnf downloads
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/mock-cache
          # aarch64 in the key itself, not just a different hashFiles input:
          # this cache holds a real chroot tree, and an aarch64 root cache
          # restored into an x86_64 mock run (or vice versa) is not a cache
          # hit, it is a corrupt buildroot. hashFiles names the aarch64 cfg,
          # so an edit to hummingbird-ci.cfg alone (no aarch64-specific
          # change) does not invalidate this leg's cache for nothing.
          key: hummingbird-mock-aarch64-${{ matrix.desktop }}-${{ hashFiles('mock/hummingbird-ci-aarch64.cfg') }}-${{ steps.tiers.outputs.slug }}-${{ github.run_id }}
          restore-keys: |
            hummingbird-mock-aarch64-${{ matrix.desktop }}-${{ hashFiles('mock/hummingbird-ci-aarch64.cfg') }}-${{ steps.tiers.outputs.slug }}-
            hummingbird-mock-aarch64-${{ matrix.desktop }}-${{ hashFiles('mock/hummingbird-ci-aarch64.cfg') }}-

      - name: Cache upstream source tarballs
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: .sources-cache
          # Deliberately the SAME key as `build`'s (no arch component):
          # upstream source tarballs are identical bytes regardless of which
          # architecture rebuilds them, verified by the spec's own checksum
          # before anything reads this cache (build-chain.sh, "Fetch dist-git
          # lookaside sources"). Sharing it means this leg's first runs do not
          # re-download everything the x86_64 runs already cached.
          key: hummingbird-sources-${{ hashFiles('build-order-hummingbird-desktops.yml') }}-${{ github.run_id }}
          restore-keys: |
            hummingbird-sources-${{ hashFiles('build-order-hummingbird-desktops.yml') }}-
            hummingbird-sources-

      - name: Build tiers
        id: build
        env:
          MOCK_CACHE_DIR: ${{ runner.temp }}/mock-cache
          RPM_SOURCES_CACHE: ${{ github.workspace }}/.sources-cache
          BUILD_RESERVE_MINUTES: "55"
        run: |
          IFS=',' read -ra TIERS <<< "${{ steps.tiers.outputs.list }}"
          # --mock-config carries the -aarch64 suffix (hummingbird-ci-aarch64,
          # config_opts['root'] in mock/hummingbird-ci-aarch64.cfg) and
          # --image is passed explicitly and MUST be. build-chain.sh's own
          # BUILD_IMAGE default is the x86_64 tag, and MOCK_RUNNER_IMAGE_AARCH64
          # above is otherwise decorative -- nothing in the script reads an
          # env var for this, only --image. build-fprintd-aarch64.yml hit this
          # exact bug first: without --image, podman pulled the amd64 tag onto
          # this arm64 runner and every package failed with "Exec format
          # error" (that workflow's own "Build libfprint + fprintd" step
          # comment records the failure).
          ARGS=(--manifest "${MANIFEST}" --mock-config "${{ matrix.target }}-ci-aarch64"
                --image "${MOCK_RUNNER_IMAGE_AARCH64}"
                --local-repo "$PWD/local-repo-hummingbird" --jobs "$(nproc)")
          if [[ "${TRIGGER_FORCE}" == "true" ]]; then ARGS+=(--force); fi
          rc=0
          failed_tiers=()
          skipped_tiers=()
          started=$(date +%s)
          deadline=$(( started + (360 - BUILD_RESERVE_MINUTES) * 60 ))
          for tier in "${TIERS[@]}"; do
            if (( $(date +%s) >= deadline )); then
              skipped_tiers+=("${tier}")
              continue
            fi
            echo "::group::tier ${tier}"
            ./scripts/build-chain.sh "${ARGS[@]}" --tier "${tier}" || {
              rc=1
              failed_tiers+=("${tier}")
            }
            echo "::endgroup::"
          done
          if (( rc )); then
            echo "::error::tiers with failures: ${failed_tiers[*]}"
          fi
          if (( ${#skipped_tiers[@]} )); then
            echo "::notice::ran out of time with ${#skipped_tiers[@]} tier(s) unattempted: ${skipped_tiers[*]}"
            echo "TIERS_NOT_ATTEMPTED=${#skipped_tiers[@]}" >> "$GITHUB_ENV"
          fi
          exit "${rc}"

      - name: Summarise progress
        id: progress
        if: ${{ !cancelled() }}
        env:
          SEEDED: ${{ steps.seed.outputs.seeded_rpms }}
          TIERS: ${{ steps.tiers.outputs.list }}
          BUILD_RESULT: ${{ steps.build.conclusion }}
          DESKTOP: ${{ matrix.desktop }}
        run: |
          set -euo pipefail
          now=$(find local-repo-hummingbird -name '*.rpm' ! -name '*.src.rpm' | wc -l)
          seeded="${SEEDED:-0}"
          built=$(( now - seeded ))
          (( built < 0 )) && built=0
          selected=$(tr ',' '\n' <<< "${TIERS}" | grep -c . || true)

          remaining=$(python3 -c "
          import yaml
          m = yaml.safe_load(open('${MANIFEST}'))
          print(sum(len(t['packages']) for t in m['tiers']))
          ")

          echo "built_rpms=${built}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${DESKTOP} (aarch64): ${built} RPM(s) built this run"
            echo
            echo "| | |"
            echo "|---|---:|"
            echo "| Tiers selected | ${selected} |"
            echo "| RPMs seeded from R2 | ${seeded} |"
            echo "| RPMs after build | ${now} |"
            echo "| **Built this run** | **${built}** |"
            echo "| Packages in the full plan | ${remaining} |"
            echo "| Tiers left unattempted (out of time) | ${TIERS_NOT_ATTEMPTED:-0} |"
            echo "| \`Build tiers\` result | ${BUILD_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${BUILD_RESULT}" == "skipped" ]]; then
            echo "::error::Build tiers did not run (result: skipped) — an earlier step failed and took the build with it. Nothing will be published."
          elif (( built == 0 )); then
            echo "::warning::No new RPMs were produced. Either every selected tier was already satisfied, or the build failed before producing output. Nothing will be published."
          fi

      - name: Sign RPMs and publish
        if: >-
          ${{ !cancelled()
             && (github.event_name == 'schedule' || inputs.publish)
             && steps.build.conclusion != 'skipped'
             && steps.progress.outputs.built_rpms != '0' }}
        uses: crazy-max/ghaction-import-gpg@v7
        id: import-gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish signed rpm-md repository
        if: >-
          ${{ !cancelled()
             && (github.event_name == 'schedule' || inputs.publish)
             && steps.build.conclusion != 'skipped'
             && steps.progress.outputs.built_rpms != '0' }}
        run: |
          echo "%_signature gpg" > ~/.rpmmacros
          echo "%_gpg_name ${{ steps.import-gpg.outputs.keyid }}" >> ~/.rpmmacros
          find local-repo-hummingbird -name '*.rpm' ! -name '*.src.rpm' -print0 | xargs -0 -r rpmsign --addsign
          createrepo_c --update local-repo-hummingbird
          rclone copy local-repo-hummingbird/ "r2:${R2_BUCKET}/${{ steps.target.outputs.r2_path }}/"
          rclone copy public.gpg "r2:${R2_BUCKET}/${{ steps.target.outputs.r2_path }}/"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hummingbird-rpms-${{ matrix.desktop }}-aarch64
          path: local-repo-hummingbird
          if-no-files-found: warn
