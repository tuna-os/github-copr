name: Publish build-chain RPMs

# The native build chain builds and has never had a publisher.
#
# publish-tideforge-rpms.yml (#451) covers tideforge cells only. Nothing takes
# `.factory/<cell>/artifacts/*.rpm` from a build-chain cell to R2 -- so
# gnome50 can produce 55 packages across 19 tiers and a 497 MB artifact
# (run 32429674500) and none of it is installable by anything.
#
# That gap is what every remaining el10 blocker outside cosmic-session
# collapses to: xfwl4 wants libxfce4ui-devel and cosmic-settings-daemon wants
# adw-gtk3-theme, both build-chain products, both built, neither served
# (tuna-os/tunaos-packages#459).
#
# Deliberately NOT a copy of the tideforge publisher. The sign/place/index
# half lives in scripts/publish-rpm-wave.sh and is shared by both, because
# every safety rule in it was learned from an incident and a hand-copied
# second publisher would have to learn each one again.
on:
  workflow_dispatch:
    inputs:
      cells:
        description: >-
          Comma-separated build-chain cell IDs, e.g.
          "xfce-el10-x86_64,gnome51-el10-x86_64". Deliberately no default:
          see the destination-collision guard below.
        required: true
        type: string
      dry_run:
        description: "Build and index, but do not sync to R2"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # SHARED with publish-tideforge-rpms.yml, not a group of its own. Both
  # publishers `rclone sync` into the same bucket, and sync makes the
  # destination match the source -- two of them running at once can delete
  # each other's packages (#124 / INCIDENT-repo-wipe-gnome). Serialising
  # them is the only thing that makes the sync-down/sync-up dance safe.
  group: publish-rpms
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the requested cells
        id: plan
        env:
          CELLS: ${{ inputs.cells }}
        run: |
          set -euo pipefail
          python3 scripts/plan-build-chain-publish.py \
            --cells "$CELLS" --github-output "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ${{ matrix.runner }}
    # Build-chain cells are tiered source builds: gnome50 is 19 tiers and
    # hours, not the minutes a tideforge cell takes.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install native build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q createrepo-c podman rpm
      - id: epoch
        name: Date the build reproducibly
        # run-package-factory-cell.sh requires SOURCE_DATE_EPOCH (`${VAR:?}`),
        # and the first dispatch of this workflow died on its absence:
        #   run-package-factory-cell.sh: line 14: SOURCE_DATE_EPOCH:
        #   parameter null or not set
        # Same derivation as package-factory-cell.yml's identity step for a
        # build-chain cell: the newest commit touching the manifest or any of
        # the family's source paths.
        env:
          SOURCE_PATHS: ${{ toJSON(matrix.source_paths) }}
        run: |
          set -euo pipefail
          mapfile -t source_paths < <(jq -r '.[]' <<<"$SOURCE_PATHS")
          epoch=$(git log -1 --format=%ct -- '${{ matrix.manifest }}' "${source_paths[@]}")
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
      - name: Build the cell
        env:
          CELL_ID: ${{ matrix.id }}
          ENGINE: build-chain
          # No RECIPE or FORMAT: the build-chain branch of the runner exits
          # before either is read (they belong to the tideforge path).
          TARGET: ${{ matrix.target }}
          ARCHITECTURE: ${{ matrix.architecture }}
          IMAGE: ${{ matrix.image }}
          MANIFEST: ${{ matrix.manifest }}
          MOCK_CONFIG: ${{ matrix.mock_config }}
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        run: bash scripts/run-package-factory-cell.sh
      - uses: actions/upload-artifact@v7
        with:
          name: publish-rpm-${{ matrix.id }}
          path: .factory/${{ matrix.id }}/artifacts/*.rpm
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      # Serial: every cell talks to the same bucket and rclone config.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install tooling
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q createrepo-c rpm gpg gpgconf
          curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Configure rpmsign and rclone
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          echo "%_signature gpg" > ~/.rpmmacros
          echo "%_gpg_name ${{ steps.import-gpg.outputs.keyid }}" >> ~/.rpmmacros
          echo "%__gpg_sign_cmd %{__gpg} gpg --batch --no-verbose --no-armor --use-agent --no-secmem-warning -u \"%{_gpg_name}\" -sbo %{__signature_filename} %{__plaintext_filename}" >> ~/.rpmmacros
          mkdir -p ~/.config/rclone
          umask 077
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          EOF
      - name: Sync down the existing repo
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p repo
          rclone sync "r2:${R2_BUCKET}/${{ matrix.r2_path }}/" repo/ \
            --exclude "repodata/**" || true
          echo "synced down $(find repo -name '*.rpm' | wc -l) RPM(s) from ${{ matrix.r2_path }}"
      - uses: actions/download-artifact@v8
        with:
          name: publish-rpm-${{ matrix.id }}
          path: staged
      - name: Sign and index
        run: |
          set -euo pipefail
          bash scripts/publish-rpm-wave.sh \
            --staged staged --repo repo --subdir build-chain
      - name: Sync up
        if: ${{ !inputs.dry_run }}
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          rclone sync repo/ "r2:${R2_BUCKET}/${{ matrix.r2_path }}/"
      - name: Report a dry run honestly
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::dry run — built, signed and indexed ${{ matrix.id }} but synced nothing to ${{ matrix.r2_path }}"

  # The #179 job, and the one this publisher shipped without.
  #
  # publish-tideforge-rpms.yml has carried a verify job from its first
  # publish, for the reason its own comment gives: "a repo that was never
  # actually published can never sit behind a green workflow". Every step
  # here can succeed -- build, sign, index, rclone sync -- and the packages
  # still not be reachable, because "the workflow exited 0" and "dnf can
  # install it" are different claims and only the second one matters.
  #
  # It earned its place immediately. Run against the live indexes while being
  # written, it showed libxfce4ui-devel already served at
  # xfce/10-stream-x86_64 and entirely absent from repo/10/x86_64 -- the el10
  # target's published_index, the repo tideforge buildroots actually read. The
  # package was never unpublished; it was published where nothing looks
  # (tuna-os/tunaos-packages#466).
  #
  # ON THE URL. Derived from r2_path, which is safe for the build-chain
  # families and NOT in general: manifests/package-factory.yaml records that
  # the el10 tideforge target writes rpm/el10/x86_64 and serves
  # repo/10/x86_64. Confirmed by request that xfce/10-stream-x86_64,
  # xfce/44-x86_64 and hummingbird/20251124-* each serve at their own
  # r2_path. A family whose read path diverges must gain an explicit key
  # rather than being quietly mis-verified against a URL that 404s.
  verify:
    needs: [plan, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: publish-rpm-${{ matrix.id }}
          path: staged
      - name: Assert every published package is in the served index
        run: |
          set -euo pipefail
          python3 scripts/verify-published-wave.py \
            --served-url "https://repo.tunaos.org/${{ matrix.r2_path }}/" \
            --staged staged
