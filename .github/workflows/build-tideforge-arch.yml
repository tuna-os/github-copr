name: Build Tideforge Arch packages

on:
  # Unfiltered plus merge_group for the same reason as the supported gate
  # (#173): the detect job decides relevance cheaply and the aggregator
  # always reports, which is what makes it requirable.
  pull_request:
  merge_group:
  workflow_dispatch:

# Three runs of this workflow were queued simultaneously on one branch because
# nothing superseded the earlier ones — each pushed commit started a fresh
# ~50-job matrix while the previous two still held runner slots. Only the
# newest can gate anything; the older ones burn capacity that the rest of the
# org is queuing for. See #130 for the same class of waste.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        name: Decide whether an Arch build input changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(packages/|mock/|scripts/(?:tideforge\.py|build-chain\.sh|assert-arch-runtime-closure\.sh|plan_gate_matrix\.py)$|\.github/workflows/build-tideforge-arch\.yml|\.github/actions/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.relevant == 'true' }}
    name: ${{ matrix.package }} (Arch, unpatched)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The smoke command is read from each recipe's verify: block at
        # clean-install time (scripts/tideforge.py verify), so a cell here is
        # only a (package) coordinate; see
        # scripts/assert-arch-runtime-closure.sh for why the ELF closure check
        # that runs alongside the smoke is the part that catches
        # under-declared `depends`.
        include:
          - package: niri
          # DMS's greeter payload is the user-visible Arch gap: keep it in the
          # clean-install gate so a recipe can be green without ever being
          # exercised by the Arch package pipeline (#131).
          - package: dms-greeter
          # uupd and greetd are green on every other declared target with the
          # byte-identical contract; arch was the last declared-but-never-
          # exercised pair for both (#139 defect class).
          - package: uupd
          # First of the library/tool recipes on arch, held until the deb
          # library wave landed the common-list gcc-c++ fix its PKGBUILD
          # needed; libunwind-devel and ninja-build follow once this cell
          # proves the shape (stagger: small wave, green, then widen).
          - package: cli11-devel
          - package: greetd
          - package: kairpods
          - package: krunner-bazaar
          - package: dgop
          - package: danksearch
          - package: dankcalendar
          - package: bazaar
          - package: plasma-setup
          - package: libunwind-devel
          - package: ninja-build
          - package: oversteer-udev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install pyyaml
      - name: Restore the content-addressed source cache
        uses: ./.github/actions/tideforge-source-cache
        with:
          recipe: packages/${{ matrix.package }}/package.yaml
      - run: python3 scripts/tideforge.py validate packages/${{ matrix.package }}/package.yaml
      - run: python3 scripts/verify-tideforge-source.py packages/${{ matrix.package }}/package.yaml --cache-dir "$HOME/.cache/tideforge/sources"
      - run: python3 scripts/tideforge.py render packages/${{ matrix.package }}/package.yaml --target arch --output .tideforge/arch/${{ matrix.package }}
      - name: Derive the clean-install smoke from the recipe
        # The recipe is the single source of how this package proves itself
        # installed (#139). Derived HERE, before the build container runs:
        # that container chowns /work to its builder user, after which the
        # runner can no longer create files in this directory — deriving in
        # the clean-install step failed every arch cell with
        # "verify-smoke.sh: Permission denied".
        run: python3 scripts/tideforge.py verify packages/${{ matrix.package }}/package.yaml --target arch --field smoke > .tideforge/arch/${{ matrix.package }}/verify-smoke.sh
      - name: Pull the build image, retrying transient registry failures
        run: scripts/pull-container-image.sh docker.io/library/archlinux:latest
      - name: Build generated PKGBUILD
        run: |
          set -euo pipefail
          mkdir -p .tideforge/arch/${{ matrix.package }}/artifacts
          docker run --rm --volume "$PWD/.tideforge/arch/${{ matrix.package }}:/work" --workdir /work docker.io/library/archlinux:latest bash -lc '
            set -euo pipefail
            # db and pool must come from ONE mirror. 2026-08-18: fastly
            # (first in the image mirrorlist) served a core.db still naming
            # elfutils-0.195-8 while every pool 404d it — Arch had moved to
            # 0.196-1 on 08-17 and geo db+pool agreed — so pacman resolved
            # from the stale db and no amount of retrying could succeed.
            # Pinning geo removes the split-brain: a single mirror keeps its
            # db and pool in step.
            echo "Server = https://geo.mirror.pkgbuild.com/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
            pacman -Syu --noconfirm
            pacman -S --needed --noconfirm base-devel sudo
            useradd --create-home builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
            chmod 0440 /etc/sudoers.d/builder
            chown -R builder:builder /work
            su builder -s /bin/bash -c "cd /work && PKGDEST=/work/artifacts makepkg --syncdeps --noconfirm"
            pacman -Qip /work/artifacts/*.pkg.tar.* > /work/artifacts/package-info.txt
          '
      - name: Clean-install generated package from an ephemeral repository
        run: |
          set -euo pipefail
          # verify-smoke.sh was derived before the build step — see there.
          docker run --rm --user root \
            --volume "$PWD/.tideforge/arch/${{ matrix.package }}:/work:ro" \
            --volume "$PWD/scripts:/scripts:ro" \
            docker.io/library/archlinux:latest \
            bash /scripts/arch-clean-install.sh ${{ matrix.package }} /work/artifacts bash /work/verify-smoke.sh
      - run: python3 scripts/validate-built-arch-package.py packages/${{ matrix.package }}/package.yaml .tideforge/arch/${{ matrix.package }}/artifacts/package-info.txt
      - if: matrix.package == 'niri'
        run: python3 scripts/compare-official-package.py packages/niri/package.yaml --strict
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.package }}-arch-unpatched
          path: .tideforge/arch/${{ matrix.package }}/artifacts/
          if-no-files-found: warn

  tideforge-gate-arch:
    name: Tideforge gate (arch)
    needs: [detect-changes, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the arch matrix to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEVANT: ${{ needs.detect-changes.outputs.relevant }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          if [ "${RELEVANT}" != "true" ]; then
            test "$(echo "$NEEDS" | jq -r '.["detect-changes"].result')" = "success"
            echo "No Tideforge-relevant changes; gate not applicable."
            exit 0
          fi
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "Gate jobs not successful:" >&2
            echo "$bad" >&2
            exit 1
          fi
          echo "All gate jobs succeeded."
