name: Build Tideforge Arch packages

on:
  pull_request:
    paths:
      - packages/niri/package.yaml
      - packages/kairpods/package.yaml
      - packages/krunner-bazaar/package.yaml
      - packages/dgop/package.yaml
      - packages/danksearch/package.yaml
      - packages/dankcalendar/package.yaml
      - packages/bazaar/package.yaml
      - packages/plasma-setup/package.yaml
      - packages/oversteer-udev/package.yaml
      - scripts/tideforge.py
      - scripts/verify-tideforge-source.py
      - scripts/fetch-tideforge-sources.py
      - scripts/compare-official-package.py
      - scripts/validate-built-arch-package.py
      - scripts/pull-container-image.sh
      - .github/workflows/build-tideforge-arch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.package }} (Arch, unpatched)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [niri, kairpods, krunner-bazaar, dgop, danksearch, dankcalendar, bazaar, plasma-setup, oversteer-udev]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install pyyaml
      - run: python3 scripts/tideforge.py validate packages/${{ matrix.package }}/package.yaml
      - run: python3 scripts/verify-tideforge-source.py packages/${{ matrix.package }}/package.yaml
      - run: python3 scripts/tideforge.py render packages/${{ matrix.package }}/package.yaml --target arch --output .tideforge/arch/${{ matrix.package }}
      - name: Pull the build image, retrying transient registry failures
        run: scripts/pull-container-image.sh docker.io/library/archlinux:latest
      - name: Build generated PKGBUILD
        run: |
          set -euo pipefail
          mkdir -p .tideforge/arch/${{ matrix.package }}/artifacts
          docker run --rm --volume "$PWD/.tideforge/arch/${{ matrix.package }}:/work" --workdir /work docker.io/library/archlinux:latest bash -lc '
            set -euo pipefail
            pacman -Syu --noconfirm
            pacman -S --needed --noconfirm base-devel sudo
            useradd --create-home builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
            chmod 0440 /etc/sudoers.d/builder
            chown -R builder:builder /work
            su builder -s /bin/bash -c "cd /work && PKGDEST=/work/artifacts makepkg --syncdeps --noconfirm"
            pacman -Qip /work/artifacts/*.pkg.tar.* > /work/artifacts/package-info.txt
          '
      - name: Clean-install generated package from an ephemeral repository
        run: |
          set -euo pipefail
          docker run --rm --user root --volume "$PWD/.tideforge/arch/${{ matrix.package }}:/work:ro" docker.io/library/archlinux:latest bash -lc '
            set -euo pipefail
            pacman -Sy --noconfirm pacman-contrib
            repo-add /tmp/tideforge.db.tar.gz /work/artifacts/*.pkg.tar.*
            mkdir -p /var/lib/tideforge
            cp /work/artifacts/*.pkg.tar.* /var/lib/tideforge/
            # pacman resolves a repository named "tideforge" as tideforge.db.
            # repo-add writes a compressed archive, so expose it under the name
            # the file:// repository client actually requests.
            cp /tmp/tideforge.db.tar.gz /var/lib/tideforge/tideforge.db
            # CI artifacts are deliberately unsigned. Production promotion has
            # a separate signing gate; this isolated repository exists solely
            # to prove pacman's dependency solver and payload installation.
            # Keep the repository definition out of /etc: hosted container
            # engines may user-map root and make that image file read-only.
            # Recent Arch container images no longer guarantee that a copied
            # /etc/pacman.conf survives the hosted container user mapping.
            # Generate the small, complete test configuration instead of
            # modifying or copying image-owned configuration files.
            cat > /tmp/tideforge-pacman.conf <<'EOF'
            [options]
            Architecture = auto
            SigLevel = Required DatabaseOptional
            LocalFileSigLevel = Optional

            [core]
            Include = /etc/pacman.d/mirrorlist

            [extra]
            Include = /etc/pacman.d/mirrorlist

            [tideforge]
            SigLevel = Optional TrustAll
            Server = file:///var/lib/tideforge
            EOF
            pacman --config /tmp/tideforge-pacman.conf -Sy --noconfirm
            pacman --config /tmp/tideforge-pacman.conf -S --noconfirm ${{ matrix.package }}
            pacman -Q ${{ matrix.package }}
          '
      - run: python3 scripts/validate-built-arch-package.py packages/${{ matrix.package }}/package.yaml .tideforge/arch/${{ matrix.package }}/artifacts/package-info.txt
      - if: matrix.package == 'niri'
        run: python3 scripts/compare-official-package.py packages/niri/package.yaml --strict
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.package }}-arch-unpatched
          path: .tideforge/arch/${{ matrix.package }}/artifacts/
          if-no-files-found: warn
