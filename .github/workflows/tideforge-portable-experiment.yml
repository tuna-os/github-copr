name: Tideforge portable payload experiment

on:
  pull_request:
    paths:
      - .github/workflows/tideforge-portable-experiment.yml
      - scripts/tideforge-intermediate.py
      - scripts/tideforge.py
      - scripts/validate-built-arch-package.py
      - packages/_template/package.yaml
      - packages/wayland-protocols/package.yaml
      - packages/oversteer-udev/package.yaml
      - packages/danksearch/package.yaml
      - packages/dgop/package.yaml
      - packages/dms-cli/package.yaml
      - packages/dms-greeter/package.yaml
      - packages/dms/package.yaml
      - packages/uupd/package.yaml
      - tests/test_tideforge_intermediate.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tideforge-portable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      payload_matrix: ${{ steps.plan.outputs.payload_matrix }}
      carrier_matrix: ${{ steps.plan.outputs.carrier_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install pyyaml==6.0.3
      - id: plan
        name: Detect portable package handlers
        run: |
          python3 scripts/tideforge-intermediate.py candidates \
            --root packages --architecture x86_64 \
            --targets el10 ubuntu debian opensuse-tumbleweed arch \
            --github-output "$GITHUB_OUTPUT"

  payload:
    name: Build once / ${{ matrix.package }} / x86_64
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.payload_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
          cache: false
      - name: Install Python dependencies
        run: pip install pyyaml==6.0.3
      - name: Build and reseal the portable payload
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%at -- "${{ matrix.recipe }}")
          mkdir -p .portable/cache .portable/first .portable/second
          args=(
            --recipe "${{ matrix.recipe }}"
            --architecture x86_64
            --build-contract "go-$(go version | tr ' ' '-')-linux-x86_64"
            --cache-dir .portable/cache
          )
          mkdir -p .benchmark
          started=$(date +%s%N)
          python3 scripts/tideforge-intermediate.py build "${args[@]}" \
            --output ".portable/first/${{ matrix.package }}.tfi.tar"
          finished=$(date +%s%N)
          printf '{"kind":"portable-payload","package":"%s","architecture":"%s","milliseconds":%d,"success":true}\n' \
            '${{ matrix.package }}' '${{ matrix.architecture }}' \
            "$(( (finished - started) / 1000000 ))" \
            > ".benchmark/payload-${{ matrix.package }}-${{ matrix.architecture }}.json"
          python3 scripts/tideforge-intermediate.py build "${args[@]}" \
            --output ".portable/second/${{ matrix.package }}.tfi.tar"
          cmp ".portable/first/${{ matrix.package }}.tfi.tar" \
              ".portable/second/${{ matrix.package }}.tfi.tar"
          python3 scripts/tideforge-intermediate.py verify \
            ".portable/first/${{ matrix.package }}.tfi.tar"
          sha256sum ".portable/first/${{ matrix.package }}.tfi.tar"
      - uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.package }}-x86_64
          path: .portable/first/${{ matrix.package }}.tfi.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-payload-${{ matrix.package }}-${{ matrix.architecture }}
          path: .benchmark/*.json
          if-no-files-found: error

  native-package:
    name: Repackage / ${{ matrix.package }} / ${{ matrix.target }}
    needs: [plan, payload]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.carrier_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: portable-${{ matrix.package }}-x86_64
          path: .portable/input
      - name: Install native carrier tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rpm zstd
          pip install pyyaml==6.0.3
      - name: Repackage without compilation
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%at -- "${{ matrix.recipe }}")
          mkdir -p .benchmark
          started=$(date +%s%N)
          python3 scripts/tideforge-intermediate.py package \
            ".portable/input/${{ matrix.package }}.tfi.tar" \
            --recipe "${{ matrix.recipe }}" \
            --target "${{ matrix.target }}" --output-dir .portable/out
          finished=$(date +%s%N)
          printf '{"kind":"portable-carrier","package":"%s","target":"%s","architecture":"%s","milliseconds":%d,"success":true}\n' \
            '${{ matrix.package }}' '${{ matrix.target }}' '${{ matrix.architecture }}' \
            "$(( (finished - started) / 1000000 ))" \
            > ".benchmark/carrier-${{ matrix.package }}-${{ matrix.target }}-${{ matrix.architecture }}.json"
          find .portable/out -maxdepth 1 -type f -print -exec sha256sum {} \;
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-carrier-${{ matrix.package }}-${{ matrix.target }}-${{ matrix.architecture }}
          path: .benchmark/*.json
          if-no-files-found: error
      - name: Read Arch package metadata
        if: matrix.target == 'arch'
        run: |
          docker run --rm --volume "$PWD/.portable/out:/artifacts:ro" \
            docker.io/library/archlinux:latest bash -lc \
            'pacman -Qip /artifacts/*.pkg.tar.*' > .portable/out/package-info.txt
      - name: Run the existing native lint/install/smoke gate
        env:
          CELL_ID: portable-${{ matrix.package }}-${{ matrix.target }}
          ENGINE: tideforge
          TARGET: ${{ matrix.target }}
          ARCHITECTURE: ${{ matrix.architecture }}
          FORMAT: ${{ matrix.format }}
          IMAGE: ${{ matrix.image }}
          RECIPE: ${{ matrix.recipe }}
          OUT_DIR: ${{ github.workspace }}/.portable/out
        run: |
          mkdir -p .portable/out/artifacts
          find .portable/out -maxdepth 1 -type f \
            \( -name '*.rpm' -o -name '*.deb' -o -name '*.pkg.tar.*' \) \
            -exec cp -t .portable/out/artifacts {} +
          ./scripts/verify-package-factory-cell.sh

  native-baseline:
    name: Existing native / ${{ matrix.package }} / ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.carrier_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: pip install pyyaml==6.0.3
      - uses: ./.github/actions/tideforge-source-cache
        with:
          recipe: ${{ matrix.recipe }}
      - run: scripts/pull-container-image.sh "${{ matrix.image }}" "${{ matrix.image }}"
      - name: Time the existing target-native build and package path
        env:
          CELL_ID: baseline-${{ matrix.package }}-${{ matrix.target }}-${{ matrix.architecture }}
          ENGINE: tideforge
          TARGET: ${{ matrix.target }}
          ARCHITECTURE: ${{ matrix.architecture }}
          FORMAT: ${{ matrix.format }}
          IMAGE: ${{ matrix.image }}
          RECIPE: ${{ matrix.recipe }}
          OUT_DIR: ${{ github.workspace }}/.baseline/out
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%at -- "${{ matrix.recipe }}")
          mkdir -p .benchmark
          started=$(date +%s%N)
          set +e
          bash scripts/run-package-factory-cell.sh
          status=$?
          set -e
          finished=$(date +%s%N)
          success=false
          if (( status == 0 )); then success=true; fi
          printf '{"kind":"target-native","package":"%s","target":"%s","architecture":"%s","milliseconds":%d,"success":%s,"exit_code":%d}\n' \
            '${{ matrix.package }}' '${{ matrix.target }}' '${{ matrix.architecture }}' \
            "$(( (finished - started) / 1000000 ))" "$success" "$status" \
            > ".benchmark/native-${{ matrix.package }}-${{ matrix.target }}-${{ matrix.architecture }}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-native-${{ matrix.package }}-${{ matrix.target }}-${{ matrix.architecture }}
          path: .benchmark/*.json
          if-no-files-found: error

  benchmark:
    name: Build-time benchmark
    if: always()
    needs: [payload, native-package, native-baseline]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: benchmark-*
          path: benchmark
          merge-multiple: true
      - name: Compare compilation work
        run: |
          python3 - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          rows = [json.loads(path.read_text()) for path in Path("benchmark").glob("*.json")]
          grouped = defaultdict(list)
          for row in rows:
              grouped[row["kind"]].append(row)
          for kind in ("target-native", "portable-payload", "portable-carrier"):
              values = grouped[kind]
              total = sum(row["milliseconds"] for row in values)
              passed = sum(row.get("success", False) for row in values)
              print(f"{kind}: {len(values)} measurements, {passed} successful, {total / 1000:.3f}s summed")
          portable = sum(row["milliseconds"] for row in grouped["portable-payload"] + grouped["portable-carrier"])
          native = sum(row["milliseconds"] for row in grouped["target-native"] if row.get("success"))
          print(f"successful native sum: {native / 1000:.3f}s")
          print(f"portable build+carrier sum: {portable / 1000:.3f}s")
          if native:
              print(f"measured summed-work reduction: {(1 - portable / native) * 100:.1f}%")
          print(json.dumps(sorted(rows, key=lambda row: (row["package"], row["kind"], row.get("target", ""))), indent=2))
          PY

  result:
    name: Portable payload experiment
    if: always()
    needs: [plan, payload, native-package, native-baseline, benchmark]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every experiment cell
        env:
          PAYLOAD: ${{ needs.payload.result }}
          NATIVE_PACKAGE: ${{ needs.native-package.result }}
          PLAN: ${{ needs.plan.result }}
        run: test "$PLAN" = success && test "$PAYLOAD" = success && test "$NATIVE_PACKAGE" = success
