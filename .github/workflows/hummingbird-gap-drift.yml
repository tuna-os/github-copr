name: Hummingbird Gap Drift

# Re-measures the desktop gap against the LIVE upstream public-hummingbird
# repository whenever upstream publishes a new revision.  The build order is
# generated as (desktop closure) minus (what upstream ships) — see
# scripts/measure-hummingbird-gap.py — so every package upstream adopts must
# drop out of our build set, or the factory keeps rebuilding something the
# target already maintains.  Upstream adopted 12 of our packages between the
# 2026-08-06 measurement and 2026-08-17 alone; the drift is continuous.
#
# The revision gate keeps the daily run cheap: the expensive part is the
# Fedora Rawhide reference download, and it is skipped entirely when
# upstream's repomd revision matches the one recorded in the last committed
# measurement.  workflow_dispatch always re-measures.

on:
  schedule:
    # Ahead of the 12:00 UTC hummingbird desktops build, so a regenerated
    # build order can land before the factory's next run.
    - cron: '15 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  remeasure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare upstream revision with the last committed measurement
        id: drift
        run: |
          set -euo pipefail
          url="https://packages.redhat.com/api/pulp-content/public-hummingbird/x86_64/repodata/repomd.xml"
          live="$(curl -fsSL "$url" | python3 -c '
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.stdin.buffer).getroot()
          print(root.findtext("{http://linux.duke.edu/metadata/repo}revision"))
          ')"
          measured="$(python3 -c '
          import json
          print(json.load(open("docs/hummingbird-desktop-gap.json"))["target_index"]["revision"])
          ')"
          echo "upstream revision: live=${live} measured=${measured}"
          if [ "$live" = "$measured" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.drift.outputs.drifted == 'true'
        with:
          python-version: '3.14'

      - if: steps.drift.outputs.drifted == 'true'
        run: pip install --disable-pip-version-check PyYAML

      - name: Re-measure the gap against live upstream
        if: steps.drift.outputs.drifted == 'true'
        run: |
          python3 scripts/measure-hummingbird-gap.py \
            --report-json docs/hummingbird-desktop-gap.json \
            --build-order build-order-hummingbird-desktops.yml

      - name: Regenerate the distributed workflow from the new build order
        if: steps.drift.outputs.drifted == 'true'
        # Same pinned invocation as tests/test_distributed_workflow_is_regenerated.py;
        # without this the automation PR fails that test by construction.
        run: |
          python3 scripts/generate-distributed-workflow.py \
            build-order-hummingbird-desktops.yml \
            .github/workflows/build-hummingbird-distributed.yml \
            --name "Build Hummingbird desktops (distributed)" \
            --mock-config hummingbird-ci \
            --r2-path "hummingbird/20251124-x86_64" \
            --secondary-r2-path "" \
            --no-submodules \
            --r2-state

      - name: Summarize adds and drops
        if: steps.drift.outputs.drifted == 'true'
        run: |
          set -euo pipefail
          {
            echo "Automated re-measurement: upstream public-hummingbird published a"
            echo "new revision, so the desktop build order was regenerated against it."
            echo
            dropped="$(git diff -U0 build-order-hummingbird-desktops.yml | grep '^-' | grep -o 'path: src/.*' | sed 's|path: ||' | sort -u || true)"
            added="$(git diff -U0 build-order-hummingbird-desktops.yml | grep '^+' | grep -o 'path: src/.*' | sed 's|path: ||' | sort -u || true)"
            really_dropped="$(comm -23 <(echo "$dropped") <(echo "$added") | sed '/^$/d' || true)"
            really_added="$(comm -13 <(echo "$dropped") <(echo "$added") | sed '/^$/d' || true)"
            if [ -n "$really_dropped" ]; then
              echo "Dropped from the build set (upstream now ships these):"
              echo '```'
              echo "$really_dropped"
              echo '```'
            fi
            if [ -n "$really_added" ]; then
              echo "Added to the build set (upstream stopped shipping, or new closure members):"
              echo '```'
              echo "$really_added"
              echo '```'
            fi
            if [ -z "$really_dropped" ] && [ -z "$really_added" ]; then
              echo "No package set changes — only measurement provenance moved."
            fi
          } > /tmp/pr-body.md
          cat /tmp/pr-body.md

      - uses: peter-evans/create-pull-request@v8
        if: steps.drift.outputs.drifted == 'true'
        with:
          branch: automation/hummingbird-gap-remeasure
          delete-branch: true
          title: 'chore(hummingbird): re-measure desktop gap against live upstream'
          commit-message: 'chore(hummingbird): re-measure desktop gap against live upstream'
          body-path: /tmp/pr-body.md
          labels: package-factory
