  deb:
    name: ${{ matrix.package }} (${{ matrix.target }} DEB)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Library/tool wave (#139 follow-up): all five are green on el10
          # with the byte-identical contract. Their deb outputs render distro
          # package names (libcli11-dev, libunwind-dev, libseat-dev), matched
          # by verify.targets overrides in each recipe.
          - package: cli11-devel
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            install_name: libcli11-dev
            smoke: test -f /usr/include/CLI/CLI.hpp
            clean_install: true
          - package: cli11-devel
            target: debian
            image: docker.io/library/debian:sid
            install_name: libcli11-dev
            smoke: test -f /usr/include/CLI/CLI.hpp
            clean_install: true
          - package: libunwind-devel
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            install_name: libunwind-dev
            smoke: test -f /usr/include/libunwind.h && test -f /usr/include/unwind.h
            clean_install: true
          - package: libunwind-devel
            target: debian
            image: docker.io/library/debian:sid
            install_name: libunwind-dev
            smoke: test -f /usr/include/libunwind.h && test -f /usr/include/unwind.h
            clean_install: true
          - package: ninja-build
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            install_name: ninja-build
            smoke: ninja --version
            clean_install: true
          - package: ninja-build
            target: debian
            image: docker.io/library/debian:sid
            install_name: ninja-build
            smoke: ninja --version
            clean_install: true
          - package: wayland-protocols
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            install_name: wayland-protocols
            smoke: pkg-config --atleast-version=1.41 wayland-protocols && test -f /usr/share/wayland-protocols/staging/ext-session-lock/ext-session-lock-v1.xml
            clean_install: true
          - package: wayland-protocols
            target: debian
            image: docker.io/library/debian:sid
            install_name: wayland-protocols
            smoke: pkg-config --atleast-version=1.41 wayland-protocols && test -f /usr/share/wayland-protocols/staging/ext-session-lock/ext-session-lock-v1.xml
            clean_install: true
          - package: libseat
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            install_name: libseat-dev
            smoke: pkg-config --modversion libseat && seatd -h
            clean_install: true
          - package: libseat
            target: debian
            image: docker.io/library/debian:sid
            install_name: libseat-dev
            smoke: pkg-config --modversion libseat && seatd -h
            clean_install: true
          - package: uupd
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            install_name: uupd
            smoke: uupd --help
            clean_install: true
          - package: xfconf
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            install_name: libxfconf-0-4
            smoke: xfconf-query --version
            clean_install: true
          - package: greetd
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            install_name: greetd
            smoke: greetd --help
            clean_install: true
          - package: dms
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            clean_install: false
          - package: dms-cli
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            clean_install: false
          - package: dms-greeter
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            clean_install: false
          - package: dgop
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            install_name: dgop
            smoke: dgop --help
            clean_install: true
          - package: danksearch
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            install_name: danksearch
            smoke: dsearch --help
            clean_install: true
          - package: kairpods
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            install_name: kairpods
            smoke: test -x /usr/bin/kairpodsd && test -f /usr/lib/systemd/user/kairpodsd.service
            clean_install: true
          - package: oversteer-udev
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            install_name: oversteer-udev
            # Upstream names its rules by wheel vendor — 99-fanatec-wheel-perms.rules,
            # 99-logitech-wheel-perms.rules, 99-thrustmaster-wheel-perms.rules. Nothing
            # upstream contains the string 'oversteer', so the old
            # `-name \*oversteer\*` could never match: the package built and installed
            # correctly and the assertion failed anyway. Assert the real filenames.
            smoke: test -f /usr/lib/udev/rules.d/99-logitech-wheel-perms.rules && test -f /usr/lib/udev/rules.d/99-fanatec-wheel-perms.rules && test -f /usr/lib/udev/rules.d/99-thrustmaster-wheel-perms.rules
            clean_install: true
          - package: uupd
            target: debian
            image: docker.io/library/debian:sid
            install_name: uupd
            smoke: uupd --help
            clean_install: true
          - package: xfconf
            target: debian
            image: docker.io/library/debian:sid
            install_name: libxfconf-0-4
            smoke: xfconf-query --version
            clean_install: true
          - package: greetd
            target: debian
            image: docker.io/library/debian:sid
            install_name: greetd
            smoke: greetd --help
            clean_install: true
          - package: dms
            target: debian
            image: docker.io/library/debian:sid
            clean_install: false
          - package: dms-cli
            target: debian
            image: docker.io/library/debian:sid
            clean_install: false
          - package: dms-greeter
            target: debian
            image: docker.io/library/debian:sid
            clean_install: false
          - package: dgop
            target: debian
            image: docker.io/library/debian:sid
            install_name: dgop
            smoke: dgop --help
            clean_install: true
          - package: danksearch
            target: debian
            image: docker.io/library/debian:sid
            install_name: danksearch
            smoke: dsearch --help
            clean_install: true
          - package: kairpods
            target: debian
            image: docker.io/library/debian:sid
            install_name: kairpods
            smoke: test -x /usr/bin/kairpodsd && test -f /usr/lib/systemd/user/kairpodsd.service
            clean_install: true
          - package: oversteer-udev
            target: debian
            image: docker.io/library/debian:sid
            install_name: oversteer-udev
            # Upstream names its rules by wheel vendor — 99-fanatec-wheel-perms.rules,
            # 99-logitech-wheel-perms.rules, 99-thrustmaster-wheel-perms.rules. Nothing
            # upstream contains the string 'oversteer', so the old
            # `-name \*oversteer\*` could never match: the package built and installed
            # correctly and the assertion failed anyway. Assert the real filenames.
            smoke: test -f /usr/lib/udev/rules.d/99-logitech-wheel-perms.rules && test -f /usr/lib/udev/rules.d/99-fanatec-wheel-perms.rules && test -f /usr/lib/udev/rules.d/99-thrustmaster-wheel-perms.rules
            clean_install: true
          # Same contract the niri-rpm job asserts by hand: compositor,
          # session launcher, wayland-session entry, portal config, and both
          # user units (#161). libseat needs no prerequisite artifact here --
          # libseat-dev/libseat1 are in the Ubuntu and Debian archives.
          - package: niri
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            install_name: niri
            smoke: niri --help && test -x /usr/bin/niri-session && test -f /usr/share/wayland-sessions/niri.desktop && test -f /usr/share/xdg-desktop-portal/niri-portals.conf && test -f /usr/lib/systemd/user/niri.service && test -f /usr/lib/systemd/user/niri-shutdown.target
            clean_install: true
          - package: niri
            target: debian
            image: docker.io/library/debian:sid
            install_name: niri
            smoke: niri --help && test -x /usr/bin/niri-session && test -f /usr/share/wayland-sessions/niri.desktop && test -f /usr/share/xdg-desktop-portal/niri-portals.conf && test -f /usr/lib/systemd/user/niri.service && test -f /usr/lib/systemd/user/niri-shutdown.target
            clean_install: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install pyyaml
      - name: Restore the content-addressed source cache
        uses: ./.github/actions/tideforge-source-cache
        with:
          recipe: packages/${{ matrix.package }}/package.yaml
      - name: Render and assemble a Debian source tree
        run: |
          set -euo pipefail
          recipe="packages/${{ matrix.package }}/package.yaml"
          root="$PWD/.tideforge/deb/${{ matrix.target }}-${{ matrix.package }}"
          python3 scripts/tideforge.py validate "$recipe"
          python3 scripts/verify-tideforge-source.py "$recipe" --cache-dir "$HOME/.cache/tideforge/sources"
          python3 scripts/tideforge.py render "$recipe" --target "${{ matrix.target }}" --output "$root/rendered"
          python3 - "$recipe" "$root" <<'PY'
          import sys
          import tarfile
          import hashlib
          import shutil
          from pathlib import Path
          from urllib.request import urlretrieve
          import yaml
          sys.path.insert(0, "scripts")
          import tideforge_cache
          cache_dir = Path.home() / ".cache" / "tideforge" / "sources"
          def materialise(source, destination, label):
              payload = tideforge_cache.lookup(cache_dir, source["sha256"])
              if payload is not None:
                  destination.write_bytes(payload)
                  print(f"source cache hit: {label}")
                  return
              urlretrieve(source["url"], destination)
              if hashlib.file_digest(destination.open("rb"), "sha256").hexdigest() != source["sha256"]:
                  raise SystemExit(f"checksum mismatch for {label}")
              tideforge_cache.store(cache_dir, destination.read_bytes())
              print(f"source cache miss, downloaded: {label}")
          recipe = yaml.safe_load(Path(sys.argv[1]).read_text())
          root = Path(sys.argv[2])
          archive = root / "source.tar.gz"
          materialise(recipe["source"], archive, "primary source")
          with tarfile.open(archive) as tar:
              tar.extractall(root / "source")
          source = root / "source" / recipe["source"].get("directory", f"{recipe['name']}-{recipe['version']}")
          if not source.is_dir():
              raise SystemExit(f"declared source directory does not exist: {source}")
          # Reconstruct checksum-locked source closures (for example upstream
          # submodules) in the same paths used by the RPM/Pacman renderers.
          for index, extra in enumerate(recipe.get("sources", []), start=1):
              extra_archive = root / f"source-{index}.tar"
              materialise(extra, extra_archive, f"auxiliary source {index}")
              destination = source / extra["destination"]
              if not extra.get("extract", True):
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(extra_archive, destination)
                  continue
              destination.mkdir(parents=True, exist_ok=True)
              strip = extra.get("strip_components", 1)
              with tarfile.open(extra_archive) as tar:
                  members = []
                  for member in tar.getmembers():
                      parts = Path(member.name).parts[strip:]
                      if not parts or ".." in parts or Path(*parts).is_absolute():
                          continue
                      member.name = str(Path(*parts))
                      members.append(member)
                  tar.extractall(destination, members=members, filter="data")
          (root / "source-dir").write_text("/work/" + source.relative_to(root).as_posix() + "\n")
          (source / "debian").mkdir(parents=True, exist_ok=True)
          for path in (root / "rendered" / "debian").rglob("*"):
              if path.is_file():
                  target = source / "debian" / path.relative_to(root / "rendered" / "debian")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(path.read_bytes())
                  if path.name == "rules":
                      target.chmod(0o755)
          PY
      - name: Pull the build image, retrying transient registry failures
        run: scripts/pull-container-image.sh "${{ matrix.image }}"
      - name: Build generated DEB with only declared Build-Depends
        run: |
          set -euo pipefail
          root="$PWD/.tideforge/deb/${{ matrix.target }}-${{ matrix.package }}"
          docker run --rm --volume "$root:/work" "${{ matrix.image }}" bash -lc '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends build-essential ca-certificates devscripts equivs
            cd "$(cat /work/source-dir)"
            mk-build-deps --install --remove --tool "apt-get -y --no-install-recommends" debian/control
            dpkg-buildpackage -us -uc -b
            mkdir -p /work/artifacts
            cp ../*.deb /work/artifacts/
          '
      - name: Lint the generated DEB
        run: |
          set -euo pipefail
          root="$PWD/.tideforge/deb/${{ matrix.target }}-${{ matrix.package }}"
          docker run --rm --volume "$root:/work:ro" --volume "$PWD/scripts:/scripts:ro" "${{ matrix.image }}" \
            bash /scripts/lint-generated-deb.sh /work/artifacts
      - name: Clean-install DEB from an ephemeral repository
        if: matrix.clean_install
        run: |
          set -euo pipefail
          root="$PWD/.tideforge/deb/${{ matrix.target }}-${{ matrix.package }}"
          docker run --rm --volume "$root:/work:ro" "${{ matrix.image }}" bash -lc '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            # pkg-config is part of the smoke environment, not the package
            # under test: the libseat and wayland-protocols contracts query it,
            # and unlike RPM (whose pkgconfig() generator pulls pkgconf in),
            # dpkg gives -dev packages no such automatic dependency.
            apt-get install -y --no-install-recommends dpkg-dev pkg-config
            mkdir -p /var/lib/tideforge
            cp /work/artifacts/*.deb /var/lib/tideforge/
            cd /var/lib/tideforge
            dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz
            printf "deb [trusted=yes] file:/var/lib/tideforge ./\\n" > /etc/apt/sources.list.d/tideforge.list
            # Pin the ephemeral repo above the distro archive -- the apt spelling
            # of the priority overrides the el10 and Tumbleweed jobs already
            # carry. apt otherwise installs the highest version it can see, and
            # Ubuntu resolute ships libunwind-dev 1.8.3-0ubuntu1 against our
            # 1.8.1-1, so the smoke test exercised the archive package (whose
            # -dev split omits /usr/include/unwind.h) and failed on a contract
            # the deb built in this job does satisfy. Empty origin is how apt
            # names a local file: repository; 1001 also permits a downgrade, so
            # a package preinstalled in the image is replaced rather than kept.
            printf "Package: *\\nPin: origin \"\"\\nPin-Priority: 1001\\n" > /etc/apt/preferences.d/tideforge.pref
            apt-get update -qq
            apt-get install -y ${{ matrix.install_name }}
            dpkg-query -W ${{ matrix.install_name }}
            # Shadowing is silent otherwise: an archive package that happens to
            # satisfy the contract would report this cell green without the
            # generated deb ever being installed.
            set -- /var/lib/tideforge/${{ matrix.install_name }}_*.deb
            expected=$(dpkg-deb -f "$1" Version)
            installed=$(dpkg-query -W ${{ matrix.install_name }} | cut -f2)
            if [ "$installed" != "$expected" ]; then
              echo "installed $installed did not come from the ephemeral repo (expected $expected)" >&2
              exit 1
            fi
            ${{ matrix.smoke }}
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.package }}-${{ matrix.target }}-deb
          path: .tideforge/deb/${{ matrix.target }}-${{ matrix.package }}/artifacts/
          if-no-files-found: warn
