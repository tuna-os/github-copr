name: Build Tideforge supported targets

on:
  pull_request:
    paths:
      - packages/uupd/package.yaml
      - packages/xfconf/package.yaml
      - packages/greetd/package.yaml
      - packages/cli11-devel/package.yaml
      - packages/libunwind-devel/package.yaml
      - packages/cpptrace-devel/package.yaml
      - packages/ninja-build/package.yaml
      - packages/wayland-protocols/package.yaml
      - packages/libseat/package.yaml
      - packages/niri/package.yaml
      - packages/iio-niri/package.yaml
      - packages/dms/package.yaml
      - packages/dms-cli/package.yaml
      - packages/dms-greeter/package.yaml
      - packages/quickshell/package.yaml
      - packages/dgop/package.yaml
      - packages/danksearch/package.yaml
      - packages/kairpods/package.yaml
      - packages/oversteer-udev/package.yaml
      - packages/gtkgreet/package.yaml
      - packages/gtk-layer-shell/package.yaml
      - packages/cosmic-bg/package.yaml
      - packages/cosmic-comp/package.yaml
      - packages/cosmic-icon-theme/package.yaml
      - packages/cosmic-idle/package.yaml
      - packages/cosmic-notifications/package.yaml
      - packages/cosmic-osd/package.yaml
      - packages/cosmic-panel/package.yaml
      - packages/cosmic-randr/package.yaml
      - packages/cosmic-settings-daemon/package.yaml
      - packages/cosmic-session/package.yaml
      - packages/cosmic-settings/package.yaml
      - packages/pop-icon-theme/package.yaml
      - packages/labwc/package.yaml
      - packages/evtest/package.yaml
      - packages/python3-evdev/package.yaml
      - packages/input-remapper/package.yaml
      - packages/xfwm4-themes/package.yaml
      - manifests/package-factory.yaml
      - scripts/tideforge.py
      - scripts/verify-tideforge-source.py
      - scripts/fetch-tideforge-sources.py
      - scripts/pull-container-image.sh
      - scripts/lint-generated-rpm.sh
      - scripts/lint-generated-deb.sh
      - scripts/assert-xfconf-split.sh
      - .github/workflows/build-tideforge-supported.yml
  workflow_dispatch:

# Three runs of this workflow were queued simultaneously on one branch because
# nothing superseded the earlier ones — each pushed commit started a fresh
# ~50-job matrix while the previous two still held runner slots. Only the
# newest can gate anything; the older ones burn capacity that the rest of the
# org is queuing for. See #130 for the same class of waste.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rpm-payload:
    name: ${{ matrix.package }} (el10 RPM payload)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # COSMIC is deliberately payload-only for now: a full staged install
        # requires the remaining runtime closure, which is not all
        # factory-built yet. This still makes every source/vendor/toolchain
        # regression block updates before any of these recipes can be promoted.
        package: [dms, dms-cli, dms-greeter, pop-icon-theme, cosmic-icon-theme, cosmic-bg, cosmic-comp, cosmic-idle, cosmic-notifications, cosmic-osd, cosmic-panel, cosmic-randr, cosmic-settings-daemon, cosmic-session, cosmic-settings]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install pyyaml
      - name: Restore the content-addressed source cache
        uses: ./.github/actions/tideforge-source-cache
        with:
          recipe: packages/${{ matrix.package }}/package.yaml
      - name: Render and fetch the exact source archive
        run: |
          set -euo pipefail
          recipe="packages/${{ matrix.package }}/package.yaml"
          root="$PWD/.tideforge/rpm-payload/${{ matrix.package }}"
          python3 scripts/tideforge.py validate "$recipe"
          python3 scripts/verify-tideforge-source.py "$recipe" --cache-dir "$HOME/.cache/tideforge/sources"
          python3 scripts/tideforge.py render "$recipe" --target el10 --output "$root/rpmbuild/SPECS"
          mkdir -p "$root/rpmbuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SRPMS}
          python3 scripts/fetch-tideforge-sources.py "$recipe" "$root/rpmbuild/SOURCES" --cache-dir "$HOME/.cache/tideforge/sources"
      - name: Pull the build image, retrying transient registry failures
        run: scripts/pull-container-image.sh quay.io/centos/centos:stream10
      - name: Build generated RPM payload
        run: |
          set -euo pipefail
          root="$PWD/.tideforge/rpm-payload/${{ matrix.package }}"
          docker run --rm --volume "$root:/work" quay.io/centos/centos:stream10 bash -lc '
            set -euo pipefail
            # NOTE: no apostrophes in this comment. It lives inside a single-
            # quoted bash -lc block, and an apostrophe closes that string early
            # and mangles the script (see 7af9ae1, where exactly that silently
            # disabled every build).
            #
            # epel-release, not crb alone. The COSMIC stack build-requires just
            # and libdav1d-devel, and neither is in CentOS Stream 10 base or in
            # CRB. Both live in EPEL 10, verified with dnf repoquery. Without it
            # every cosmic-* payload died at "No matching package to install"
            # and then "Error: Some packages could not be found" -- 13 of this
            # workflow 18 failures, all identical. The gtkgreet and quickshell
            # jobs below already install epel-release.
            dnf -y install dnf-plugins-core epel-release rpm-build rpmdevtools
            dnf config-manager --set-enabled crb
            dnf -y builddep /work/rpmbuild/SPECS/*.spec
            rpmbuild -ba --define "_topdir /work/rpmbuild" /work/rpmbuild/SPECS/*.spec
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.package }}-el10-rpm-payload
          path: .tideforge/rpm-payload/${{ matrix.package }}/rpmbuild/RPMS/
          if-no-files-found: warn

  rpm:
    name: ${{ matrix.package }} (${{ matrix.target }} RPM)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: uupd
            target: el10
            install_name: uupd
            smoke: uupd --help
          - package: xfconf
            target: el10
            install_name: xfconf
            smoke: xfconf-query --version
          - package: greetd
            target: el10
            install_name: greetd
            smoke: greetd --help
          - package: cli11-devel
            target: el10
            install_name: cli11-devel
            smoke: test -f /usr/include/CLI/CLI.hpp
          - package: libunwind-devel
            target: el10
            install_name: libunwind-devel
            smoke: test -f /usr/include/libunwind.h && test -f /usr/include/unwind.h
          - package: ninja-build
            target: el10
            install_name: ninja-build
            smoke: ninja --version
          - package: wayland-protocols
            target: el10
            install_name: wayland-protocols
            smoke: pkg-config --atleast-version=1.41 wayland-protocols && test -f /usr/share/wayland-protocols/staging/ext-session-lock/ext-session-lock-v1.xml
          - package: libseat
            target: el10
            install_name: libseat-devel
            smoke: pkg-config --modversion libseat && seatd -h
          - package: dgop
            target: el10
            install_name: dgop
            smoke: dgop --help
          - package: danksearch
            target: el10
            install_name: danksearch
            smoke: dsearch --help
          - package: kairpods
            target: el10
            install_name: kairpods
            smoke: test -x /usr/bin/kairpodsd && test -f /usr/lib/systemd/user/kairpodsd.service
          - package: oversteer-udev
            target: el10
            install_name: oversteer-udev
            # Upstream names its rules by wheel vendor — 99-fanatec-wheel-perms.rules,
            # 99-logitech-wheel-perms.rules, 99-thrustmaster-wheel-perms.rules. Nothing
            # upstream contains the string 'oversteer', so the old
            # `-name \*oversteer\*` could never match: the package built and installed
            # correctly and the assertion failed anyway. Assert the real filenames.
            smoke: test -f /usr/lib/udev/rules.d/99-logitech-wheel-perms.rules && test -f /usr/lib/udev/rules.d/99-fanatec-wheel-perms.rules && test -f /usr/lib/udev/rules.d/99-thrustmaster-wheel-perms.rules
          - package: gtk-layer-shell
            target: el10
            install_name: gtk-layer-shell-devel
            smoke: pkg-config --modversion gtk-layer-shell-0 && test -f /usr/include/gtk-layer-shell/gtk-layer-shell.h
          - package: labwc
            target: el10
            install_name: labwc
            smoke: labwc --help
          - package: evtest
            target: el10
            install_name: evtest
            smoke: test -x /usr/bin/evtest && test -f /usr/share/man/man1/evtest.1.gz
          - package: python3-evdev
            target: el10
            install_name: python3-evdev
            smoke: python3 -c "import evdev"
          - package: xfwm4-themes
            target: el10
            install_name: xfwm4-themes
            smoke: test -f /usr/share/themes/Default/xfwm4/themerc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install pyyaml
      - name: Restore the content-addressed source cache
        uses: ./.github/actions/tideforge-source-cache
        with:
          recipe: packages/${{ matrix.package }}/package.yaml
      - name: Render and fetch the exact source archive
        run: |
          set -euo pipefail
          recipe="packages/${{ matrix.package }}/package.yaml"
          root="$PWD/.tideforge/rpm/${{ matrix.package }}"
          python3 scripts/tideforge.py validate "$recipe"
          python3 scripts/verify-tideforge-source.py "$recipe" --cache-dir "$HOME/.cache/tideforge/sources"
          python3 scripts/tideforge.py render "$recipe" --target "${{ matrix.target }}" --output "$root/rpmbuild/SPECS"
          mkdir -p "$root/rpmbuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SRPMS}
          python3 scripts/fetch-tideforge-sources.py "$recipe" "$root/rpmbuild/SOURCES" --cache-dir "$HOME/.cache/tideforge/sources"
      - name: Pull the build image, retrying transient registry failures
        run: scripts/pull-container-image.sh quay.io/centos/centos:stream10
      - name: Build generated RPM with only declared BuildRequires
        run: |
          set -euo pipefail
          root="$PWD/.tideforge/rpm/${{ matrix.package }}"
          docker run --rm --volume "$root:/work" quay.io/centos/centos:stream10 bash -lc '
            set -euo pipefail
            # epel-release, not crb alone. xfconf build-requires libxfce4util-devel
            # and installs libxfce4util at runtime; neither is in CentOS Stream 10
            # base or in CRB. Both live in EPEL 10, verified with dnf repoquery.
            # Without it the build died at "No matching package to install:
            # libxfce4util-devel". The gtkgreet and quickshell jobs already do this.
            dnf -y install dnf-plugins-core epel-release rpm-build
            dnf config-manager --set-enabled crb
            dnf -y builddep /work/rpmbuild/SPECS/*.spec
            rpmbuild -ba --define "_topdir /work/rpmbuild" /work/rpmbuild/SPECS/*.spec
          '
      - name: Lint the generated RPM
        run: |
          set -euo pipefail
          root="$PWD/.tideforge/rpm/${{ matrix.package }}"
          docker run --rm --volume "$root:/work:ro" --volume "$PWD/scripts:/scripts:ro" quay.io/centos/centos:stream10 \
            bash /scripts/lint-generated-rpm.sh /work/rpmbuild/RPMS
      - name: Clean-install RPM from an ephemeral repository
        run: |
          set -euo pipefail
          root="$PWD/.tideforge/rpm/${{ matrix.package }}"
          docker run --rm --volume "$root:/work:ro" quay.io/centos/centos:stream10 bash -lc '
            set -euo pipefail
            # EPEL for the same reason as the build step: xfconf pulls in
            # libxfce4util at install time, and it only lives in EPEL 10.
            dnf -y install epel-release createrepo_c
            cp -a /work/rpmbuild/RPMS /tmp/tideforge-rpms
            createrepo_c /tmp/tideforge-rpms
            # Pin the ephemeral repo above every distro repo so the smoke test
            # exercises the RPM we just built, not a same-named shadow. EPEL 10
            # ships its own libseat (release el10_3, higher than our el10) and
            # splits the seatd daemon into a separate seatd package, so without a
            # priority override dnf would silently install EPEL libseat-devel and
            # its library-only libseat, leaving no seatd binary -- the smoke
            # `seatd -h` then exited 127.
            dnf -y install --nogpgcheck --repofrompath tideforge,file:///tmp/tideforge-rpms --setopt=tideforge.priority=1 --enablerepo=tideforge ${{ matrix.install_name }}
            rpm -q ${{ matrix.install_name }}
            ${{ matrix.smoke }}
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.package }}-${{ matrix.target }}-rpm
          path: .tideforge/rpm/${{ matrix.package }}/rpmbuild/RPMS/
          if-no-files-found: warn

  # openSUSE Tumbleweed is declared in manifests/package-factory.yaml with its
  # own architectures and r2_path, and 19 recipes opt into it — yet it had zero
  # cells in this gate, so no openSUSE package had ever been built or installed
  # by this pipeline. See #139. "Never tested" and "passing" looked identical.
  #
  # This job starts deliberately small. It is scoped to two packages rather than
  # all 19 so that the first openSUSE result has one readable cause instead of
  # nineteen unrelated ones. dgop is a go build and cli11-devel is a header-only
  # cmake build; neither exercises the cargo path, whose fat-LTO and debuginfo
  # handling is tuned for el10 and Arch and has never run under zypper.
  #
  # The renderer needs no change: render() dispatches on the target format, and
  # opensuse-tumbleweed is format: rpm, so it already reaches render_rpm.
  opensuse-rpm:
    name: ${{ matrix.package }} (opensuse-tumbleweed RPM)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: dgop
            install_name: dgop
            smoke: dgop --help
          - package: cli11-devel
            install_name: cli11-devel
            smoke: test -f /usr/include/CLI/CLI.hpp
          # Second wave (#139 follow-up): every recipe here is already green on
          # el10 with the same contract, and eight of the nine are also green on
          # ubuntu and debian. greetd and kairpods are the first cargo builds
          # under zypper; if the cargo path breaks they fail with one shared,
          # readable cause.
          - package: uupd
            install_name: uupd
            smoke: uupd --help
          - package: greetd
            install_name: greetd
            smoke: greetd --help
          - package: danksearch
            install_name: danksearch
            smoke: dsearch --help
          - package: kairpods
            install_name: kairpods
            smoke: test -x /usr/bin/kairpodsd && test -f /usr/lib/systemd/user/kairpodsd.service
          - package: oversteer-udev
            install_name: oversteer-udev
            smoke: test -f /usr/lib/udev/rules.d/99-logitech-wheel-perms.rules && test -f /usr/lib/udev/rules.d/99-fanatec-wheel-perms.rules && test -f /usr/lib/udev/rules.d/99-thrustmaster-wheel-perms.rules
          - package: libseat
            install_name: libseat-devel
            smoke: pkg-config --modversion libseat && seatd -h
          - package: ninja-build
            install_name: ninja-build
            smoke: ninja --version
          - package: wayland-protocols
            install_name: wayland-protocols
            smoke: pkg-config --atleast-version=1.41 wayland-protocols && test -f /usr/share/wayland-protocols/staging/ext-session-lock/ext-session-lock-v1.xml
          - package: libunwind-devel
            install_name: libunwind-devel
            smoke: test -f /usr/include/libunwind.h && test -f /usr/include/unwind.h
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install pyyaml
      - name: Restore the content-addressed source cache
        uses: ./.github/actions/tideforge-source-cache
        with:
          recipe: packages/${{ matrix.package }}/package.yaml
      - name: Render and fetch the exact source archive
        run: |
          set -euo pipefail
          recipe="packages/${{ matrix.package }}/package.yaml"
          root="$PWD/.tideforge/rpm/${{ matrix.package }}"
          python3 scripts/tideforge.py validate "$recipe"
          python3 scripts/verify-tideforge-source.py "$recipe" --cache-dir "$HOME/.cache/tideforge/sources"
          python3 scripts/tideforge.py render "$recipe" --target opensuse-tumbleweed --output "$root/rpmbuild/SPECS"
          mkdir -p "$root/rpmbuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SRPMS}
          python3 scripts/fetch-tideforge-sources.py "$recipe" "$root/rpmbuild/SOURCES" --cache-dir "$HOME/.cache/tideforge/sources"
      - name: Pull the build image, retrying transient registry failures
        run: scripts/pull-container-image.sh registry.opensuse.org/opensuse/tumbleweed:latest
      - name: Build generated RPM with only declared BuildRequires
        run: |
          set -euo pipefail
          root="$PWD/.tideforge/rpm/${{ matrix.package }}"
          docker run --rm --volume "$root:/work" registry.opensuse.org/opensuse/tumbleweed:latest bash -lc '
            set -euo pipefail
            zypper --non-interactive --gpg-auto-import-keys refresh
            zypper --non-interactive install rpm-build
            # zypper has no builddep verb. rpmspec -q --buildrequires prints the
            # BuildRequires the generated spec declares, which is exactly the set
            # dnf builddep would have resolved on el10. Verified in a real
            # tumbleweed container; see #139.
            mapfile -t build_requires < <(rpmspec -q --buildrequires /work/rpmbuild/SPECS/*.spec)
            # A recipe may legitimately declare no BuildRequires, and zypper
            # install with no arguments is an error rather than a no-op.
            if [ "${#build_requires[@]}" -gt 0 ]; then
              zypper --non-interactive install "${build_requires[@]}"
            fi
            rpmbuild -ba --define "_topdir /work/rpmbuild" /work/rpmbuild/SPECS/*.spec
          '
      - name: Lint the generated RPM
        run: |
          set -euo pipefail
          root="$PWD/.tideforge/rpm/${{ matrix.package }}"
          docker run --rm --volume "$root:/work:ro" --volume "$PWD/scripts:/scripts:ro" registry.opensuse.org/opensuse/tumbleweed:latest \
            bash /scripts/lint-generated-rpm.sh /work/rpmbuild/RPMS
      - name: Clean-install RPM from an ephemeral repository
        run: |
          set -euo pipefail
          root="$PWD/.tideforge/rpm/${{ matrix.package }}"
          docker run --rm --volume "$root:/work:ro" registry.opensuse.org/opensuse/tumbleweed:latest bash -lc '
            set -euo pipefail
            zypper --non-interactive --gpg-auto-import-keys refresh
            zypper --non-interactive install createrepo_c
            cp -a /work/rpmbuild/RPMS /tmp/tideforge-rpms
            createrepo_c /tmp/tideforge-rpms
            # Priority 1 pins the ephemeral repo above the distro repositories so
            # the smoke test exercises the RPM built in this job, not a same-named
            # package from Tumbleweed. The el10 job needs the same override for
            # libseat; the reasoning is identical here.
            zypper --non-interactive addrepo --no-gpgcheck --priority 1 file:///tmp/tideforge-rpms tideforge
            zypper --non-interactive --gpg-auto-import-keys refresh tideforge
            # --no-gpg-checks is a global zypper option, not an install option, so
            # it has to precede the verb; after it, zypper exits 2 with "The flag
            # --no-gpg-checks is not known".
            zypper --non-interactive --no-gpg-checks install ${{ matrix.install_name }}
            rpm -q ${{ matrix.install_name }}
            ${{ matrix.smoke }}
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.package }}-opensuse-tumbleweed-rpm
          path: .tideforge/rpm/${{ matrix.package }}/rpmbuild/RPMS/
          if-no-files-found: warn

  xfconf-split:
    name: xfconf (split-package contract)
    needs: [rpm, deb]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: el10
            image: quay.io/centos/centos:stream10
          - target: ubuntu
            image: docker.io/library/ubuntu:26.04
          - target: debian
            image: docker.io/library/debian:sid
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: xfconf-${{ matrix.target }}-${{ matrix.target == 'el10' && 'rpm' || 'deb' }}
          path: .tideforge/xfconf-split/artifacts
      - name: Pull the build image, retrying transient registry failures
        run: scripts/pull-container-image.sh "${{ matrix.image }}"
      - name: Assert the split package actually splits
        run: |
          set -euo pipefail
          root="$PWD/.tideforge/xfconf-split"
          docker run --rm --volume "$root:/work:ro" --volume "$PWD/scripts:/scripts:ro" "${{ matrix.image }}" \
            bash /scripts/assert-xfconf-split.sh "${{ matrix.target }}" /work/artifacts

  gtkgreet-rpm:
    name: gtkgreet (el10 staged closure RPM)
    needs: rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install pyyaml
      - name: Restore the content-addressed source cache
        uses: ./.github/actions/tideforge-source-cache
        with:
          recipe: packages/gtkgreet/package.yaml
      - uses: actions/download-artifact@v8
        with:
          name: gtk-layer-shell-el10-rpm
          path: .tideforge/gtkgreet/prerequisites/gtk-layer-shell
      - uses: actions/download-artifact@v8
        with:
          name: greetd-el10-rpm
          path: .tideforge/gtkgreet/prerequisites/greetd
      - name: Render and fetch the exact gtkgreet source archive
        run: |
          set -euo pipefail
          recipe=packages/gtkgreet/package.yaml
          root="$PWD/.tideforge/gtkgreet"
          python3 scripts/tideforge.py validate "$recipe"
          python3 scripts/verify-tideforge-source.py "$recipe" --cache-dir "$HOME/.cache/tideforge/sources"
          python3 scripts/tideforge.py render "$recipe" --target el10 --output "$root/rpmbuild/SPECS"
          mkdir -p "$root/rpmbuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SRPMS}
          python3 scripts/fetch-tideforge-sources.py "$recipe" "$root/rpmbuild/SOURCES" --cache-dir "$HOME/.cache/tideforge/sources"
      - name: Pull the build image, retrying transient registry failures
        run: scripts/pull-container-image.sh quay.io/centos/centos:stream10
      - name: Build gtkgreet against staged Tideforge dependencies
        run: |
          set -euo pipefail
          root="$PWD/.tideforge/gtkgreet"
          docker run --rm --volume "$root:/work" quay.io/centos/centos:stream10 bash -lc '
            set -euo pipefail
            dnf -y install dnf-plugins-core epel-release rpm-build createrepo_c
            dnf config-manager --set-enabled crb
            mkdir -p /tmp/tideforge-prerequisites
            cp -a /work/prerequisites/gtk-layer-shell/. /tmp/tideforge-prerequisites/
            createrepo_c /tmp/tideforge-prerequisites
            dnf -y install --nogpgcheck --repofrompath tideforge,file:///tmp/tideforge-prerequisites --enablerepo=tideforge gtk-layer-shell-devel
            dnf -y builddep /work/rpmbuild/SPECS/*.spec
            rpmbuild -ba --define "_topdir /work/rpmbuild" /work/rpmbuild/SPECS/*.spec
          '
      - name: Clean-install gtkgreet from the staged closure repository
        run: |
          set -euo pipefail
          root="$PWD/.tideforge/gtkgreet"
          docker run --rm --volume "$root:/work:ro" quay.io/centos/centos:stream10 bash -lc '
            set -euo pipefail
            dnf -y install epel-release createrepo_c
            mkdir -p /tmp/tideforge-rpms
            cp -a /work/prerequisites/gtk-layer-shell/. /tmp/tideforge-rpms/
            cp -a /work/prerequisites/greetd/. /tmp/tideforge-rpms/
            cp -a /work/rpmbuild/RPMS/. /tmp/tideforge-rpms/
            createrepo_c /tmp/tideforge-rpms
            dnf -y install --nogpgcheck --repofrompath tideforge,file:///tmp/tideforge-rpms --enablerepo=tideforge gtkgreet
            rpm -q gtkgreet greetd gtk-layer-shell cage
            gtkgreet --help
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gtkgreet-el10-staged-closure-rpm
          path: .tideforge/gtkgreet/rpmbuild/RPMS/
          if-no-files-found: warn

  cpptrace-rpm:
    name: cpptrace-devel (el10 RPM)
    needs: rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install pyyaml
      - name: Restore the content-addressed source cache
        uses: ./.github/actions/tideforge-source-cache
        with:
          recipe: packages/cpptrace-devel/package.yaml
      - uses: actions/download-artifact@v8
        with:
          name: libunwind-devel-el10-rpm
          path: .tideforge/cpptrace/prerequisite
      - name: Render and fetch the exact cpptrace source archive
        run: |
          set -euo pipefail
          recipe=packages/cpptrace-devel/package.yaml
          root="$PWD/.tideforge/cpptrace"
          python3 scripts/tideforge.py validate "$recipe"
          python3 scripts/verify-tideforge-source.py "$recipe" --cache-dir "$HOME/.cache/tideforge/sources"
          python3 scripts/tideforge.py render "$recipe" --target el10 --output "$root/rpmbuild/SPECS"
          mkdir -p "$root/rpmbuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SRPMS}
          python3 scripts/fetch-tideforge-sources.py "$recipe" "$root/rpmbuild/SOURCES" --cache-dir "$HOME/.cache/tideforge/sources"
      - name: Pull the build image, retrying transient registry failures
        run: scripts/pull-container-image.sh quay.io/centos/centos:stream10
      - name: Build cpptrace with Tideforge libunwind
        run: |
          set -euo pipefail
          root="$PWD/.tideforge/cpptrace"
          docker run --rm --volume "$root:/work" quay.io/centos/centos:stream10 bash -lc '
            set -euo pipefail
            dnf -y install dnf-plugins-core rpm-build createrepo_c
            cp -a /work/prerequisite /tmp/tideforge-prerequisite
            createrepo_c /tmp/tideforge-prerequisite
            dnf -y install --nogpgcheck --repofrompath tideforge-prerequisite,file:///tmp/tideforge-prerequisite --enablerepo=tideforge-prerequisite libunwind-devel
            dnf -y builddep /work/rpmbuild/SPECS/cpptrace-devel.spec
            rpmbuild -ba --define "_topdir /work/rpmbuild" /work/rpmbuild/SPECS/cpptrace-devel.spec
          '
      - name: Clean-install cpptrace and libunwind from an ephemeral repository
        run: |
          set -euo pipefail
          root="$PWD/.tideforge/cpptrace"
          docker run --rm --volume "$root:/work:ro" quay.io/centos/centos:stream10 bash -lc '
            set -euo pipefail
            dnf -y install createrepo_c
            mkdir -p /tmp/tideforge-rpms
            cp -a /work/prerequisite/. /tmp/tideforge-rpms/
            cp -a /work/rpmbuild/RPMS/. /tmp/tideforge-rpms/
            createrepo_c /tmp/tideforge-rpms
            dnf -y install --nogpgcheck --repofrompath tideforge,file:///tmp/tideforge-rpms --enablerepo=tideforge cpptrace-devel
            rpm -q cpptrace-devel libunwind-devel
            test -f /usr/include/cpptrace/cpptrace.hpp
            test -f /usr/include/ctrace/ctrace.h
            ldconfig -p | grep -F libcpptrace.so.1
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cpptrace-devel-el10-rpm
          path: .tideforge/cpptrace/rpmbuild/RPMS/
          if-no-files-found: warn

