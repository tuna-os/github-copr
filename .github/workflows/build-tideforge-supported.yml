            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            install_name: greetd
            smoke: greetd --help
            clean_install: true
          - package: dms
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            clean_install: false
          - package: dms-cli
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            clean_install: false
          - package: dms-greeter
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            clean_install: false
          - package: dgop
            target: ubuntu
            image: docker.io/library/ubuntu:26.04
            install_name: dgop
