            dnf -y install --nogpgcheck --repofrompath tideforge,file:///tmp/tideforge-rpms --setopt=tideforge.priority=1 --enablerepo=tideforge input-remapper
            rpm -q input-remapper python3-evdev
            test -x /usr/bin/input-remapper-gtk
            test -x /usr/bin/input-remapper-service
            test -x /usr/bin/input-remapper-control
            test -f /usr/lib/udev/rules.d/99-input-remapper.rules
            test -f /usr/lib/systemd/system/input-remapper.service
