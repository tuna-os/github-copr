name: Build and Publish RPMs

on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Build only this tier (leave empty for all)'
        required: false
        default: ''
      packages:
        description: 'Build only this package path (e.g. src/deps/meson)'
        required: false
        default: ''
      jobs:
        description: 'Parallel builds within a tier (default: nproc/2)'
        required: false
        default: ''
      image:
        description: 'Mock runner image (override pre-built default)'
        required: false
        default: ''

env:
  R2_BUCKET: bluefin
  LOCAL_REPO: ${{ github.workspace }}/local-repo
  MOCK_RUNNER_IMAGE: ghcr.io/tuna-os/mock-runner:centos-stream-10

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            podman createrepo-c rpm rpmdevtools python3-yaml \
            gpg gpgconf
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Cache mock RPM downloads
        uses: actions/cache@v4
        with:
          path: /var/cache/mock
          key: mock-cache-centos-stream-10-${{ hashFiles('mock/centos-stream-10-ci.cfg') }}
          restore-keys: |
            mock-cache-centos-stream-10-

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_committer_name: RPM Builder
          git_committer_email: rpm-signing@tunaos.org

      - name: Configure rclone for R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          EOF

      - name: Pull mock runner image
        run: |
          IMAGE="${{ github.event.inputs.image || env.MOCK_RUNNER_IMAGE }}"
          podman pull "${IMAGE}"
          # Warm the /var/cache/mock host directory so the bind-mount
          # inside containers picks up cached RPM downloads
          sudo mkdir -p /var/cache/mock

      - name: Seed local repo from R2
        run: |
          mkdir -p "${LOCAL_REPO}"
          echo "Downloading existing repo from R2 (10-stream-x86_64)..."
          rclone sync "r2:${R2_BUCKET}/repo/10-stream-x86_64/" "${LOCAL_REPO}/" \
            --exclude "repodata/**" || true
          echo "Initializing local repo metadata..."
          createrepo_c "${LOCAL_REPO}"

      - name: Build packages
        run: |
          IMAGE="${{ github.event.inputs.image || env.MOCK_RUNNER_IMAGE }}"
          ARGS=(
            --backend podman
            --image   "${IMAGE}"
            --local-repo "${LOCAL_REPO}"
          )
          if [[ -n "${{ github.event.inputs.tier }}" ]]; then
            ARGS+=(--tier "${{ github.event.inputs.tier }}")
          fi
          if [[ -n "${{ github.event.inputs.packages }}" ]]; then
            ARGS+=(--package "${{ github.event.inputs.packages }}")
          fi
          if [[ -n "${{ github.event.inputs.jobs }}" ]]; then
            ARGS+=(--jobs "${{ github.event.inputs.jobs }}")
          fi
          ./scripts/build-chain.sh "${ARGS[@]}"

      - name: Sign RPMs
        run: |
          find "${LOCAL_REPO}" -name "*.rpm" -newer "${LOCAL_REPO}/repodata/repomd.xml" \
            -exec rpmsign --addsign {} \;
          createrepo_c --update "${LOCAL_REPO}"

      - name: Upload to R2
        run: |
          echo "Uploading to 10-stream-x86_64 (CentOS Stream 10)..."
          rclone sync "${LOCAL_REPO}/" "r2:${R2_BUCKET}/repo/10-stream-x86_64/"

          echo "Uploading to 10-x86_64 (AlmaLinux 10)..."
          rclone sync "${LOCAL_REPO}/" "r2:${R2_BUCKET}/repo/10-x86_64/"

      - name: Upload GPG public key
        run: rclone copyto public.gpg "r2:${R2_BUCKET}/public.gpg"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpm-builds
          path: ${{ env.LOCAL_REPO }}/
          retention-days: 7
