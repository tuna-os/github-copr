name: Build and Publish RPMs

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated build targets'
        required: false
        default: 'fedora-43-x86_64,almalinux-10-x86_64,centos-stream-10-x86_64'

env:
  R2_BUCKET: bluefin

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: fedora:43
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_committer_name: RPM Builder
          git_committer_email: rpm-signing@tunaos.org

      - name: Install dependencies
        run: |
          dnf install -y dnf-plugins-core mock createrepo_c rpm-sign rpm-build rclone

      - name: Configure rclone for R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [remote]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          EOF

      - name: Get build matrix
        id: matrix
        run: |
          TARGETS="${{ github.event.inputs.targets }}"
          if [ -z "$TARGETS" ]; then
            TARGETS="fedora-43-x86_64 almalinux-10-x86_64 almalinux-10-x86_64_v2 centos-stream-10-x86_64"
          fi
          echo "targets=$TARGETS" >> $GITHUB_OUTPUT

      - name: Build RPMs
        run: |
          # Copy sources and build SRPM
          mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SRPMS,SPECS}
          cp src/*.spec ~/rpmbuild/SPECS/
          cp src/*.tar.gz ~/rpmbuild/SOURCES/ 2>/dev/null || true
          rpmbuild -bs ~/rpmbuild/SPECS/*.spec --define "_topdir $HOME/rpmbuild"
          
          for target in ${{ steps.matrix.outputs.targets }}; do
            echo "Building for $target"
            mock -r $target --init
            mock -r $target --install gcc make
            mock -r $target --rebuild ~/rpmbuild/SRPMS/*.src.rpm
            mock -r $target --resultdir=./output/$target clean
          done

      - name: Sign RPMs
        run: |
          find output -name "*.rpm" -exec rpmsign --addsign {} \;
        env:
          GPG_AGENT_INFO: ""

      - name: Upload to R2
        run: |
          for target in ${{ steps.matrix.outputs.targets }}; do
            mkdir -p ./repo/$target/
            
            echo "Downloading existing repository..."
            rclone sync remote:${{ env.R2_BUCKET }}/repo/$target/ ./repo/$target/ || true
            
            echo "Copying newly built RPMs..."
            cp -a output/$target/*.rpm ./repo/$target/ || true
            
            echo "Generating repository metadata..."
            createrepo_c --update ./repo/$target/
            
            echo "Uploading repository to R2..."
            rclone sync ./repo/$target/ remote:${{ env.R2_BUCKET }}/repo/$target/ --delete
          done

      - name: Upload GPG public key to R2
        run: |
          rclone copyto public.gpg remote:${{ env.R2_BUCKET }}/public.gpg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-builds-x86_64
          path: output/
          retention-days: 7
