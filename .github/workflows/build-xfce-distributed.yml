name: XFCE Wayland Distributed Build and Publish
'on':
  workflow_dispatch:
    inputs:
      force:
        description: Force rebuild even if package exists in repo
        type: boolean
        default: false
env:
  R2_BUCKET: bluefin
  LOCAL_REPO: ${{ github.workspace }}/local-repo
  MOCK_RUNNER_IMAGE: ghcr.io/tuna-os/mock-runner:centos-stream-10
jobs:
  seed-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q createrepo-c
      - name: Configure rclone
        run: 'curl -fsSL https://rclone.org/install.sh | sudo bash

          mkdir -p ~/.config/rclone

          umask 077

          cat > ~/.config/rclone/rclone.conf << EOF

          [r2]

          type = s3

          provider = Cloudflare

          access_key_id = ${R2_ACCESS_KEY_ID}

          secret_access_key = ${R2_SECRET_ACCESS_KEY}

          endpoint = https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com

          EOF

          '
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Seed local repo from R2
        run: 'mkdir -p local-repo

          echo "Downloading existing repo from R2..."

          rclone sync "r2:${R2_BUCKET}/xfce/10-stream-x86_64/" "local-repo/" --exclude "repodata/**" || true

          createrepo_c local-repo

          '
      - name: Upload initial repo
        uses: actions/upload-artifact@v7
        with:
          name: repo-0
          path: local-repo
          retention-days: 1
  build-xfce-build-tools:
    needs: seed-repo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - src/xfce-wayland/xfce4-dev-tools
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install host dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q podman createrepo-c rpm
      - name: Cache CentOS Stream 10 image
        uses: actions/cache@v6
        with:
          path: /tmp/cs10-image.tar
          key: cs10-image-${{ hashFiles('mock/centos-stream-10-ci.cfg') }}
      - name: Load or pull image
        run: "if [[ -f /tmp/cs10-image.tar ]]; then\n  podman load -i /tmp/cs10-image.tar\nelse\n  podman pull quay.io/centos/centos:stream10\n  podman save -o /tmp/cs10-image.tar quay.io/centos/centos:stream10\nfi\npodman pull ${{ env.MOCK_RUNNER_IMAGE }}\n"
      - name: Download previous repo
        uses: actions/download-artifact@v8
        with:
          name: repo-0
          path: local-repo
      - name: Cache mock chroot (dnf downloads)
        uses: actions/cache@v6
        with:
          path: .mock-cache
          key: mock-cache-${{ matrix.package }}-${{ hashFiles('mock/centos-stream-10-ci.cfg') }}-${{ github.run_id }}
          restore-keys: 'mock-cache-${{ matrix.package }}-${{ hashFiles(''mock/centos-stream-10-ci.cfg'') }}-

            mock-cache-${{ matrix.package }}-'
      - name: Build package
        env:
          MOCK_CACHE_DIR: ${{ github.workspace }}/.mock-cache
        run: "touch .build-marker\nARGS=(--backend podman --tier xfce-build-tools --package ${{ matrix.package }} --manifest build-order-xfce.yml)\nif [[ \"${{ github.event.inputs.force }}\" == \"true\" ]]; then\n  ARGS+=(--force)\nfi\n./scripts/build-chain.sh \"${ARGS[@]}\"\n"
      - name: Find new RPMs
        id: find-rpms
        run: 'mkdir -p new-rpms

          find local-repo -name "*.rpm" -newer .build-marker -exec cp {} new-rpms/ \;

          count=$(ls -1 new-rpms/*.rpm 2>/dev/null | wc -l)

          echo "count=$count" >> $GITHUB_OUTPUT

          '
      - name: Upload RPMs
        if: steps.find-rpms.outputs.count > '0'
        uses: actions/upload-artifact@v7
        with:
          name: rpms-xfce-build-tools-${{ strategy.job-index }}
          path: new-rpms/*.rpm
          retention-days: 1
  consolidate-xfce-build-tools:
    needs: build-xfce-build-tools
    runs-on: ubuntu-latest
    steps:
      - name: Install createrepo_c
        run: sudo apt-get update -q && sudo apt-get install -y -q createrepo-c
      - name: Download previous repo
        uses: actions/download-artifact@v8
        with:
          name: repo-0
          path: local-repo
      - name: Download new RPMs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: rpms-xfce-build-tools-*
          path: local-repo
          merge-multiple: true
      - name: Update repo
        run: createrepo_c --update local-repo
      - name: Upload updated repo
        uses: actions/upload-artifact@v7
        with:
          name: repo-1
          path: local-repo
          retention-days: 1
  build-xfce-layer-shell:
    needs: consolidate-xfce-build-tools
