name: Build Mock Runner Image
# Builds and pushes ghcr.io/tuna-os/mock-runner:centos-stream-10
# Image is just Fedora + mock toolchain. The CentOS Stream 10 environment
# is pulled at build time via mock's use_bootstrap_image.

on:
  push:
    branches: [main]
    paths:
      # Any mock config, not just the cs10 one: the configs are baked into the
      # image, so editing one in the repo has no effect until the image is
      # rebuilt. Listing them individually meant a new chroot (or an edit to a
      # gnome config) shipped silently stale.
      - 'mock/Containerfile'
      - 'mock/*.cfg'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tuna-os/mock-runner
  TAG: centos-stream-10

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          podman build \
            --pull=always \
            -f mock/Containerfile \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:${TAG}-${{ github.sha }}" \
            mock/

      - name: Push image
        run: |
          podman push "${IMAGE}:${TAG}"
          podman push "${IMAGE}:${TAG}-${{ github.sha }}"

      - name: Inspect
        run: podman images "${IMAGE}:${TAG}" --format "{{.Repository}}:{{.Tag}}  {{.Size}}"
