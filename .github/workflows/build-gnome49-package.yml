name: GNOME 49 Package Build (Incremental)

on:
  pull_request:
    paths:
      - 'src/gnome-49/**'
  push:
    branches:
      - gnome-49-pipeline
      - main
    paths:
      - 'src/gnome-49/**'
  workflow_dispatch:
    inputs:
      package_path:
        description: 'Package path (e.g. src/gnome-49/gdm)'
        required: true

env:
  R2_BUCKET: bluefin
  R2_REPO_PATH: gnome49/10-stream-x86_64
  MOCK_RUNNER_IMAGE: ghcr.io/tuna-os/mock-runner:centos-stream-10

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      has_session_package: ${{ steps.detect.outputs.has_session_package }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        env:
          PACKAGE_PATH: ${{ github.event.inputs.package_path || '' }}
        run: |
          SESSION_PKGS='mutter|gnome-shell|gdm'
          if [[ -n "${PACKAGE_PATH}" ]]; then
            # Manual dispatch: use explicit path
            PACKAGES=$(python3 -c "import json; print(json.dumps(['${PACKAGE_PATH}']))")
          else
            # Detect from changed files
            BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
            HEAD="${{ github.sha }}"
            # A "package" is a directory holding an RPM spec build-chain.sh can
            # build — nothing else. Stripping the last path component off every
            # changed file, with no check that a spec lives there, is exactly how
            # `src/gnome-49/avahi/tests` became a build target in run 28668672883
            # on 2026-07-03: build-chain.sh produced 0 RPMs, and the job still
            # synced the empty local-repo over production, taking the published
            # GNOME 49 repo to 0 packages. Same guard f877c83 (PR #99) added to
            # build-xfce-package.yml after the identical 2026-07-19 XFCE incident.
            CHANGED=$(git diff --name-only "${BASE}" "${HEAD}" | \
              grep '^src/gnome-49/' | \
              sed 's|/[^/]*$||' | sort -u | \
              while read -r d; do
                compgen -G "${d}/*.spec" >/dev/null 2>&1 && echo "$d"
              done | \
              python3 -c "import sys,json; dirs=sys.stdin.read().splitlines(); print(json.dumps(dirs))")
            PACKAGES="${CHANGED}"
          fi
          echo "packages=${PACKAGES}" >> $GITHUB_OUTPUT
          echo "Will build: ${PACKAGES}"

          # Check if any changed package is a session-layer package
          HAS_SESSION=false
          for PKG in $(echo "${PACKAGES}" | python3 -c "import sys,json; print('\n'.join(json.load(sys.stdin)))" 2>/dev/null); do
            PKG_BASENAME=$(basename "${PKG}")
            if echo "${PKG_BASENAME}" | grep -qE "${SESSION_PKGS}"; then
              HAS_SESSION=true
              break
            fi
          done
          echo "has_session_package=${HAS_SESSION}" >> $GITHUB_OUTPUT

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install host dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q podman createrepo-c rpm gpg gpgconf
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Cache CentOS Stream 10 image
        uses: actions/cache@v6
        with:
          path: /tmp/cs10-image.tar
          key: cs10-image-${{ hashFiles('mock/centos-stream-10-ci.cfg') }}

      - name: Load or pull container image
        run: |
          if [[ -f /tmp/cs10-image.tar ]]; then
            podman load -i /tmp/cs10-image.tar
          else
            podman pull quay.io/centos/centos:stream10
            podman save -o /tmp/cs10-image.tar quay.io/centos/centos:stream10
          fi
          podman pull ${{ env.MOCK_RUNNER_IMAGE }}

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          EOF

      # copy, not sync: this direction must never delete local files, and the
      # failure must not be swallowed. The old `sync ... || true` meant a failed
      # seed silently produced an EMPTY local-repo, which the upload step below
      # then synced over production — deleting every published RPM rather than
      # merely failing to update them. That is the 2026-07-03 wipe.
      - name: Seed local repo from R2 (current published state)
        run: |
          mkdir -p local-repo
          rclone copy "r2:${R2_BUCKET}/${R2_REPO_PATH}/" local-repo/ \
            --exclude "repodata/**" --progress --transfers 8
          # Always create valid repodata so mock doesn't fatal on empty repo
          createrepo_c local-repo || createrepo_c --update local-repo || true

      # Marks "now" so the sign and refuse-empty steps below can tell this run's
      # output apart from the already-published, already-signed RPMs just seeded
      # into local-repo.
      - name: Mark build start
        run: touch build-start-marker

      - name: Build package
        run: |
          ./scripts/build-chain.sh \
            --backend podman \
            --local-repo local-repo \
            --manifest .copr/build-order-gnome49.yml \
            --mock-config centos-stream-10-ci-gnome49 \
            --package "${{ matrix.package }}" \
            --force

      - name: Import GPG key and sign
        if: github.event_name != 'pull_request'
        uses: crazy-max/ghaction-import-gpg@v7
        id: import-gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign new RPMs
        if: github.event_name != 'pull_request'
        run: |
          echo "%_signature gpg" > ~/.rpmmacros
          echo "%_gpg_name ${{ steps.import-gpg.outputs.keyid }}" >> ~/.rpmmacros
          # -newer the marker: sign only what THIS run produced. Without it every
          # already-signed seeded RPM gets re-signed on every build, and rpmsign
          # is not guaranteed idempotent on an already-signed file.
          find local-repo -name "*.rpm" -newer build-start-marker -exec rpmsign --addsign {} \;
          createrepo_c --update local-repo

      # Hard stop before anything below can touch R2. rclone sync makes the
      # destination match its source EXACTLY, so syncing an empty local-repo
      # DELETES the published repo rather than failing to update it. Scoped to
      # this run's output, not the seeded total — the question is "did THIS run
      # build anything", and local-repo always has RPMs now that it is seeded.
      - name: Refuse to publish an empty result
        if: github.event_name != 'pull_request'
        run: |
          RPM_COUNT=$(find local-repo -name '*.rpm' ! -name '*.src.rpm' -newer build-start-marker | wc -l)
          echo "RPMs built this run: ${RPM_COUNT}"
          if [[ "${RPM_COUNT}" -eq 0 ]]; then
            echo "::error::0 RPMs produced — refusing to run rclone sync. A sync here would DELETE the published repo, not merely fail to update it."
            exit 1
          fi

      - name: Upload updated package to R2
        if: github.event_name != 'pull_request'
        run: |
          rclone sync local-repo/ "r2:${R2_BUCKET}/${R2_REPO_PATH}/"

      - name: Smoke test — install RPM in CentOS Stream 10
        run: |
          # Verify the built RPM can be installed cleanly against the base OS.
          # Catches: missing deps, file conflicts, broken %%post scriptlets.
          RPM=$(find local-repo -name '*.rpm' ! -name '*-debuginfo-*' ! -name '*-debugsource-*' 2>/dev/null | head -1)
          if [[ -z "${RPM}" ]]; then
            echo "No non-debug RPM found to test"
            exit 0
          fi
          echo "Smoke-testing: ${RPM}"
          podman run --rm -v "${RPM}:${RPM}:ro" \
            quay.io/centos/centos:stream10 \
            bash -c "
              dnf install -y --nogpgcheck ${RPM} 2>&1 &&
              rpm -q --qf '%{NAME}-%{VERSION}-%{RELEASE}' \$(rpm -qp --qf '%{NAME}' ${RPM})
            "
          echo "Smoke test passed: RPM installs cleanly on CentOS Stream 10"

      - name: Upload RPMs as artifact (PR builds)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: rpms-${{ strategy.job-index }}
          path: local-repo/*.rpm
          retention-days: 3

  verify-login:
    needs: [detect-changes, build]
    if: ${{ github.event_name == 'pull_request' && needs.detect-changes.outputs.has_session_package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Install Lima
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf
          curl -fsSL "https://github.com/lima-vm/lima/releases/download/v2.1.3/lima-2.1.3-Linux-x86_64.tar.gz" | sudo tar xz -C /usr/local
          limactl --version

      - name: Download PR-built RPMs
        uses: actions/download-artifact@v8
        with:
          pattern: rpms-*
          merge-multiple: true
          path: /tmp/pr-rpms

      - name: Create Lima VM config
        run: |
          cat > /tmp/gnome49-pr-test.yaml << 'EOF'
          vmType: qemu
          arch: x86_64
          cpus: 2
          memory: 4GiB
          disk: 20GiB

          video:
            display: "vnc"

          images:
            - location: "https://cloud.centos.org/centos/10-stream/x86_64/images/CentOS-Stream-GenericCloud-x86_64-10-latest.x86_64.qcow2"
              arch: x86_64

          mounts:
            - location: "/tmp/pr-rpms"
              writable: false

          ssh:
            localPort: 0
            loadDotSSHPubKeys: false

          provision:
            - mode: system
              script: |
                #!/bin/bash
                set -euxo pipefail
                # Install PR-built RPM overlaying CentOS Stream 10 base
                dnf -y install /tmp/lima/pr-rpms/*.rpm
                # Enable GDM for graphical boot
                systemctl enable gdm
                systemctl set-default graphical.target
          EOF

      - name: Start Lima VM
        run: |
          limactl start --name=gnome49-pr-test /tmp/gnome49-pr-test.yaml --timeout=20m
          echo "VM started"

      - name: Reboot and wait for GDM
        run: |
          echo "Rebooting VM to start GDM..."
          limactl shell gnome49-pr-test -- sudo reboot || true
          sleep 30
          for i in $(seq 1 18); do
            if limactl shell gnome49-pr-test -- true 2>/dev/null; then
              echo "VM back after reboot"
              break
            fi
            sleep 10
          done
          echo "Waiting for GDM (up to 5 min)..."
          for i in $(seq 1 30); do
            STATUS=$(limactl shell gnome49-pr-test -- systemctl is-active gdm 2>/dev/null || echo "inactive")
            echo "Attempt $i/30: gdm is ${STATUS}"
            [[ "${STATUS}" == "active" ]] && break
            sleep 10
          done
          if [[ "${STATUS}" != "active" ]]; then
            echo "ERROR: GDM failed to become active"
            limactl shell gnome49-pr-test -- sudo journalctl -u gdm --no-pager -n 50 || true
            exit 1
          fi

      - name: Check gnome-shell greeter stability
        run: |
          echo "Checking gnome-shell greeter stability..."
          for i in $(seq 1 30); do
            SHELL_PID=$(limactl shell gnome49-pr-test -- pgrep -f 'gnome-shell.*gdm' 2>/dev/null | head -1 || true)
            if [[ -z "${SHELL_PID}" ]]; then
              echo "Attempt $i/30: gnome-shell not running yet"
              sleep 10
              continue
            fi
            echo "Attempt $i/30: gnome-shell PID=${SHELL_PID}, waiting 10s..."
            sleep 10
            SHELL_PID2=$(limactl shell gnome49-pr-test -- pgrep -f 'gnome-shell.*gdm' 2>/dev/null | head -1 || true)
            if [[ "${SHELL_PID}" == "${SHELL_PID2}" ]]; then
              echo "gnome-shell PID stable at ${SHELL_PID} (survived 10s)"
              echo "LOGIN TEST PASSED"
              exit 0
            fi
            echo "PID changed: ${SHELL_PID} -> ${SHELL_PID2} (crash-restart detected)"
          done
          echo "ERROR: gnome-shell did not stabilize (crash-loop)"
          limactl shell gnome49-pr-test -- sudo journalctl -u gdm --no-pager -n 30 || true
          exit 1

      - name: Stop Lima VM
        if: always()
        run: limactl stop gnome49-pr-test --force || true
