name: Tideforge source cache
description: Restore the content-addressed source store for one recipe
inputs:
  recipe:
    description: Path to the package.yaml recipe
    required: true
outputs:
  cache-hit:
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: |
        set -euo pipefail
        echo "key=tideforge-src-v1-$(python3 scripts/tideforge_cache.py key '${{ inputs.recipe }}')" >> "$GITHUB_OUTPUT"
    - id: restore
      # actions/cache v6.0.0
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/tideforge/sources
        key: ${{ steps.key.outputs.key }}
