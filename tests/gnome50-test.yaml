vmType: qemu
arch: x86_64
cpus: 4
memory: 8GiB
disk: 40GiB

video:
  display: "vnc"
  vga: "std"

images:
  - location: "https://cloud.centos.org/centos/10-stream/x86_64/images/CentOS-Stream-GenericCloud-x86_64-10-latest.x86_64.qcow2"
    arch: x86_64

mounts:
  - location: "~"
    writable: true

ssh:
  localPort: 0
  loadDotSSHPubKeys: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euxo pipefail

      # Use the project-owned signed rpm-md repository. Do not add a COPR
      # fallback: this test is specifically meant to catch a missing R2 RPM
      # (#113, #179).
      dnf -y install dnf-plugins-core
      cat > /etc/yum.repos.d/tunaos-gnome50.repo <<'EOF'
      [tunaos-gnome50]
      name=TunaOS GNOME 50
      baseurl=https://repo.tunaos.org/gnome50/10-stream-x86_64/
      enabled=1
      gpgcheck=0
      priority=1
      EOF

      # Install GNOME 50 core components
      # We install these first to ensure our versions are picked up
      dnf -y install \
        gnome-shell \
        gnome-control-center \
        mutter \
        gdm \
        gnome-session-wayland-session \
        gnome-terminal \
        nautilus \
        glib2

      # Install a minimal graphical environment
      dnf -y group install "BaseOS" "Fonts"

      # Enable GDM and set graphical boot
      systemctl enable gdm
      systemctl set-default graphical.target

      echo "GNOME 50 installation complete. Please reboot if necessary."
