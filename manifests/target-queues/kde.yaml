# Aurora KDE additions currently have a native EL10 RPM path. The upstream
# Plasma desktop remains a distro package; this queue models only TunaOS-owned
# additions and their promotion gates.
schema: 1
queues:
  el10:
    format: rpm
    implementation: native-spec
    roots: [krunner-bazaar, oversteer-udev, kairpods]
    gates: [mock-build, rpm-md-stage-install, plasma-session-smoke]
  arch:
    format: pkg.tar.zst
    implementation: tideforge-pkgbuild
    roots: [krunner-bazaar, oversteer-udev, kairpods, plasma-setup]
    gates: [container-build, pacman-stage-install, plasma-session-smoke]
