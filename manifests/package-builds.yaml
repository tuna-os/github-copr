schema: 1
# Legacy native-spec trees remain data-driven build cells until their sources
# migrate to packages/<name>/package.yaml. No family owns a workflow.
native_builds:
  - id: gnome49-el10-x86_64
    family: gnome49
    enabled: false
    track: legacy
    series: "49"
    target: el10
    architecture: x86_64
    image: ghcr.io/tuna-os/mock-runner:centos-stream-10
    verify_image: quay.io/centos/centos:stream10
    manifest: .copr/build-order-gnome49.yml
    mock_config: centos-stream-10-ci-gnome49
    source_paths: [src/gnome-49/, src/deps/]
    r2_path: gnome49/10-stream-x86_64
  - id: gnome50-el10-x86_64
    family: gnome50
    track: stable
    series: "50"
    dependency_tree: manifests/dependency-trees/gnome.yaml
    target_queue: manifests/target-queues/gnome.yaml
    target: el10
    architecture: x86_64
    image: ghcr.io/tuna-os/mock-runner:centos-stream-10
    verify_image: quay.io/centos/centos:stream10
    manifest: build-order.yml
    mock_config: centos-stream-10-ci
    source_paths: [src/gnome-50/, src/deps/]
    r2_path: repo/10-x86_64
  - id: gnome51-el10-x86_64
    family: gnome51
    track: next
    series: "51"
    dependency_tree: manifests/dependency-trees/gnome.yaml
    target_queue: manifests/target-queues/gnome.yaml
    target: el10
    architecture: x86_64
    image: ghcr.io/tuna-os/mock-runner:centos-stream-10
    verify_image: quay.io/centos/centos:stream10
    manifest: build-order-gnome51.yml
    mock_config: centos-stream-10-ci-gnome51
    source_paths: [src/gnome-51/, src/deps/]
    r2_path: gnome51/10-stream-x86_64
  - id: xfce-el10-x86_64
    family: xfce
    target: el10
    architecture: x86_64
    image: ghcr.io/tuna-os/mock-runner:centos-stream-10
    verify_image: quay.io/centos/centos:stream10
    manifest: build-order-xfce.yml
    mock_config: centos-stream-10-ci
    source_paths: [src/xfce-wayland/]
    r2_path: xfce/10-stream-x86_64
  # The aarch64 counterpart, added because el10/aarch64 had NO xfce packages
  # at all: xfce/10-stream-aarch64 404s while the x86_64 prefix serves 110
  # package names, and 88 of the 91 names el10/x86_64 has that aarch64 lacks
  # are build-chain products of this family and the gnome ones (#480). XFCE
  # simply could not be assembled on el10 aarch64.
  #
  # Reuses build-order-xfce.yml rather than taking a -aarch64 copy. The
  # fprintd pair needed two manifests only because that file's own
  # `target:`/`r2_path:` differ per arch; the CELL supplies mock_config and
  # r2_path and run-package-factory-cell.sh passes `--mock-config` straight
  # through, so the manifest's values are not what the build uses.
  # hummingbird-aarch64 already shares one manifest with its x86_64 twin the
  # same way.
  #
  # Nothing structurally blocked this: centos-stream-10-ci-aarch64.cfg is a
  # general EL10 aarch64 target ("aarch64 counterpart to
  # centos-stream-10-ci.cfg — same shape"), already proven by the green
  # fprintd-el10-aarch64 cell, and none of the 35 specs under
  # src/xfce-wayland/ carries ExclusiveArch, ExcludeArch or %ifarch.
  #
  # el10's published_index.aarch64 deliberately does NOT list
  # xfce/10-stream-aarch64 yet — that prefix does not exist until a publish
  # wave writes it, and the target contract's rule is to declare only an
  # index that actually resolves.
  - id: xfce-el10-aarch64
    family: xfce
    target: el10
    architecture: aarch64
    runner: ubuntu-24.04-arm
    image: ghcr.io/tuna-os/mock-runner:centos-stream-10-aarch64
    verify_image: quay.io/centos/centos:stream10
    manifest: build-order-xfce.yml
    mock_config: centos-stream-10-ci-aarch64
    source_paths: [src/xfce-wayland/]
    r2_path: xfce/10-stream-aarch64
  - id: xfce-fedora-x86_64
    family: xfce
    target: fedora
    architecture: x86_64
    # build-chain needs its mock/spectool tool image; the mock config selects
    # Fedora 44. Clean-install verification uses the target image separately.
    image: ghcr.io/tuna-os/mock-runner:centos-stream-10
    verify_image: registry.fedoraproject.org/fedora:44
    manifest: build-order-xfce-fedora.yml
    mock_config: fedora-44-ci
    source_paths: [src/xfce-wayland/]
    r2_path: xfce/44-x86_64
  - id: hummingbird-x86_64
    family: hummingbird-desktops
    target: hummingbird
    architecture: x86_64
    image: ghcr.io/tuna-os/mock-runner:centos-stream-10
    # The mock contract emits .fc43 packages against Python 3.14. Verify the
    # same ABI rather than rolling Rawhide, which has already moved to 3.15.
    verify_image: registry.fedoraproject.org/fedora:43
    manifest: build-order-hummingbird-desktops.yml
    mock_config: hummingbird-ci
    source_paths: [src/hummingbird/, src/xfce-wayland/]
    r2_path: hummingbird/20251124-x86_64
    canary_tiers: bootstrap-00
  - id: hummingbird-aarch64
    family: hummingbird-desktops
    target: hummingbird
    architecture: aarch64
    runner: ubuntu-24.04-arm
    image: ghcr.io/tuna-os/mock-runner:centos-stream-10-aarch64
    verify_image: registry.fedoraproject.org/fedora:43
    manifest: build-order-hummingbird-desktops.yml
    mock_config: hummingbird-ci-aarch64
    source_paths: [src/hummingbird/, src/xfce-wayland/]
    r2_path: hummingbird/20251124-aarch64
    canary_tiers: bootstrap-00
  - id: fprintd-el10-x86_64
    family: fprintd
    target: el10
    architecture: x86_64
    image: ghcr.io/tuna-os/mock-runner:centos-stream-10
    verify_image: quay.io/centos/centos:stream10
    manifest: build-order-fprintd.yml
    mock_config: centos-stream-10-ci
    source_paths: [src/deps/libfprint/, src/deps/fprintd/]
    publish: false
  - id: fprintd-el10-aarch64
    family: fprintd
    target: el10
    architecture: aarch64
    runner: ubuntu-24.04-arm
    image: ghcr.io/tuna-os/mock-runner:centos-stream-10-aarch64
    verify_image: quay.io/centos/centos:stream10
    manifest: build-order-fprintd-aarch64.yml
    mock_config: centos-stream-10-ci-aarch64
    source_paths: [src/deps/libfprint/, src/deps/fprintd/]
    r2_path: fprintd/10-stream-aarch64
