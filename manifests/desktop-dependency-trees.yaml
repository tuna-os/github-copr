# Build order for replacing external desktop repositories.  Leaves are built
# first; each root is eligible for image consumption only after its full tree
# builds and installs from the staged TunaOS repository.
schema: 1
trees:
  niri-dms:
    targets: [el10, ubuntu, debian, opensuse-tumbleweed, arch]
    roots: [niri, dms, dms-greeter]
    nodes:
      niri: {source: niri-wm/niri, needs: [cargo-toolchain, wayland-stack, libseat]}
      quickshell: {source: outfoxxed/quickshell, needs: [qt6-wayland, wayland-stack]}
      dms: {source: AvengeMedia/DankMaterialShell, needs: [quickshell]}
      dms-greeter: {source: AvengeMedia/DankMaterialShell, needs: [dms, greetd]}
      iio-niri: {source: zirconium-dev/zirconium, needs: [niri]}
      cargo-toolchain: {kind: distro-build-dependency}
      wayland-stack: {kind: distro-build-dependency}
      libseat: {kind: distro-build-dependency}
      qt6-wayland: {kind: distro-build-dependency}
      greetd: {kind: distro-or-factory-package}
  cosmic:
    targets: [el10, ubuntu, debian]
    roots: [cosmic-session, cosmic-greeter]
    nodes:
      cosmic-session: {source: pop-os/cosmic-epoch, needs: [cosmic-comp, cosmic-settings, greetd]}
      cosmic-comp: {source: pop-os/cosmic-comp, needs: [cargo-toolchain, wayland-stack]}
      cosmic-settings: {source: pop-os/cosmic-settings, needs: [cargo-toolchain]}
      cosmic-greeter: {source: pop-os/cosmic-greeter, needs: [greetd]}
      cargo-toolchain: {kind: distro-build-dependency}
      wayland-stack: {kind: distro-build-dependency}
      greetd: {kind: distro-or-factory-package}
  xfce-wayland:
    targets: [el10, fedora]
    roots: [xfce4-wayland]
    nodes:
      xfce4-wayland: {source: tuna-os/xfce-wayland, needs: [xfconf, xfce4-session, xfce4-panel, xfdesktop]}
      xfconf: {source: xfce/xfconf, needs: [glib2, dbus]}
      xfce4-session: {source: xfce/xfce4-session, needs: [xfconf]}
      xfce4-panel: {source: xfce/xfce4-panel, needs: [xfconf]}
      xfdesktop: {source: xfce/xfdesktop, needs: [xfconf]}
      glib2: {kind: distro-or-factory-package}
      dbus: {kind: distro-build-dependency}
  bluefin-updates:
    targets: [el10, ubuntu, debian]
    roots: [uupd]
    nodes:
      uupd: {source: ublue-os/uupd, needs: [cargo-toolchain]}
      cargo-toolchain: {kind: distro-build-dependency}
  aurora-kde:
    targets: [el10]
    roots: [krunner-bazaar, ublue-os-selinux-workarounds, oversteer-udev]
    nodes:
      krunner-bazaar: {source: ublue-os/packages, needs: [plasma-workspace, bazaar]}
      ublue-os-selinux-workarounds: {source: ublue-os/packages, needs: [selinux-policy]}
      oversteer-udev: {source: ublue-os/packages, needs: []}
      plasma-workspace: {kind: distro-package}
      bazaar: {kind: distro-or-factory-package}
      selinux-policy: {kind: distro-or-factory-package}
