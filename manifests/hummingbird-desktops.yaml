# Project-owned desktop RPM source catalog for Hummingbird. No COPR entries.
#
# `required_packages` is the desktop's contract surface — what tunaOS's desktop
# gate refuses to ship an image without.  `install_packages` is the full set
# tunaOS actually installs (manifests/desktops/<desktop>.yaml, `fedora:`
# section on tuna-os/tunaOS).  Both are inputs to
# scripts/measure-hummingbird-gap.py, which resolves their Requires: closure
# against Fedora Rawhide and subtracts everything the target repository already
# ships.  The result is docs/hummingbird-desktop-gap.json and the generated
# build-order-hummingbird-desktops.yml.
#
# Measurement, 2026-08-06, against the target's own primary.xml (revision
# 1786016019, sha256 b92541eaf43fd4a8…): the target repository ships 3384
# binary package names and NONE of the desktop roots below — not gnome-shell,
# not gtk4, not cairo, not wayland, not mesa, not pipewire.  See
# docs/hummingbird-desktop-gap.md for the full method and numbers.
schema: 1

# Where this target's reviewed spec directories live, in lookup order, and
# where dist-git imports land for packages that have none. Declared here —
# a property of the target's source tree — so the gap engine stays free of
# any one family's layout (it used to hard-code exactly these four).
source_paths: [src/gnome-51, src/deps, src/hummingbird, src/xfce-wayland]
distgit_prefix: src/hummingbird
# Names that must come from Fedora Rawhide dist-git even though a directory
# of that name exists under `source_paths:` -- the directory belongs to
# another target.  src/deps/libnotify was added 2026-08-23 (#490) for EL10,
# five days after this build order was last measured, and pins 0.8.7 with
# the comment "0.8.7 rather than the newer 0.8.8 deliberately: it is the
# minimum that satisfies the requirement and it matches the version already
# published".  That is right for EL10 and wrong for a Rawhide rebuild, which
# gets 0.8.8.  Without this line the next scheduled re-measure would have
# quietly moved libnotify onto the EL10 pin.
prefer_distgit: [libnotify]
# What the generated build order contains.  `runtime` builds only what images
# ship; BuildRequires-only tools (bison, transfig, gtk-doc, the Java stack the
# documentation toolchains drag in) come from the buildroot's inherited
# Rawhide fallback at priority 99 (mock/hummingbird-ci.cfg) and are never
# rebuilt here.  The alternative, `selfhost`, folds the full BuildRequires:
# closure into the build order -- measured 2026-08-17 that is 3282 source
# packages against runtime's 663, a 5x factory for tools no image ships.
# Decided with the fixed fold of #289; the 1248-package order this replaced
# was an artifact of the fold bug, neither closure.
membership: runtime
target:
  id: hummingbird-20251124-x86_64
  baseurl: https://packages.redhat.com/api/pulp-content/public-hummingbird/$arch/
  r2_path: hummingbird/20251124-x86_64
  dist: .fc43
  # Sources come from Fedora Rawhide dist-git, imported at build time by
  # scripts/import-fedora-distgit.py.  Rawhide is the right branch and this is
  # measured, not assumed: of 38 core packages present in both indexes, 30 are
  # at the byte-identical upstream version-release as Rawhide and differ only
  # in dist tag (glib2 2.89.3-1, systemd 261.2-1, harfbuzz 14.3.0-1, qt6-qtbase
  # 6.11.1-5, rust 1.97.1-2, meson 1.11.2-2, …).  Fedora 43 ships glib2 2.86.5
  # and systemd 258.10; the target is nowhere near it.
  reference: fedora-rawhide
  # The target's own packages carry .hum1, not .fc43 — every one of the 16506
  # (name, evr, arch) tuples in its primary.xml ends in .hum1.  `.fc43` above
  # is what build-chain.sh stamps on OUR rebuilds; it is deliberately distinct
  # from the target's own tag so a rebuild is identifiable, but note it sorts
  # BELOW .hum1 for the same version, so it can never shadow a package the
  # target later starts shipping itself.

desktops:
  gnome:
    release: "51"
    sources: [{local: src/gnome-51}, {local: src/deps}]
    required_packages: [gdm, gjs, gnome-control-center, gnome-initial-setup, gnome-session, gnome-settings-daemon, gnome-shell, mutter, nautilus, xdg-desktop-portal-gnome]
    # Contract surface tunaOS's desktop gate checks by command/path/unit, which
    # the required_packages list above does not name: gnome-keyring-daemon,
    # gvfsd, the pipewire/wireplumber user units and the dconf distro database.
    # LUKS run 31100096864 job 92611346523 failed on exactly these.
    install_packages: [ModemManager, gjs, gnome-session, NetworkManager-adsl, NetworkManager-openconnect-gnome, NetworkManager-openvpn-gnome, NetworkManager-ppp, NetworkManager-ssh-gnome, NetworkManager-vpnc-gnome, NetworkManager-wwan, avahi, dconf, fprintd-pam, gdm, glib-networking, gnome-backgrounds, gnome-bluetooth, gnome-browser-connector, gnome-classic-session, gnome-color-manager, gnome-control-center, gnome-disk-utility, gnome-initial-setup, gnome-keyring, gnome-remote-desktop, gnome-session-wayland-session, gnome-settings-daemon, gnome-shell, gnome-system-monitor, gnome-user-docs, gnome-user-share, gsettings-desktop-schemas, gtk4, gvfs, gvfs-afc, gvfs-fuse, gvfs-goa, gvfs-gphoto2, gvfs-mtp, gvfs-smb, libadwaita, librsvg2, libsane-hpaio, mesa-dri-drivers, mesa-libEGL, mesa-vulkan-drivers, mutter, nautilus, pinentry-gnome3, pipewire, polkit, ptyxis, wireplumber, xdg-desktop-portal, xdg-desktop-portal-gnome, xdg-desktop-portal-gtk, xdg-user-dirs-gtk, yelp]
  kde:
    release: latest
    sources: [{fedora_distgit: plasma-desktop}, {fedora_distgit: plasma-workspace}, {fedora_distgit: kde-cli-tools}, {fedora_distgit: plasma-systemsettings}, {fedora_distgit: sddm}, {fedora_distgit: xdg-desktop-portal-kde}]
    required_packages: [plasma-desktop, plasma-workspace, plasma-systemsettings, sddm, xdg-desktop-portal-kde]
    install_packages: [sddm, dolphin, konsole, kate, ark, plasma-discover, xdg-desktop-portal-kde, qt6-qtwayland, ksshaskpass, ksystemlog, plasma-desktop, plasma-workspace, plasma-systemsettings]
  cosmic:
    release: latest
    sources: [{fedora_distgit: cosmic-session}, {fedora_distgit: cosmic-comp}, {fedora_distgit: cosmic-greeter}, {fedora_distgit: cosmic-settings}, {fedora_distgit: xdg-desktop-portal-cosmic}]
    required_packages: [cosmic-session, cosmic-comp, cosmic-greeter, cosmic-settings, xdg-desktop-portal-cosmic]
    install_packages: [cosmic-session, cosmic-comp, cosmic-panel, cosmic-app-library, cosmic-applets, cosmic-bg, cosmic-files, cosmic-idle, cosmic-launcher, cosmic-notifications, cosmic-osd, cosmic-randr, cosmic-screenshot, cosmic-settings, cosmic-settings-daemon, cosmic-term, cosmic-wallpapers, cosmic-workspaces, cosmic-greeter, cosmic-icon-theme, greetd, xdg-desktop-portal-cosmic]
  niri:
    release: latest
    sources: [{fedora_distgit: niri}, {upstream_rpm: https://github.com/outfoxxed/quickshell}, {upstream_rpm: https://github.com/AvengeMedia/DankMaterialShell}, {fedora_distgit: greetd}]
    required_packages: [niri, quickshell, dms, dms-cli, dms-greeter, greetd]
    install_packages: [niri, quickshell, dms, dms-cli, dms-greeter, greetd, swaylock, SwayNotificationCenter, waybar, fuzzel, swayidle, swaybg, wl-clipboard, xdg-desktop-portal-gnome, xdg-desktop-portal-gtk, xdg-user-dirs, pipewire, wireplumber, NetworkManager-tui, brightnessctl, playerctl, blueman, pavucontrol, gnome-keyring, gnome-keyring-pam, nautilus]
  xfce:
    release: "4.21"
    sources: [{local: src/xfce-wayland}]
    # greetd + gtkgreet + cage are the XFCE Wayland greetd login path from the
    # upstream parity register (docs/UPSTREAM_PARITY.md): gtkgreet is a project
    # recipe (packages/gtkgreet), cage is a Fedora distro package, greetd is
    # rebuilt from src/hummingbird/greetd.  They were named in the base-image
    # audit (#228) and are part of the desktop's contract surface.
    required_packages: [xfconf, libxfce4ui, xfwl4, greetd, gtkgreet, cage]
    install_packages: [gdm, greetd, gtkgreet, cage, xfwl4, xdg-desktop-portal-gtk, xdg-user-dirs-gtk, thunar, mousepad, ristretto, xfce4-whiskermenu-plugin, xfce4-terminal, xfce4-session, xfce4-panel, xfce4-settings, xfdesktop, xfwm4, xfwm4-themes, xfconf, libxfce4ui]

# Base-image component audit (tuna-os/tunaos-packages#228).
#
# quay.io/hummingbird-community/bootc-os:latest ships 262 packages total (a
# minimal bootc container OS with the CKI ARK kernel) and NONE of the
# submodules/applets below -- it does ship NetworkManager itself.  Each
# component is attributed to the desktop edition that must install it, and
# scripts/validate-hummingbird-catalog.py fails any commit that drops a
# component from its desktop's install_packages, so the availability audit
# is an invariant of the manifest rather than a one-off measurement.
components:
  gnome: [NetworkManager-openvpn-gnome, NetworkManager-openconnect-gnome, NetworkManager-wwan, gnome-keyring, nautilus, xdg-desktop-portal-gnome, xdg-desktop-portal-gtk]
  kde: [xdg-desktop-portal-kde]
  niri: [NetworkManager-tui, blueman, brightnessctl, playerctl, pavucontrol, gnome-keyring, nautilus, xdg-desktop-portal-gnome, xdg-desktop-portal-gtk, SwayNotificationCenter, waybar, fuzzel]
  xfce: [greetd, gtkgreet, cage, xdg-desktop-portal-gtk]

# The PEP-517 build backends Hummingbird does not ship (#268).
#
# These are not discovered by the gap measurement: a desktop's closure
# reaches them through BuildRequires that %pyproject_buildrequires only
# generates once the backend is already installed, so the measurement
# cannot see them and the build cannot start without them.
#
# They were hand-added to the generated build order, which is marked DO
# NOT HAND-EDIT -- regenerating it deleted them. Declaring them here
# makes them an input to the generator instead of an edit it destroys.
bootstrap:
  - name: bootstrap-00
    packages:
      - path: src/hummingbird/python-flit-core
        distgit: python-flit-core
      - path: src/hummingbird/python-poetry-core
        distgit: python-poetry-core
      - path: src/hummingbird/python-trove-classifiers
        distgit: python-trove-classifiers
  - name: bootstrap-01
    packages:
      - path: src/hummingbird/python-editables
        distgit: python-editables
      - path: src/hummingbird/python-installer
        distgit: python-installer
      - path: src/hummingbird/python-pyproject-hooks
        distgit: python-pyproject-hooks
      - path: src/hummingbird/python-wheel
        distgit: python-wheel
  - name: bootstrap-02
    packages:
      - path: src/hummingbird/python-hatchling
        distgit: python-hatchling
  - name: bootstrap-03
    packages:
      - path: src/hummingbird/python-hatch-vcs
        distgit: python-hatch-vcs
      - path: src/hummingbird/python-hatch-fancy-pypi-readme
        distgit: python-hatch-fancy-pypi-readme
