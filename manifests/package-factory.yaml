# TunaOS package-factory target contract.
#
# A source is imported from its upstream, rebuilt here, tested against one of
# these targets, signed by TunaOS, and then promoted to the matching R2 path.
# Upstreams are source/provenance inputs only; their binaries and repositories
# are never enabled on a TunaOS image.
schema: 1

upstreams:
  - id: ublue-bluefin
    url: https://github.com/ublue-os/bluefin
    license_review: required
  - id: ublue-aurora
    url: https://github.com/ublue-os/aurora
    license_review: required
  - id: zirconium
    url: https://github.com/zirconium-dev/zirconium
    license_review: required

targets:
  el10:
    status: supported
    format: rpm
    buildroot: epel-10
    architectures: [x86_64, aarch64]
    r2_path: rpm/el10/{arch}
    repository: rpm-md
    probe_image: quay.io/centos/centos:stream10
    # CRB is a signed, target-native CentOS repository.  It supplies selected
    # development headers (for example Qt private API metadata) during builds;
    # it is never added to a produced TunaOS image.
    build_repositories: [crb, epel]
  ubuntu:
    status: supported
    format: deb
    suites: [resolute]
    architectures: [amd64, arm64]
    r2_path: apt/ubuntu/{suite}/{arch}
    repository: apt
    probe_image: docker.io/library/ubuntu:26.04
  debian:
    status: supported
    format: deb
    suites: [sid]
    architectures: [amd64, arm64]
    r2_path: apt/debian/{suite}/{arch}
    repository: apt
    probe_image: docker.io/library/debian:sid
  hummingbird:
    # Hummingbird is a target of a different shape from the rest, and the
    # differences are load-bearing rather than cosmetic.
    #
    # It is not a distribution we can pull: there is no hummingbird container
    # image. It is an external RPM repository (Red Hat's public-hummingbird),
    # and mock/hummingbird-ci.cfg reaches it by including Fedora Rawhide's
    # chroot config and layering that repository over it at priority 10.
    #
    # `scaffold`, deliberately, and not because the builds do not work -- they
    # do; the desktop gate has published over a thousand packages. It is
    # scaffold because probe_image cannot yet tell the truth for this target.
    # The probe answers "is this dependency available", and the only image
    # that boots a Hummingbird-shaped root is the Fedora Rawhide base beneath
    # it, which answers yes for packages Hummingbird does not ship. A probe
    # that lies is worse than a probe that is absent, so no recipe should opt
    # into targets: [hummingbird] until this points at something Hummingbird-
    # shaped -- an image built from the target's own repository.
    status: scaffold
    format: rpm
    # The chroot is Fedora Rawhide with the target's repository on top, so
    # this is what a probe would boot. It is recorded for provenance; see the
    # note above for why it is not yet trustworthy to probe against.
    probe_image: registry.fedoraproject.org/fedora:rawhide
    architectures: [x86_64]
    # Not under rpm/: this path is already published and holds the packages
    # the desktop builds have produced. Moving it would orphan them.
    r2_path: hummingbird/20251124-x86_64
    repository: rpm-md
    # Buildroot inputs only, never repositories on a produced image. Fedora
    # Rawhide supplies -devel headers and build backends Hummingbird has no
    # build of yet; Fedora 44 supplies the Python namespace at the target's
    # own ABI (3.14, where Rawhide is 3.15).
    build_repositories: [fedora-rawhide, fedora-44]
  opensuse-tumbleweed:
    status: scaffold
    format: rpm
    architectures: [x86_64, aarch64]
    r2_path: rpm/opensuse-tumbleweed/{arch}
    repository: rpm-md
    probe_image: registry.opensuse.org/opensuse/tumbleweed:latest
  arch:
    status: scaffold
    format: pkg.tar.zst
    architectures: [x86_64, aarch64]
    r2_path: pacman/arch/{arch}
    repository: pacman
    probe_image: docker.io/library/archlinux:latest

# Cross-distro dependency capabilities.  Recipes express the dependency they
# need; Tideforge resolves it to native package names for the selected target.
# A value may be a list when a distribution splits one capability into several
# packages.  Native names remain available under dependencies.*.common/targets
# for exceptional or genuinely target-specific requirements.
dependency_catalog:
  rust: {el10: [rust, cargo], ubuntu: [rustc, cargo], debian: [rustc, cargo], opensuse-tumbleweed: [rust, cargo], arch: [rust]}
  go: {el10: [golang], ubuntu: [golang-go], debian: [golang-go], opensuse-tumbleweed: [go], arch: [go]}
  c-compiler: {el10: [gcc], ubuntu: [build-essential], debian: [build-essential], opensuse-tumbleweed: [gcc], arch: [base-devel]}
  cpp-compiler: {el10: [gcc-c++], ubuntu: [g++], debian: [g++], opensuse-tumbleweed: [gcc-c++], arch: [base-devel]}
  pkg-config: {el10: [pkgconf-pkg-config], ubuntu: [pkg-config], debian: [pkg-config], opensuse-tumbleweed: [pkgconf-pkg-config], arch: [pkgconf]}
  cmake: {el10: [cmake], ubuntu: [cmake], debian: [cmake], opensuse-tumbleweed: [cmake], arch: [cmake]}
  # Wayland-desktop build capabilities (#169). Nothing COSMIC links against
  # had a catalog entry, which made every deb widening a hand-curated name
  # hunt; these eight unblock all 14 cosmic recipes at once. Arch dev headers
  # ship in the main package, so the arch column names the library package.
  wayland-dev: {el10: [wayland-devel], ubuntu: [libwayland-dev], debian: [libwayland-dev], opensuse-tumbleweed: [wayland-devel], arch: [wayland]}
  libxkbcommon-dev: {el10: [libxkbcommon-devel], ubuntu: [libxkbcommon-dev], debian: [libxkbcommon-dev], opensuse-tumbleweed: [libxkbcommon-devel], arch: [libxkbcommon]}
  libinput-dev: {el10: [libinput-devel], ubuntu: [libinput-dev], debian: [libinput-dev], opensuse-tumbleweed: [libinput-devel], arch: [libinput]}
  pipewire-dev: {el10: [pipewire-devel], ubuntu: [libpipewire-0.3-dev], debian: [libpipewire-0.3-dev], opensuse-tumbleweed: [pipewire-devel], arch: [libpipewire]}
  gbm-dev: {el10: [mesa-libgbm-devel], ubuntu: [libgbm-dev], debian: [libgbm-dev], opensuse-tumbleweed: [libgbm-devel], arch: [mesa]}
  pixman-dev: {el10: [pixman-devel], ubuntu: [libpixman-1-dev], debian: [libpixman-1-dev], opensuse-tumbleweed: [libpixman-1-0-devel], arch: [pixman]}
  dav1d-dev: {el10: [libdav1d-devel], ubuntu: [libdav1d-dev], debian: [libdav1d-dev], opensuse-tumbleweed: [libdav1d-devel], arch: [dav1d]}
  libdisplay-info-dev: {el10: [libdisplay-info-devel], ubuntu: [libdisplay-info-dev], debian: [libdisplay-info-dev], opensuse-tumbleweed: [libdisplay-info-devel], arch: [libdisplay-info]}
  gettext: {el10: [gettext], ubuntu: [gettext], debian: [gettext], opensuse-tumbleweed: [gettext-tools], arch: [gettext]}
  dbus: {el10: [dbus], ubuntu: [dbus], debian: [dbus], opensuse-tumbleweed: [dbus-1], arch: [dbus]}
  dbus-dev: {el10: [dbus-devel], ubuntu: [libdbus-1-dev], debian: [libdbus-1-dev], opensuse-tumbleweed: [dbus-1-devel], arch: [dbus]}
  bluez: {el10: [bluez-libs], ubuntu: [bluez], debian: [bluez], opensuse-tumbleweed: [bluez], arch: [bluez]}
  bluez-dev: {el10: [bluez-libs-devel], ubuntu: [libbluetooth-dev], debian: [libbluetooth-dev], opensuse-tumbleweed: [bluez-devel], arch: [bluez-libs]}
  lmdb-dev: {el10: [lmdb-devel], ubuntu: [liblmdb-dev], debian: [liblmdb-dev], opensuse-tumbleweed: [lmdb-devel], arch: [lmdb]}
  lmdb: {el10: [lmdb-libs], ubuntu: [liblmdb0], debian: [liblmdb0], opensuse-tumbleweed: [lmdb], arch: [lmdb]}
  pam-dev: {el10: [pam-devel], ubuntu: [libpam0g-dev], debian: [libpam0g-dev], opensuse-tumbleweed: [pam-devel], arch: [pam]}
  flatpak: {el10: [flatpak], ubuntu: [flatpak], debian: [flatpak], opensuse-tumbleweed: [flatpak], arch: [flatpak]}
  extra-cmake-modules: {el10: [extra-cmake-modules], ubuntu: [extra-cmake-modules], debian: [extra-cmake-modules], opensuse-tumbleweed: [extra-cmake-modules], arch: [extra-cmake-modules]}
  kf6-config-dev: {el10: [kf6-kconfig-devel], ubuntu: [libkf6config-dev], debian: [libkf6config-dev], opensuse-tumbleweed: [kf6-kconfig-devel], arch: [kconfig]}
  kf6-runner-dev: {el10: [kf6-krunner-devel], ubuntu: [libkf6runner-dev], debian: [libkf6runner-dev], opensuse-tumbleweed: [kf6-krunner-devel], arch: [krunner]}
  kf6-i18n-dev: {el10: [kf6-ki18n-devel], ubuntu: [libkf6i18n-dev], debian: [libkf6i18n-dev], opensuse-tumbleweed: [kf6-ki18n-devel], arch: [ki18n]}
  kf6-coreaddons-dev: {el10: [kf6-kcoreaddons-devel], ubuntu: [libkf6coreaddons-dev], debian: [libkf6coreaddons-dev], opensuse-tumbleweed: [kf6-kcoreaddons-devel], arch: [kcoreaddons]}
  qt6-base-dev: {el10: [qt6-qtbase-devel], ubuntu: [qt6-base-dev], debian: [qt6-base-dev], opensuse-tumbleweed: [qt6-base-devel], arch: [qt6-base]}
