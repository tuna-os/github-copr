# Build Order Manifest for GNOME 49 on CentOS Stream 10 (EL10)
#
# Source priority:
#   src/gnome-49/  — locally patched specs (SCM builds from this repo)
#   copr_name      — package already registered in COPR; just trigger build-package
#
# Packages within a tier build in parallel; tiers are sequential.
# The bootstrap sequence (glib2 ↔ gobject-introspection circular dep) must
# run before the main glib2/GI full builds.

target: centos-stream-10-x86_64
r2_path: gnome49/10-stream-x86_64

tiers:
  # Tier 0: Pure build tools with no internal deps.
  - name: base-tools
    packages:
      - path: src/gnome-49/meson
        build_tool: true
      - path: src/gnome-49/ninja-build
        build_tool: true
      - path: src/gnome-49/snowball
      - path: src/gnome-49/gnome49-el10-compat
      - path: src/gnome-49/blueprint-compiler
        build_tool: true
      - path: src/gnome-49/libei
      # freerdp requires a custom repack tarball (freerdp_download_and_repack.sh) not fetchable by spectool;
      # keep as COPR-only SCM build, not in GHA pipeline
      - path: src/gnome-49/avahi
      - copr_name: graphviz
      - copr_name: sqlcipher

  # Tier 1: Font/text foundations (harfbuzz needs meson but no GLib yet).
  - name: build-tools
    packages:
      - path: src/gnome-49/harfbuzz
        build_tool: true
      - path: src/gnome-49/fontconfig
      - copr_name: vala

  # Tier 2: Bootstrap GLib (introspection disabled to break circular dep).
  - name: glib2-bootstrap
    packages:
      - path: src/gnome-49/glib2
        spec_override: glib2-bootstrap.spec

  # Tier 4: GI Bootstrap (needs cairo from EL10 base + bootstrap glib2).
  - name: gi-bootstrap
    packages:
      - path: src/gnome-49/gobject-introspection
        spec_override: gobject-introspection-bootstrap.spec

  # Tier 5: Full GLib (needs GI bootstrap for g-ir-scanner).
  - name: glib2-full
    packages:
      - path: src/gnome-49/glib2

  # Tier 6: Full GI (needs full glib2).
  - name: gi-full
    packages:
      - path: src/gnome-49/gobject-introspection

  # Tier 7: Core libraries requiring full GLib + GI.
  - name: core-libraries
    packages:
      - path: src/gnome-49/pango
      - path: src/gnome-49/tinysparql
      - path: src/gnome-49/libcloudproviders
      - path: src/gnome-49/libgexiv2
      - copr_name: libgee
      - path: src/deps/libsoup

  # Tier 8: GTK Core (needs pango + GI).
  - name: gtk-core
    packages:
      - path: src/gnome-49/gtk4
      - path: src/gnome-49/gsettings-desktop-schemas
      - path: src/gnome-49/gnome-desktop3
      - path: src/gnome-49/gsound
      - path: src/gnome-49/colord-gtk
      - path: src/deps/libgda
      - copr_name: highway         # runtime dep of glycin-loaders (bundled libjxl); in EPEL10 but explicit here for self-contained COPR
      - path: src/deps/glycin      # gdk-pixbuf2 2.44.5 image loading backend
      - path: src/deps/gdk-pixbuf2 # 2.44.5 with glycin integration (replaces EL10 2.42.12)

  # Tier 9: GJS + higher-level libs (needs gtk4 + mozjs128 from EPEL + GI).
  - name: gjs-layer
    packages:
      - path: src/gnome-49/gjs
      - path: src/gnome-49/libadwaita
      - path: src/gnome-49/xdg-desktop-portal
      - path: src/gnome-49/localsearch
      - path: src/gnome-49/gnome-online-accounts
      - path: src/gnome-49/tecla

  # Tier 10: Compositor & Shell foundations.
  - name: shell-foundations
    packages:
      - path: src/gnome-49/gnome-settings-daemon
      - path: src/gnome-49/mutter

  # Tier 11: The Shell + portal integration.
  - name: gnome-shell
    packages:
      - path: src/gnome-49/gnome-shell
      - path: src/gnome-49/nautilus
      - path: src/gnome-49/xdg-desktop-portal-gnome

  # Tier 12: Session & Control Center & Display Manager.
  - name: session-layer
    packages:
      - path: src/gnome-49/gnome-session
      - path: src/gnome-49/gnome-control-center
      - path: src/gnome-49/gdm
      - path: src/gnome-49/gnome-remote-desktop
      - path: src/gnome-49/gnome-initial-setup
